<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS Studio · Agentic Workflow Builder — Simulator n8n 8 Aliran</title>
<meta name="description" content="NEXUS Studio — pembina aliran kerja agenik gaya n8n: kanvas nod, pustaka 75 jenis nod, enjin pelaksanaan sebenar (cuba semula, cabang ralat, gelung, keselarasan), garis masa air terjun, kos token dan sejarah pelaksanaan. Berjalan sepenuhnya dalam satu fail HTML.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050a13; --bg2:#08101c; --panel:#0b1421; --panel2:#0f1c2e; --panel3:#132338;
  --line:#1a2c47; --line2:#24405f; --line3:#2f5278;
  --ink:#e9f0fb; --ink2:#9db1cf; --ink3:#8fa3bf;
  --gold:#e2b64c; --gold2:#f0d089;
  --blue:#3f95e0; --teal:#2fbf9f; --red:#f0805f; --violet:#8b7ce8;
  --pink:#e06ea8; --lime:#8fd14f; --amber:#e8a33d;
  --ok:#2fbf9f; --warn:#e2b64c; --bad:#f0805f;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:10px; --rl:14px;
  --c-trigger:#e2b64c; --c-ai:#8b7ce8; --c-logic:#3f95e0; --c-data:#2fbf9f; --c-platform:#e8a33d;
  --topH:58px; --botH:30px; --railL:262px; --railR:348px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--bg2)}
::-webkit-scrollbar-thumb:hover{background:var(--line3)}

/* ============ topbar ============ */
.topbar{height:var(--topH);display:flex;align-items:center;gap:14px;padding:0 14px;
  background:linear-gradient(180deg,#0a1524,#070e19);border-bottom:1px solid var(--line);position:relative;z-index:70}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#a97c1c);
  display:grid;place-items:center;font-weight:800;color:#20160a;font-size:15px;box-shadow:0 0 0 1px rgba(226,182,76,.35),0 4px 14px -4px rgba(226,182,76,.5)}
.brand-tx b{display:block;font-size:13px;font-weight:800;letter-spacing:.05em;line-height:1.15}
.brand-tx span{display:block;font-size:9.5px;color:var(--ink3);letter-spacing:.09em;text-transform:uppercase}
.wf-tabs{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;flex:1;min-width:0;padding:3px 2px;scrollbar-width:thin}
.wf-tab{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:9px;border:1px solid transparent;
  background:transparent;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap;cursor:pointer;transition:.15s}
.wf-tab:hover{background:var(--panel2);color:var(--ink)}
.wf-tab.on{background:rgba(226,182,76,.12);border-color:rgba(226,182,76,.4);color:var(--gold2)}
.wf-tab i{font-style:normal;font-size:13px}
.wf-tab u{text-decoration:none;font-family:var(--mono);font-size:9.5px;padding:1px 5px;border-radius:999px;
  background:var(--panel3);color:var(--ink3)}
.wf-tab .st{width:6px;height:6px;border-radius:50%;background:var(--line3)}
.wf-tab .st.ok{background:var(--ok)} .wf-tab .st.err{background:var(--bad)} .wf-tab .st.run{background:var(--gold);animation:pulse 1.1s infinite}
.tb-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:10px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.badge.sim{background:rgba(226,182,76,.12);color:var(--gold);border:1px solid rgba(226,182,76,.35)}
.badge.ver{background:var(--panel2);color:var(--ink3);border:1px solid var(--line)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.dot.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}
.tb-back{padding:6px 11px;border:1px solid var(--line2);border-radius:8px;font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.tb-back:hover{border-color:var(--gold);color:var(--gold)}

/* ============ layout ============ */
.app{display:flex;height:calc(100vh - var(--topH) - var(--botH));min-height:0}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;flex-shrink:0}
.rail-l{width:var(--railL)}
.rail-r{width:var(--railR);border-right:none;border-left:1px solid var(--line)}
.rail-l.collapsed{width:0;overflow:hidden;border:none}
.rail-head{padding:11px 12px 9px;border-bottom:1px solid var(--line)}
.rail-title{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.search{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);font-size:12px;outline:none}
.search:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(226,182,76,.14)}
.search::placeholder{color:var(--ink3)}
.pal-cats{display:flex;gap:4px;padding:9px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.pcat{padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-size:10.5px;
  font-weight:700;color:var(--ink3);cursor:pointer;letter-spacing:.03em}
.pcat.on{background:rgba(226,182,76,.13);border-color:rgba(226,182,76,.4);color:var(--gold)}
.pal-list{flex:1;overflow-y:auto;padding:8px 8px 14px;min-height:0}
.pal-grp{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  padding:10px 6px 5px;position:sticky;top:0;background:var(--panel);z-index:2}
.pal-i{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;cursor:grab;border:1px solid transparent;transition:.12s}
.pal-i:hover{background:var(--panel2);border-color:var(--line2)}
.pal-i:active{cursor:grabbing}
.pal-i .pi{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.pal-i .pt{min-width:0}
.pal-i .pt b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-i .pt span{display:block;font-size:9.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-foot{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.mini-btn{flex:1;padding:6px 8px;border-radius:7px;border:1px solid var(--line2);background:var(--bg2);
  font-size:10.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.mini-btn:hover{border-color:var(--gold);color:var(--gold)}

/* ============ stage / canvas ============ */
.stage{flex:1;position:relative;min-width:0;background:#070d18;overflow:hidden}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:default}
.ov{position:absolute;z-index:12;pointer-events:none}
.ov>*{pointer-events:auto}
.ov-tl{top:12px;left:12px} .ov-tr{top:12px;right:12px} .ov-bl{bottom:12px;left:12px} .ov-br{bottom:12px;right:12px}
.toolbar{display:flex;align-items:center;gap:6px;padding:6px;border-radius:12px;background:rgba(11,20,33,.93);
  border:1px solid var(--line2);backdrop-filter:blur(10px);box-shadow:0 12px 30px -14px rgba(0,0,0,.85);flex-wrap:wrap;max-width:min(760px,72vw)}
.tb-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;border:1px solid var(--line2);
  background:var(--panel2);font-size:11.5px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;transition:.13s}
.tb-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold2)}
.tb-btn:disabled{opacity:.42;cursor:not-allowed}
.tb-btn.primary{background:linear-gradient(180deg,rgba(226,182,76,.22),rgba(226,182,76,.1));
  border-color:rgba(226,182,76,.5);color:var(--gold2)}
.tb-btn.primary:hover:not(:disabled){background:linear-gradient(180deg,rgba(226,182,76,.34),rgba(226,182,76,.16))}
.tb-btn.ico{padding:6px 9px;font-size:13px;line-height:1}
.tb-btn.on{border-color:var(--gold);color:var(--gold);background:rgba(226,182,76,.14)}
.tb-btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.sep{width:1px;height:20px;background:var(--line2);margin:0 2px}
.spd{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink3);font-weight:600;padding:0 4px}
.spd input{width:82px;accent-color:var(--gold)}
.spd b{font-family:var(--mono);color:var(--gold);min-width:34px;font-size:11px}
.hud{padding:9px 11px;border-radius:11px;background:rgba(11,20,33,.93);border:1px solid var(--line2);
  backdrop-filter:blur(10px);min-width:172px;box-shadow:0 12px 30px -14px rgba(0,0,0,.85)}
.hud-row{display:flex;justify-content:space-between;gap:14px;font-size:11px;padding:2px 0}
.hud-k{color:var(--ink3)}
.hud-row b{font-family:var(--mono);font-weight:600}
.zoombadge{padding:5px 11px;border-radius:9px;background:rgba(11,20,33,.93);border:1px solid var(--line2);
  font-family:var(--mono);font-size:11px;color:var(--ink2)}
.minimap{position:relative;width:210px;height:132px;border-radius:11px;background:rgba(8,16,28,.94);
  border:1px solid var(--line2);overflow:hidden;box-shadow:0 12px 30px -14px rgba(0,0,0,.85)}
.minimap canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.mm-lbl{position:absolute;left:7px;top:5px;font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink3);font-weight:800;pointer-events:none}
.hintbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:6px 14px;border-radius:999px;
  background:rgba(11,20,33,.95);border:1px solid var(--line2);font-size:11.5px;color:var(--ink2);
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;white-space:nowrap;max-width:70vw;overflow:hidden;text-overflow:ellipsis}
.hintbar.on{opacity:1}

/* node floating toolbar */
.ntb{position:absolute;display:none;gap:4px;padding:4px;border-radius:10px;background:rgba(15,28,46,.97);
  border:1px solid var(--line3);z-index:16;box-shadow:0 14px 34px -12px rgba(0,0,0,.9)}
.ntb.on{display:flex}
.ntb button{width:26px;height:26px;border-radius:7px;border:1px solid transparent;background:var(--panel3);
  font-size:12px;line-height:1;cursor:pointer;color:var(--ink2);display:grid;place-items:center}
.ntb button:hover{border-color:var(--gold);color:var(--gold2)}
.ntb button.bad:hover{border-color:var(--bad);color:var(--bad)}

/* context menu */
.ctx{position:absolute;display:none;z-index:40;min-width:196px;padding:5px;border-radius:11px;
  background:rgba(13,23,38,.98);border:1px solid var(--line3);box-shadow:0 20px 46px -14px rgba(0,0,0,.92)}
.ctx.on{display:block}
.ctx-i{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;font-size:12px;cursor:pointer;color:var(--ink2)}
.ctx-i:hover{background:var(--panel3);color:var(--ink)}
.ctx-i i{font-style:normal;width:15px;text-align:center;font-size:12px}
.ctx-i kbd{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
.ctx-sep{height:1px;background:var(--line);margin:4px 6px}
.ctx-h{padding:6px 10px 4px;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);font-weight:800}

/* toasts */
.toasts{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;padding:8px 14px;border-radius:10px;background:rgba(13,23,38,.97);
  border:1px solid var(--line3);font-size:12px;box-shadow:0 14px 34px -12px rgba(0,0,0,.9);animation:tin .22s ease-out}
.toast.ok{border-color:rgba(47,191,159,.55)} .toast.err{border-color:rgba(240,128,95,.6)} .toast.warn{border-color:rgba(226,182,76,.55)}
@keyframes tin{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:none}}

/* ============ right panel ============ */
.rtabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0}
.rtab{flex:1;padding:9px 4px;border:none;background:transparent;font-size:10.5px;font-weight:700;color:var(--ink3);
  cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.02em}
.rtab:hover{color:var(--ink2)}
.rtab.on{color:var(--gold);border-bottom-color:var(--gold);background:rgba(226,182,76,.06)}
.rpane{display:none;flex:1;overflow-y:auto;min-height:0;padding:12px}
.rpane.on{display:block}
.rp-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.rp-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.rp-head .t{min-width:0}
.rp-head .t b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-head .t span{display:block;font-size:10px;color:var(--ink3);font-family:var(--mono)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:11.5px;margin-bottom:12px}
.kv dt{color:var(--ink3)} .kv dd{font-family:var(--mono);text-align:right;word-break:break-all}
.sec-t{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  margin:14px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.pillrow{display:flex;gap:5px;flex-wrap:wrap}
.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:600;
  background:var(--panel3);border:1px solid var(--line2);color:var(--ink2)}
.pill.gold{background:rgba(226,182,76,.12);border-color:rgba(226,182,76,.36);color:var(--gold)}
.pill.ok{background:rgba(47,191,159,.12);border-color:rgba(47,191,159,.36);color:var(--ok)}
.pill.bad{background:rgba(240,128,95,.12);border-color:rgba(240,128,95,.36);color:var(--bad)}
.pill.blue{background:rgba(63,149,224,.12);border-color:rgba(63,149,224,.36);color:#7cb8ea}
.empty{padding:26px 14px;text-align:center;color:var(--ink3);font-size:11.5px;line-height:1.7}
.empty .big{display:block;font-size:26px;margin-bottom:8px;opacity:.45}
.cfg{margin-bottom:10px}
.cfg label{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.cfg input[type=text],.cfg input[type=number],.cfg select,.cfg textarea{width:100%;padding:6px 9px;border-radius:7px;
  border:1px solid var(--line2);background:var(--bg2);font-size:11.5px;outline:none;font-family:var(--mono)}
.cfg textarea{resize:vertical;min-height:62px;line-height:1.5}
.cfg input:focus,.cfg select:focus,.cfg textarea:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(226,182,76,.13)}
.cfg .help{font-size:10px;color:var(--ink3);margin-top:4px;line-height:1.5}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:11.5px}
.switchrow span{color:var(--ink2)}
.sw{width:34px;height:19px;border-radius:999px;background:var(--panel3);border:1px solid var(--line2);position:relative;cursor:pointer;flex-shrink:0}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--ink3);transition:.16s}
.sw.on{background:rgba(47,191,159,.24);border-color:rgba(47,191,159,.5)}
.sw.on::after{left:17px;background:var(--ok)}
table.tbl{width:100%;border-collapse:collapse;font-size:10.5px;font-family:var(--mono)}
table.tbl th{text-align:left;padding:5px 6px;color:var(--ink3);font-weight:700;border-bottom:1px solid var(--line2);
  position:sticky;top:0;background:var(--panel);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase}
table.tbl td{padding:4px 6px;border-bottom:1px solid rgba(26,44,71,.55);vertical-align:top;word-break:break-word}
table.tbl tr:hover td{background:rgba(226,182,76,.05)}
.json{font-family:var(--mono);font-size:10.5px;line-height:1.6;background:var(--bg2);border:1px solid var(--line);
  border-radius:8px;padding:10px;overflow-x:auto;white-space:pre;max-height:340px;overflow-y:auto}
.json .k{color:#7cb8ea} .json .s{color:#8fd14f} .json .n{color:var(--amber)} .json .b{color:var(--violet)}
.logline{font-family:var(--mono);font-size:10.5px;padding:4px 0;border-bottom:1px solid rgba(26,44,71,.5);display:flex;gap:8px}
.logline .ts{color:var(--ink3);flex-shrink:0}
.logline.info .m{color:var(--ink2)} .logline.ok .m{color:var(--ok)} .logline.warn .m{color:var(--warn)} .logline.err .m{color:var(--bad)}

/* executions list */
.exrow{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg2);margin-bottom:6px;cursor:pointer;transition:.13s}
.exrow:hover{border-color:var(--line3);background:var(--panel2)}
.exrow .st{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.exrow .st.ok{background:var(--ok)} .exrow .st.err{background:var(--bad)} .exrow .st.run{background:var(--gold);animation:pulse 1.1s infinite}
.exrow .m{flex:1;min-width:0}
.exrow .m b{display:block;font-size:11.5px;font-family:var(--mono);font-weight:600}
.exrow .m span{display:block;font-size:10px;color:var(--ink3)}
.exrow .d{font-family:var(--mono);font-size:10px;color:var(--ink3);text-align:right;flex-shrink:0}

/* waterfall */
.wfchart{position:relative;padding:6px 0}
.wfrow{display:grid;grid-template-columns:118px 1fr;gap:8px;align-items:center;margin-bottom:4px}
.wfrow .lbl{font-size:10px;font-family:var(--mono);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wfrow .track{position:relative;height:14px;background:var(--bg2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.wfrow .bar{position:absolute;top:0;bottom:0;border-radius:4px;min-width:2px}
.wfrow .bar.ok{background:linear-gradient(90deg,var(--teal),#1f8f77)}
.wfrow .bar.err{background:linear-gradient(90deg,var(--red),#b4573c)}
.wfrow .bar.run{background:linear-gradient(90deg,var(--gold),#a97c1c)}
.wfrow .bar.skip{background:var(--line2)}
.wfrow .bar.wait{background:var(--line)}
.wfticks{display:grid;grid-template-columns:118px 1fr;gap:8px;margin-top:8px}
.wfticks .ax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--ink3);border-top:1px solid var(--line);padding-top:4px}

/* stat bars */
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.statbox{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 10px}
.statbox .v{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--gold2);line-height:1.2}
.statbox .k{font-size:9.5px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.hbar{height:7px;border-radius:4px;background:var(--bg2);overflow:hidden;margin-top:5px}
.hbar i{display:block;height:100%;border-radius:4px}

/* ============ statusbar ============ */
.statusbar{height:var(--botH);display:flex;align-items:center;gap:0;padding:0 12px;background:#070e19;
  border-top:1px solid var(--line);font-size:10.5px;color:var(--ink3);font-family:var(--mono)}
.sb-i{padding:0 11px;border-right:1px solid var(--line);white-space:nowrap}
.sb-i:last-child{border-right:none}
.sb-i b{color:var(--ink2);font-weight:600}
.sb-sp{flex:1}
#sb-run.ok{color:var(--ok)} #sb-run.err{color:var(--bad)} #sb-run.run{color:var(--gold)}

/* ============ modal ============ */
.modal{position:fixed;inset:0;z-index:90;display:none;background:rgba(3,7,13,.76);backdrop-filter:blur(5px);

let _seed = 20261003;
function seedSet(n){ _seed = (n>>>0) || 1; }
function srand(){ _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; }
function ri(a,b){ return a + Math.floor(srand() * (b - a + 1)); }
function rf(a,b){ return a + srand() * (b - a); }
function pick(a){ return a[Math.floor(srand() * a.length)]; }
function pickn(a,n){ const c=a.slice(); const o=[]; while(o.length<n && c.length) o.push(c.splice(Math.floor(srand()*c.length),1)[0]); return o; }
function uid(p){ return (p||'n') + '_' + Math.floor(srand()*1e9).toString(36); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function fmtNum(v){ return (v==null||isNaN(v)) ? '0' : Math.round(v).toLocaleString('en-US'); }
function fmtMoney(v){ return '$' + (v||0).toFixed(4); }
function fmtRM(v){ return 'RM' + ((v||0) * RM_RATE).toFixed(4); }
function fmtDur(ms){ if(ms<1000) return Math.round(ms)+'ms'; if(ms<60000) return (ms/1000).toFixed(1)+'s'; return Math.floor(ms/60000)+'m'+Math.round((ms%60000)/1000)+'s'; }
function fmtTok(n){ if(n<1000) return String(n); if(n<1e6) return (n/1000).toFixed(1)+'k'; return (n/1e6).toFixed(2)+'M'; }
function ts(d){ const x = d||new Date(); const p = v => String(v).padStart(2,'0');
  return p(x.getHours())+':'+p(x.getMinutes())+':'+p(x.getSeconds())+'.'+String(x.getMilliseconds()).padStart(3,'0'); }
function isoLocal(d){ const x=d||new Date(); const p=v=>String(v).padStart(2,'0');
  return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate())+' '+p(x.getHours())+':'+p(x.getMinutes())+':'+p(x.getSeconds()); }

function jsonHtml(o, depth){
  depth = depth || 0;
  if(depth > 6) return '<span class="k">…</span>';
  if(o === null) return '<span class="b">null</span>';
  if(typeof o === 'string') return '<span class="s">"' + esc(o).replace(/\n/g,'\\n') + '"</span>';
  if(typeof o === 'number') return '<span class="n">' + o + '</span>';
  if(typeof o === 'boolean') return '<span class="b">' + o + '</span>';
  if(Array.isArray(o)){
    if(!o.length) return '[]';
    const pad = '  '.repeat(depth+1), pad0 = '  '.repeat(depth);
    return '[\n' + o.map(v => pad + jsonHtml(v, depth+1)).join(',\n') + '\n' + pad0 + ']';
  }
  if(typeof o === 'object'){
    const ks = Object.keys(o);
    if(!ks.length) return '{}';
    const pad = '  '.repeat(depth+1), pad0 = '  '.repeat(depth);
    return '{\n' + ks.map(k => pad + '<span class="k">"' + esc(k) + '"</span>: ' + jsonHtml(o[k], depth+1)).join(',\n') + '\n' + pad0 + '}';
  }
  return esc(String(o));
}

let GEN_STEP = 0;

function ctxOf(wfId){
  const C = CORPUS[wfId] || {};
  return {
    wf: wfId, C: C, step: ++GEN_STEP,
    ix: function(arr, i, fb){ const a = arr && arr.length ? arr : null; return a ? a[(i + this.step) % a.length] : fb; }
  };
}
function rndId(pfx, len){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s='';
  for(let i=0;i<(len||6);i++) s += c[Math.floor(srand()*c.length)]; return (pfx||'') + s; }

function makeItems(node, wfId, nIn, forceN){
  const C = CORPUS[wfId] || {};
  const d = tdef(node.t);
  const ctx = ctxOf(wfId);
  const ix = (a, i, fb) => { const arr = (a && a.length) ? a : null; return arr ? arr[(i + ctx.step) % arr.length] : fb; };
  let n;
  if(forceN != null) n = forceN;
  else if(d.cat === 'trigger') n = ri(1,3);
  else if(nIn > 0) n = nIn;
  else n = ri(1,3);
  n = clamp(n, 1, 12);
  const items = [];
  for(let i=0;i<n;i++) items.push({json: payload(node, C, i, n, ix, ctx)});
  return items;
}

      badan: { ok:true, diproses: ri(1,9) }, masaMs: ri(4, 40) });
    case 'github': return Object.assign(base, { repo: node.p.repo || 'nexus/pipeline',
      isu: '#' + ri(100,9999), status:'dibuka' });
    case 'grafana': return Object.assign(base, { papan: node.p.papan || 'Papan NEXUS',
      anotasi: rndId('an_', 6), tag:['aliran', wf] });
    case 'mqtt': return Object.assign(base, { topik: node.p.topik || 'bangunan/1/telemetri',
      qos: node.p.qos || 1, disimpan: false });
    case 'jira': return Object.assign(base, { projek: node.p.projek || 'OPS', isu:'OPS-' + ri(100,999),
      jenis: node.p.jenis || 'Task', status:'Dicipta' });
    case 'youtube': return Object.assign(base, { videoId: rndId('', 11), privasi: node.p.privasi || 'public',
      status:'diproses', tajuk: ix(C.tajuk, i, 'Video NEXUS') });
    case 'metaAds': return Object.assign(base, { kempen: rndId('cmp_', 8), CPC: +rf(0.42,2.9).toFixed(2),
      tayangan: ri(2000, 90000) });
    case 'tiktok': return Object.assign(base, { videoId: rndId('', 19), tontonan: ri(4000, 900000),
      suka: ri(200, 40000) });
    case 'kafka': return Object.assign(base, { topik: node.p.topik || 'nexus.events',
      partition: ri(0,11), offset: ri(1000,999999) });
    case 'sap': return Object.assign(base, { modul: node.p.modul || 'HCM', idPekerja: 'E' + ri(10000,99999),
      status:'berjaya' });
    case 'gcalendar': return Object.assign(base, { peristiwa: rndId('ev_', 10),
      mula: isoLocal(new Date(now.getTime() + 86400000)), tempohMin: node.p.tempoh || 45 });
    case 'cloudflare': return Object.assign(base, { zon:'nexus.my', cacheHit: +rf(0.62,0.97).toFixed(2),
      tindakan:'purge' });
    case 'vision': case 'ocr': return base;
  }
  return Object.assign(base, { status:'selesai', kependamanMs: lat });
}

/* =====================================================================
   PART E — Enjin pelaksanaan (berasaskan baris gilir, tak segerak sebenar)
   ===================================================================== */

const state = {
  cur:'video',
  view:{scale:1, ox:0, oy:0},
  sel:null, selSet:new Set(), hover:null,
  speed:1, running:false, paused:false,
  exec:null, history:[], exSeq:1000,
  clipboard:null, undo:[], redo:[],
  tab:'node', ndv:null, ndvTab:'param',
  pal:{q:'', cat:'all'},
  drag:null, pan:null, marquee:null,
  maxConc:3,
  autoFollow:true,
};

/* ---------- meta nod: port, cuba semula, cabang ralat ---------- */
const META = {};
const ERRBRANCH = ['http','stripe','shopify','youtube','sap','twilio','sendgrid','smtp',
                   'postgres','s3','mqtt','jira','gmail','hubspot','notion','sheets','slack'];

function buildMeta(){
  WORKFLOWS.forEach(wf => {
    META[wf.id] = {};
    wf.nodes.forEach(n => { META[wf.id][n.id] = computeMetaFor(n); });
  });
}
buildMeta();

function curWF(){ return WORKFLOWS.find(w => w.id === state.cur) || WORKFLOWS[0]; }
function wfById(id){ return WORKFLOWS.find(w => w.id === id); }
function nodeById(wfId, id){ const wf = wfById(wfId); return wf ? wf.nodes.find(n => n.id === id) : null; }
function metaOf(n){ return (META[curWF().id] || {})[n.id] || {out:1, ol:['utama'], errOut:false, errIdx:-1, maxRetries:0, onError:'stopWorkflow'}; }

/* ---------- susun atur automatik ---------- */
const COL_W = 292, ROW_H = 132;
function reflow(wf){
  const maxRow = wf.nodes.reduce((m,n) => Math.max(m, n.r), 0);
  const span = maxRow * ROW_H;
  wf.nodes.forEach(n => {
    n.x = 60 + n.c * COL_W;
    n.y = 140 + n.r * ROW_H - span/2 + 220;
    if(n._dx) n.x += n._dx; if(n._dy) n.y += n._dy;
  });
}
WORKFLOWS.forEach(reflow);

/* ---------- panjang nod untuk saiz kotak ---------- */
function nodeBox(n){ return {w:212, h:74}; }

/* ---------- tempoh nod ---------- */
function nodeDur(n){
  if(n.t === 'wait' || n.t === 'approval'){
    const ms = n.p.ms || (n.t === 'approval' ? 3600000 : 60000);
    return clamp(620 + Math.log10(Math.max(ms, 1000) / 1000) * 880, 620, 3200);
  }
  const p = perf(n.t);
  return rf(p.d0, p.d1);
}
function durLabel(n){
  if(n.t === 'wait') return 'Tunggu ' + humanWait(n.p.ms || 60000);
  if(n.t === 'approval') return 'Kelulusan · SLA ' + (n.p.SLA || '4 jam');
  return null;
}
function humanWait(ms){
  if(ms >= 86400000) return Math.round(ms/86400000) + ' hari';
  if(ms >= 3600000) return Math.round(ms/3600000) + ' jam';
  if(ms >= 60000) return Math.round(ms/60000) + ' minit';
  return Math.round(ms/1000) + ' saat';
}

/* =====================================================================
   Pelaksanaan
   ===================================================================== */
function resetRun(){
  const wf = curWF();
  wf.edges.forEach(e => { e.resolved = false; e.active = true; });
  wf.nodes.forEach(n => { n.runs = 0; n.lastRun = null; });
  state.exec = null;
  state.running = false;
  state.paused = false;
  GEN_STEP = 0;
  syncRunUI(); syncCanvas(); renderPanel();
}

function startRun(){
  if(state.running) return;
  const wf = curWF();
  resetRun();
  state.exSeq++;
  const ex = {
    id:'EX-' + state.exSeq, wf:wf.id, wfNama:wf.nama,
    status:'running', t0:performance.now(), wall0:Date.now(), endT:null,
    nodes:{}, order:[], spans:[], queue:[], running:0,
    pulses:[], logs:[], totals:{items:0, tokens:0, cost:0, nodes:0},
    err:null, stepTarget:null, skippedCount:0, retrying:0,
  };
  wf.nodes.forEach(n => {
    ex.nodes[n.id] = { id:n.id, status:'waiting', items:[], inItems:0, t0:null, t1:null, ms:0,
      tokensIn:0, tokensOut:0, cost:0, retries:0, branch:null, runs:0, logs:[], lastIn:[], note:'' };
  });
  state.exec = ex;
  state.running = true; state.paused = false;
  log(ex, 'info', null, 'Pelaksanaan ' + ex.id + ' bermula — ' + wf.nama + ' (' + wf.nodes.length + ' nod)');

  const targets = new Set(wf.edges.map(e => e.to));
  const entries = wf.nodes.filter(n => !targets.has(n.id));
  if(!entries.length){ log(ex,'err',null,'Tiada nod pencetus ditemui'); finishRun('error'); return; }
  entries.forEach(n => enqueue(n.id, false));
  syncRunUI(); pump();
}

function enqueue(id, viaLoop){
  const ex = state.exec; if(!ex) return;
  const n = nodeById(ex.wf, id); if(!n) return;
  const st = ex.nodes[id];
  if(st.status === 'queued') return;
  st.status = 'queued'; st.note = viaLoop ? 'gelung' : '';
  ex.queue.push(id);
  log(ex, 'info', id, (viaLoop ? 'Gelung semula → ' : 'Dalam baris gilir → ') + n.name);
  syncCanvas();
}

function readyFor(n, ex){
  const wf = wfById(ex.wf);
  const ins = wf.edges.filter(e => e.to === n.id);
  if(!ins.length) return true;
  return ins.every(e => e.resolved);
}

function pump(){
  const ex = state.exec; if(!ex || ex.status !== 'running') return;
  if(state.paused) return;
  while(ex.running < state.maxConc && ex.queue.length){
    const id = ex.queue.shift();
    runNode(id);
  }
  if(ex.running === 0 && ex.retrying === 0 && ex.queue.length === 0 && !ex.pulses.length){
    finishRun(ex.err ? 'error' : 'success');
  }
  syncRunUI();
}

function runNode(id){
  const ex = state.exec; if(!ex) return;
  const n = nodeById(ex.wf, id), st = ex.nodes[id], M = metaOf(n);
  ex.running++;
  st.runs++; n.runs++;
  st.status = 'running';
  st.t0 = performance.now() - ex.t0;
  st.branch = null;
  ex.totals.nodes++;
  log(ex, 'info', id, 'Mula: ' + n.name);

  const dur = nodeDur(n) / state.speed;
  setTimeout(() => {
    if(!state.exec || state.exec !== ex) return;
    completeNode(id, n, st, M, dur);
  }, Math.max(30, dur));
  syncCanvas();
}

function completeNode(id, n, st, M, dur){
  const ex = state.exec;
  const p = perf(n.t);
  const inCount = st.inItems || 1;

  /* --- tentukan ralat --- */
  let failed = false;
  if(p.err > 0 && srand() < p.err){
    if(st.retries < M.maxRetries){
      st.retries++;
      st.status = 'retrying';
      const back = Math.round(240 * Math.pow(2, st.retries - 1) / state.speed);
      log(ex, 'warn', id, 'Ralat sementara — cuba semula ' + st.retries + '/' + M.maxRetries +
          ' (backoff ' + back + 'ms, ' + M.backoff + ')');
      pushNodeLog(st, 'warn', 'Ralat sementara, cuba semula ' + st.retries + '/' + M.maxRetries);
      ex.running--; ex.retrying++;
      setTimeout(() => {
        if(!state.exec || state.exec !== ex) return;
        ex.retrying--;
        ex.running++;
        st.status = 'running';
        setTimeout(() => completeNode(id, n, st, M, dur), Math.max(30, dur / state.speed));
        syncCanvas();
      }, Math.max(60, back));
      syncRunUI(); syncCanvas();
      return;
    }
    failed = true;
  }

  const items = failed ? [] : makeItems(n, ex.wf, inCount);
  st.t1 = performance.now() - ex.t0;
  st.ms = Math.round(st.t1 - st.t0);
  st.items = items;

  /* metrik token & kos */
  let tok = 0, cost = 0;
  items.forEach(it => {
    const j = it.json || {};
    if(j.promptToken) tok += j.promptToken + (j.outputToken || 0);
    if(typeof j.kos === 'number') cost += j.kos;
  });
  st.tokensIn = items.reduce((a,it) => a + ((it.json && it.json.promptToken) || 0), 0);
  st.tokensOut = items.reduce((a,it) => a + ((it.json && it.json.outputToken) || 0), 0);
  st.cost = cost;
  ex.totals.items += items.length;
  ex.totals.tokens += tok;
  ex.totals.cost += cost;
  ex.spans.push({id:id, t0:st.t0, t1:st.t1, status: failed ? 'err' : 'ok'});

  /* tentukan port output aktif bagi nod bercabang */
  st.activePorts = failed ? null : decideBranch(n, items, M, st);

  if(failed){
    st.status = 'error';
    const msg = errMessage(n);
    log(ex, 'err', id, 'RALAT: ' + msg);
    pushNodeLog(st, 'err', msg);
    if(M.onError === 'continueErrorOutput'){
      st.branch = M.errIdx;
      st.activePorts = [M.errIdx];
      log(ex, 'warn', id, 'Dihantar ke keluaran ralat (aliran diteruskan)');
      st.status = 'success';
      st.items = [{ json:{ _ralat:true, nod:n.id, mesej:msg, pada:isoLocal(new Date()) } }];
      ex.totals.items += 1;
    } else {
      ex.err = { node:id, msg:msg };
      ex.running--;
      stopAllFrom(id);
      syncRunUI(); syncCanvas(); renderPanel();
      finishRun('error');
      return;
    }
  } else {
    st.status = 'success';
    log(ex, 'ok', id, 'Selesai — ' + items.length + ' item · ' + st.ms + 'ms' +
        (cost > 0 ? ' · ' + fmtMoney(cost) : ''));
  }
  n.lastRun = st.status;
  ex.running--;
  ex.order.push(id);

  if(state.exec && state.exec.stepTarget && ex.order.length >= state.exec.stepTarget){
    state.paused = true;
    toast('Mod langkah — dijeda selepas ' + ex.order.length + ' nod', 'warn');
  }

  propagate(id, n, st, M);
  syncRunUI(); syncCanvas(); renderPanel();
  pump();
}

/* ---------- keputusan cabang ----------
   Nod bercabang sebenar (Jika / Suis / Kelulusan) mesti memilih port output.
   Kebarangkalian lulus boleh dikonfigur melalui n.p.passRate; secara lalai
   72% benar supaya kedua-dua cabang benar-benar kelihatan semasa demonstrasi. */
function decideBranch(n, items, M, st){
  if(n.t === 'ifNode' || n.t === 'filter'){
    const rate = typeof n.p.passRate === 'number' ? n.p.passRate : 0.72;
    const pass = srand() < rate;
    if(items[0]) items[0].json.hasil = pass;
    st.branch = pass ? 0 : 1;
    return [pass ? 0 : 1];
  }
  if(n.t === 'switchNode'){
    const r = srand();
    const idx = r < 0.4 ? 0 : (r < 0.78 ? 1 : 2);
    if(items[0]) items[0].json.cawanganTerpilih = idx;
    st.branch = idx;
    return [idx];
  }
  if(n.t === 'approval'){
    const k = (items[0] && items[0].json && items[0].json.keputusan) || 'lulus';
    const ok = k === 'lulus';
    st.branch = ok ? 0 : 1;
    return [ok ? 0 : 1];
  }
  st.branch = null;
  return null;
}

function errMessage(n){
  const t = n.t;
  if(t === 'http') return 'HTTP 502 Bad Gateway daripada ' + (n.p.url || 'titik akhir');
  if(t === 'postgres' || t === 'mysql') return 'sambungan pangkalan data tamat masa (pool habis)';
  if(t === 'stripe') return 'kad ditolak — kod: card_declined';
  if(t === 'llm' || t === 'agent') return 'kadar had model dicapai (429) selepas ' + ri(2,5) + ' percubaan';
  if(t === 's3') return 'S3 PutObject: AccessDenied';
  if(t === 'twilio') return 'nombor tidak sah atau tiada kredit';
  return 'operasi gagal selepas cuba semula';
}
function pushNodeLog(st, lvl, msg){ st.logs.push({t:Date.now(), lvl:lvl, m:msg}); if(st.logs.length > 40) st.logs.shift(); }

/* ---------- penyebaran ke nod seterusnya ---------- */
function propagate(id, n, st, M){
  const ex = state.exec; if(!ex) return;
  const wf = wfById(ex.wf);
  const outs = wf.edges.filter(e => e.from === id);
  const act = st.activePorts; /* null | Array<number> */

  /* gelung: hantar pulsa berbilang mengikut jumlah item */
  if(n.t === 'loop' && !n.disabled){
    const batch = Math.max(1, n.p.batchSize || 1);
    const iter = clamp(Math.ceil((st.items.length || 1) / batch), 1, 4);
    const stagger = Math.max(120, 240 / state.speed);
    outs.forEach(e => {
      if(e.out === 0){
        for(let k = 0; k < iter; k++)
          dispatch(e, Math.max(1, Math.ceil(st.items.length / iter)), k * stagger);
      } else {
        dispatch(e, st.items.length, iter * stagger);
      }
    });
    return;
  }

  outs.forEach(e => {
    let on;
    if(act && act.length) on = act.indexOf(e.out) >= 0;
    else on = (e.out === 0) && !(M.errOut && e.out === M.errIdx);
    if(on && !n.disabled) dispatch(e, st.items.length);
    else resolveEdge(e, false);
  });
}

function dispatch(e, count, delay){
  const ex = state.exec;
  const dur = Math.max(90, 420 / state.speed);
  delay = delay || 0;
  e.active = true;
  ex.pulses.push({ edge:e, t0:performance.now(), dur:dur, delay:delay, count:count, loop:e.loop });
  setTimeout(() => {
    if(!state.exec || state.exec !== ex) return;
    ex.pulses = ex.pulses.filter(p => p !== ex.pulses.find(x => x.edge === e && x.delay === delay));
    handleArrival(e, count);
    syncCanvas();
    pump();
  }, delay + dur);
}

function resolveEdge(e, active){
  const ex = state.exec;
  e.resolved = true; e.active = active;
  if(active) return;
  const n = nodeById(ex.wf, e.to); if(!n) return;
  const st = ex.nodes[n.id];
  if(st.status !== 'waiting' && st.status !== 'queued') return;
  if(readyFor(n, ex)){
    const wf = wfById(ex.wf);
    const ins = wf.edges.filter(x => x.to === n.id);
    if(ins.length && ins.every(x => !x.active)) markSkipped(n.id);
    else enqueue(n.id, false);
  }
}

function markSkipped(id){
  const ex = state.exec; if(!ex) return;
  const n = nodeById(ex.wf, id); const st = ex.nodes[id];
  if(st.status === 'skipped') return;
  st.status = 'skipped'; ex.skippedCount++;
  log(ex, 'warn', id, 'Dilangkau — cawangan tidak aktif: ' + n.name);
  const wf = wfById(ex.wf);
  wf.edges.filter(e => e.from === id).forEach(e => resolveEdge(e, false));
}

function handleArrival(e, count){
  const ex = state.exec; if(!ex) return;
  const n = nodeById(ex.wf, e.to); if(!n) return;
  const st = ex.nodes[n.id];
  e.resolved = true; e.active = true;
  st.inItems += count;
  st.lastIn = [{ json:{ _dari:e.from, item:count } }];

  if(st.status === 'success' || st.status === 'error'){
    if(e.loop){
      const cap = n.p.maxIter || 3;
      if(st.runs >= cap){
        log(ex, 'warn', n.id, 'Had gelung ' + cap + ' dicapai — gelung dihentikan (elak tak terhingga)');
        st.note = 'had gelung';
        return;
      }
      log(ex, 'info', n.id, 'Gelung semula (' + (st.runs + 1) + '/' + cap + ')');
      enqueue(n.id, true);
      return;
    }
    return;
  }
  if(readyFor(n, ex)) enqueue(n.id, false);
}

function stopAllFrom(id){
  const ex = state.exec, wf = wfById(ex.wf);
  ex.queue = [];
  const downstream = new Set();
  (function walk(x){ wf.edges.filter(e => e.from === x).forEach(e => {
    if(!downstream.has(e.to)){ downstream.add(e.to); walk(e.to); } }); })(id);
  downstream.forEach(d => {
    const st = ex.nodes[d];
    if(st.status === 'waiting' || st.status === 'queued'){ st.status = 'skipped'; st.note = 'selepas ralat'; }
  });
  wf.nodes.forEach(n => {
    const st = ex.nodes[n.id];
    if(st.status === 'retrying') st.status = 'error';
  });
}

function finishRun(status){
  const ex = state.exec; if(!ex) return;
  ex.status = status;
  ex.endT = performance.now() - ex.t0;
  ex.wallEnd = Date.now();
  state.running = false; state.paused = false;
  const dur = ex.endT;
  log(ex, status === 'success' ? 'ok' : 'err', null,
    'Pelaksanaan ' + ex.id + ' ' + (status === 'success' ? 'BERJAYA' : 'GAGAL') +
    ' — ' + fmtDur(dur) + ' · ' + ex.totals.items + ' item · ' +
    fmtTok(ex.totals.tokens) + ' token · ' + fmtMoney(ex.totals.cost));
  ex.pulses = [];
  state.history.unshift({
    id:ex.id, wf:ex.wf, wfNama:ex.wfNama, status:status,
    dur:dur, items:ex.totals.items, tokens:ex.totals.tokens, cost:ex.totals.cost,
    nodes:ex.totals.nodes, skipped:ex.skippedCount, when:new Date(),
    err:ex.err, rec:ex,
  });
  if(state.history.length > 24) state.history.pop();
  toast(status === 'success'
      ? 'Aliran selesai — ' + fmtDur(dur) + ' · ' + ex.totals.items + ' item'
      : 'Aliran gagal pada ' + (ex.err ? (nodeById(ex.wf, ex.err.node) || {}).name : '—'),
    status === 'success' ? 'ok' : 'err');
  syncRunUI(); syncCanvas(); renderPanel();
}

function pauseRun(){
  if(!state.exec || state.exec.status !== 'running') return;
  state.paused = !state.paused;
  toast(state.paused ? 'Dijeda' : 'Disambung', state.paused ? 'warn' : 'ok');
  if(!state.paused) pump();
  syncRunUI();
}

function stepOnce(){
  if(!state.exec || state.exec.status !== 'running'){
    startRun();
    if(state.exec) state.exec.stepTarget = 1;
    state.paused = true;
    setTimeout(() => { state.paused = false; pump(); }, 30);
    return;
  }
  state.exec.stepTarget = state.exec.order.length + 1;
  state.paused = false;
  pump();
}

function log(ex, lvl, node, msg){
  if(!ex) return;
  ex.logs.push({t:Date.now(), lvl:lvl, node:node, m:msg});
  if(ex.logs.length > 400) ex.logs.shift();
}

/* ---------- laksana satu nod sahaja (butang pada nod) ---------- */
function runSingleNode(id){
  const wf = curWF(), n = wf.nodes.find(x => x.id === id);
  if(!n) return;
  const items = makeItems(n, wf.id, 3);
  toast(n.name + ' → ' + items.length + ' item dijana (pratonton)', 'ok');
  const st = { id:id, status:'success', items:items, inItems:3, t0:0, t1:0,
    ms:ri(40,900), tokensIn:0, tokensOut:0, cost:0, retries:0, branch:null, runs:1, logs:[], lastIn:[], note:'' };
  items.forEach(it => { const j = it.json||{};
    if(j.promptToken) st.tokensIn += j.promptToken;
    if(j.outputToken) st.tokensOut += j.outputToken;
    if(typeof j.kos === 'number') st.cost += j.kos; });
  pushNodeLog(st, 'ok', 'Laksana nod tunggal (pratonton)');
  if(!state.exec){
    state.exec = { id:'PRATONTON', wf:wf.id, wfNama:wf.nama, status:'success', t0:0, endT:0,
      nodes:{}, order:[], spans:[], queue:[], running:0, pulses:[], logs:[],
      totals:{items:items.length, tokens:0, cost:0, nodes:1}, err:null, skippedCount:0 };
  }
  state.exec.nodes[id] = st;
  state.sel = id;
  syncCanvas(); renderPanel();
}

/* =====================================================================
   PART F — Paparan kanvas, peta kecil & gelung animasi
   ===================================================================== */

let cv, cx2d, mmc, mm2d, DPR = 1, dirty = true;
function syncCanvas(){ dirty = true; }

function initCanvas(){
  cv = document.getElementById('canvas');
  cx2d = cv.getContext('2d');
  mmc = document.getElementById('mmc');
  mm2d = mmc.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize', () => { resizeCanvas(); dirty = true; });
}
function resizeCanvas(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const st = document.getElementById('stage');
  const w = st.clientWidth, h = st.clientHeight;
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  cx2d.setTransform(DPR,0,0,DPR,0,0);
  const mm = document.getElementById('minimap');
  mmc.width = Math.round(mm.clientWidth * DPR); mmc.height = Math.round(mm.clientHeight * DPR);
  mm2d.setTransform(DPR,0,0,DPR,0,0);
  dirty = true;
}

/* ---------- transformasi ---------- */
function w2s(x,y){ const v = state.view; return {x: x*v.scale + v.ox, y: y*v.scale + v.oy}; }
function s2w(x,y){ const v = state.view; return {x: (x - v.ox)/v.scale, y: (y - v.oy)/v.scale}; }

function roundRect(c, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r, y); c.lineTo(x+w-r, y); c.quadraticCurveTo(x+w, y, x+w, y+r);
  c.lineTo(x+w, y+h-r); c.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  c.lineTo(x+r, y+h); c.quadraticCurveTo(x, y+h, x, y+h-r);
  c.lineTo(x, y+r); c.quadraticCurveTo(x, y, x+r, y);
  c.closePath();
}

function portPos(n, idx, isOut){
  const M = metaOf(n), b = nodeBox(n);
  const cnt = isOut ? Math.max(1, M.out) : 1;
  return { x: isOut ? n.x + b.w : n.x, y: n.y + b.h * (idx + 1) / (cnt + 1) };
}

function ctrlPoints(a, b, loop){
  if(loop) return { c1x:a.x + 150, c1y:a.y + 150, c2x:b.x - 150, c2y:b.y + 150 };
  const dx = Math.max(56, Math.abs(b.x - a.x) * 0.5);
  return { c1x:a.x + dx, c1y:a.y, c2x:b.x - dx, c2y:b.y };
}
function bezPt(a, cp, b, t){
  const u = 1 - t;
  const x = u*u*u*a.x + 3*u*u*t*cp.c1x + 3*u*t*t*cp.c2x + t*t*t*b.x;
  const y = u*u*u*a.y + 3*u*u*t*cp.c1y + 3*u*t*t*cp.c2y + t*t*t*b.y;
  return {x:x, y:y};
}

/* ---------- warna status ---------- */
const SC = {
  waiting:'#24405f', queued:'#3f95e0', running:'#e2b64c', success:'#2fbf9f',
  error:'#f0805f', skipped:'#1e3350', retrying:'#e8a33d'
};
function statusColor(s){ return SC[s] || SC.waiting; }

/* =====================================================================
   Lukisan utama
   ===================================================================== */
function draw(now){
  if(!cx2d) return;
  const st = document.getElementById('stage');
  const W = st.clientWidth, H = st.clientHeight;
  cx2d.clearRect(0, 0, W, H);
  cx2d.fillStyle = '#070d18';
  cx2d.fillRect(0, 0, W, H);

  const wf = curWF();
  const v = state.view;

  drawGrid(W, H);

  /* kertas nota melekit */
  wf.stickies.forEach(s => drawSticky(s));

  /* tepi */
  drawEdges(wf);

  /* nod */
  wf.nodes.forEach(n => drawNode(n));

  /* denyut di atas segala */
  drawPulses();

  /* segi empat pilih beramai */
  if(state.marquee){
    const m = state.marquee;
    const a = w2s(Math.min(m.x0,m.x1), Math.min(m.y0,m.y1));
    const b = w2s(Math.max(m.x0,m.x1), Math.max(m.y0,m.y1));
    cx2d.fillStyle = 'rgba(226,182,76,.10)';
    cx2d.strokeStyle = 'rgba(226,182,76,.65)';
    cx2d.lineWidth = 1;
    cx2d.fillRect(a.x, a.y, b.x-a.x, b.y-a.y);
    cx2d.strokeRect(a.x+.5, a.y+.5, b.x-a.x, b.y-a.y);
  }
  renderMinimap();
}

function drawGrid(W, H){
  const v = state.view;
  const gap = 26 * v.scale;
  if(gap < 7) return;
  const ox = v.ox % gap, oy = v.oy % gap;
  cx2d.fillStyle = 'rgba(36,64,95,.55)';
  for(let x = ox; x < W; x += gap){
    for(let y = oy; y < H; y += gap){
      cx2d.fillRect(x, y, 1.1, 1.1);
    }
  }
}

function drawSticky(s){
  const v = state.view;
  const p = w2s(s.x, s.y);
  const w = s.w * v.scale, h = s.h * v.scale;
  if(p.x > 4000 || p.y > 4000 || p.x < -w-400 || p.y < -h-400) return;
  const col = s.color === 'red' ? '#f0805f' : (s.color === 'blue' ? '#3f95e0' : '#e2b64c');
  cx2d.save();
  cx2d.fillStyle = 'rgba(11,20,33,.82)';
  roundRect(cx2d, p.x, p.y, w, h, 10); cx2d.fill();
  cx2d.strokeStyle = col + '66'; cx2d.lineWidth = 1; cx2d.stroke();
  cx2d.fillStyle = col; cx2d.fillRect(p.x, p.y, 3, h);
  cx2d.fillStyle = '#9db1cf';
  cx2d.font = Math.max(8, 10.5*v.scale) + 'px Inter, system-ui, sans-serif';
  const lines = String(s.text).split('\n');
  lines.forEach((ln, i) => {
    const first = i === 0;
    cx2d.fillStyle = first ? col : '#8fa3bf';
    cx2d.font = (first ? '700 ' : '400 ') + Math.max(8, 10.5*v.scale) + 'px Inter, system-ui, sans-serif';
    cx2d.fillText(ln, p.x + 11*v.scale, p.y + (17 + i*14)*v.scale);
  });
  cx2d.restore();
}

function edgeStyle(e){
  const ex = state.exec;
  if(!ex) return {c:'#24405f', w:1.6, dash:null, a:1};
  const src = ex.nodes[e.from], dst = ex.nodes[e.to];
  if(!src) return {c:'#24405f', w:1.6, dash:null, a:1};
  if(src.status === 'skipped') return {c:'#1e3350', w:1.2, dash:[5,6], a:.5};
  if(!e.active && e.resolved) return {c:'#1e3350', w:1.2, dash:[5,6], a:.45};
  if(src.status === 'error') return {c:'#f0805f', w:2.2, dash:null, a:1};
  if(src.status === 'retrying') return {c:'#e8a33d', w:2, dash:[6,5], a:1};
  if(src.status === 'running') return {c:'#e2b64c', w:2.4, dash:null, a:1};
  if(src.status === 'queued') return {c:'#3f95e0', w:1.9, dash:[7,7], a:.95};
  if(src.status === 'success') return {c:e.loop ? '#8b7ce8' : '#2fbf9f', w:2, dash:e.loop?[6,6]:null, a:1};
  return {c:'#24405f', w:1.6, dash:null, a:1};
}

function drawEdges(wf){
  const now = performance.now();
  wf.edges.forEach(e => {
    const a = nodeById(wf.id, e.from), b = nodeById(wf.id, e.to);
    if(!a || !b) return;
    const M = metaOf(a);
    const p1 = portPos(a, Math.min(e.out, Math.max(0, M.out-1)), true);
    const p2 = portPos(b, 0, false);
    const s1 = w2s(p1.x, p1.y), s2 = w2s(p2.x, p2.y);
    if(Math.max(s1.x,s2.x) < -300 || Math.min(s1.x,s2.x) > 4000) return;
    const cp = ctrlPoints(s1, s2, e.loop);
    const sty = edgeStyle(e);
    cx2d.save();
    cx2d.globalAlpha = sty.a;
    cx2d.strokeStyle = sty.c;
    cx2d.lineWidth = sty.w;
    if(sty.dash){
      const off = (now / 34) % (sty.dash[0] + sty.dash[1]);
      cx2d.setLineDash(sty.dash); cx2d.lineDashOffset = -off;
    }
    cx2d.beginPath();
    cx2d.moveTo(s1.x, s1.y);
    cx2d.bezierCurveTo(cp.c1x, cp.c1y, cp.c2x, cp.c2y, s2.x, s2.y);
    cx2d.stroke();
    cx2d.setLineDash([]);
    /* anak panah pada hujung */
    cx2d.fillStyle = sty.c;
    cx2d.beginPath();
    cx2d.moveTo(s2.x, s2.y);
    cx2d.lineTo(s2.x - 8, s2.y - 4);
    cx2d.lineTo(s2.x - 8, s2.y + 4);
    cx2d.closePath(); cx2d.fill();
    cx2d.restore();
  });
}

function drawPulses(){
  const ex = state.exec; if(!ex || !ex.pulses.length) return;
  const now = performance.now();
  ex.pulses.forEach(p => {
    const t = clamp((now - p.t0 - (p.delay||0)) / p.dur, 0, 1);
    if(now < p.t0 + (p.delay||0)) return;
    const a = nodeById(ex.wf, p.edge.from), b = nodeById(ex.wf, p.edge.to);
    if(!a || !b) return;
    const M = metaOf(a);
    const pa = portPos(a, Math.min(p.edge.out, Math.max(0, M.out-1)), true);
    const pb = portPos(b, 0, false);
    const sa = w2s(pa.x, pa.y), sb = w2s(pb.x, pb.y);
    const cp = ctrlPoints(sa, sb, p.loop);
    const col = p.loop ? '#8b7ce8' : (p.edge.out > 0 && M.errOut ? '#f0805f' : '#e2b64c');
    /* ekor */
    for(let k = 5; k >= 0; k--){
      const tt = clamp(t - k * 0.035, 0, 1);
      const q = bezPt(sa, cp, sb, tt);
      const r = (3.6 - k * 0.5) * Math.max(.7, state.view.scale);
      cx2d.globalAlpha = (1 - k/6) * .55;
      cx2d.fillStyle = col;
      cx2d.beginPath(); cx2d.arc(q.x, q.y, Math.max(1, r), 0, Math.PI*2); cx2d.fill();
    }
    cx2d.globalAlpha = 1;
    const q = bezPt(sa, cp, sb, t);
    cx2d.shadowColor = col; cx2d.shadowBlur = 12;
    cx2d.fillStyle = col;
    cx2d.beginPath(); cx2d.arc(q.x, q.y, 4.6 * Math.max(.7, state.view.scale), 0, Math.PI*2); cx2d.fill();
    cx2d.shadowBlur = 0;
    if(p.count > 1 && state.view.scale > .55){
      cx2d.fillStyle = '#050a13';
      cx2d.font = '700 ' + (8.5*state.view.scale) + 'px JetBrains Mono, monospace';
      cx2d.textAlign = 'center'; cx2d.textBaseline = 'middle';
      cx2d.fillText(String(p.count), q.x, q.y + 0.5);
      cx2d.textAlign = 'left'; cx2d.textBaseline = 'alphabetic';
    }
  });
}

function drawNode(n){
  const v = state.view;
  const b = nodeBox(n);
  const p = w2s(n.x, n.y);
  const w = b.w * v.scale, h = b.h * v.scale;
  if(p.x > 4200 || p.y > 4200 || p.x + w < -300 || p.y + h < -300) return;

  const d = tdef(n.t);
  const M = metaOf(n);
  const ex = state.exec;
  const st = ex ? ex.nodes[n.id] : null;
  const status = st ? st.status : 'idle';
  const isSel = state.sel === n.id || state.selSet.has(n.id);
  const isHov = state.hover === n.id;
  const col = d.color;
  const sc = v.scale;

  cx2d.save();

  /* bayang + badan */
  if(status === 'running' || status === 'queued'){
    cx2d.shadowColor = statusColor(status); cx2d.shadowBlur = 22;
  }
  cx2d.fillStyle = n.disabled ? '#0a111c' : (status === 'success' ? '#0c1a24' : '#0f1c2e');
  roundRect(cx2d, p.x, p.y, w, h, 12*sc); cx2d.fill();
  cx2d.shadowBlur = 0;

  /* jalur warna kategori */
  cx2d.save();
  roundRect(cx2d, p.x, p.y, w, h, 12*sc); cx2d.clip();
  cx2d.fillStyle = col;
  cx2d.fillRect(p.x, p.y, 4*sc, h);
  if(status === 'success'){
    cx2d.fillStyle = 'rgba(47,191,159,.09)'; cx2d.fillRect(p.x, p.y, w, h);
  } else if(status === 'error'){
    cx2d.fillStyle = 'rgba(240,128,95,.11)'; cx2d.fillRect(p.x, p.y, w, h);
  } else if(status === 'skipped'){
    cx2d.fillStyle = 'rgba(30,51,80,.35)'; cx2d.fillRect(p.x, p.y, w, h);
  } else if(status === 'running'){
    cx2d.fillStyle = 'rgba(226,182,76,.07)'; cx2d.fillRect(p.x, p.y, w, h);
  }
  cx2d.restore();

  /* bingkai */
  cx2d.lineWidth = isSel ? 2 : (isHov ? 1.6 : 1);
  cx2d.strokeStyle = isSel ? '#e2b64c' : (isHov ? '#2f5278' :
      (status === 'error' ? '#f0805f' : (status === 'success' ? '#1f6f5f' : '#24405f')));
  if(n.disabled) cx2d.setLineDash([4,4]);
  roundRect(cx2d, p.x + .5, p.y + .5, w-1, h-1, 12*sc); cx2d.stroke();
  cx2d.setLineDash([]);
  if(isSel){ cx2d.save(); cx2d.shadowColor = '#e2b64c'; cx2d.shadowBlur = 16;
    roundRect(cx2d, p.x+.5, p.y+.5, w-1, h-1, 12*sc); cx2d.stroke(); cx2d.restore(); }

  if(sc > .34){
    /* cip ikon */
    const ic = 26*sc;
    cx2d.fillStyle = col + '26';
    roundRect(cx2d, p.x + 12*sc, p.y + 12*sc, ic, ic, 8*sc); cx2d.fill();
    cx2d.strokeStyle = col + '55'; cx2d.lineWidth = 1; cx2d.stroke();
    cx2d.fillStyle = col;
    cx2d.font = Math.round(14*sc) + 'px system-ui, "Segoe UI Emoji", sans-serif';
    cx2d.textBaseline = 'middle';
    cx2d.fillText(d.ico, p.x + 12*sc + ic/2, p.y + 12*sc + ic/2 + 1);

    /* nama */
    cx2d.fillStyle = n.disabled ? '#6b7f9c' : (status === 'skipped' ? '#7d8fa8' : '#e9f0fb');
    cx2d.font = '600 ' + Math.round(11.5*sc) + 'px Inter, system-ui, sans-serif';
    cx2d.textBaseline = 'alphabetic';
    const maxW = w - 12*sc - ic - 16*sc;
    cx2d.fillText(ellipsis(cx2d, n.name, maxW), p.x + 12*sc + ic + 10*sc, p.y + 25*sc);

    /* jenis */
    cx2d.fillStyle = '#8fa3bf';
    cx2d.font = Math.round(9*sc) + 'px JetBrains Mono, monospace';
    cx2d.fillText(ellipsis(cx2d, d.label, maxW), p.x + 12*sc + ic + 10*sc, p.y + 38*sc);

    /* metrik / status baris bawah */
    cx2d.font = Math.round(9*sc) + 'px JetBrains Mono, monospace';
    let line = '';
    if(st && st.status === 'success'){
      line = st.items.length + ' item · ' + fmtDur(st.ms) + (st.cost>0 ? ' · ' + fmtMoney(st.cost) : '');
    } else if(st && st.status === 'error'){ line = 'RALAT · ' + st.retries + ' cubaan semula'; }
    else if(st && st.status === 'skipped'){ line = 'dilangkau'; }
    else if(st && st.status === 'running'){ line = 'berjalan…'; }
    else if(st && st.status === 'queued'){ line = 'dalam baris gilir'; }
    else if(st && st.status === 'retrying'){ line = 'cuba semula ' + st.retries; }
    else { const dl = durLabel(n); line = dl || ('idle · ' + d.cat); }
    cx2d.fillStyle = st ? statusColor(st.status) : '#6d819c';
    cx2d.fillText(ellipsis(cx2d, line, w - 24*sc), p.x + 12*sc, p.y + h - 13*sc);

    /* jalur kemajuan semasa berjalan */
    if(status === 'running'){
      const t = (performance.now() % 1400) / 1400;
      cx2d.fillStyle = 'rgba(226,182,76,.25)';
      cx2d.fillRect(p.x + 4*sc, p.y + h - 2.5*sc, (w - 8*sc) * t, 2.5*sc);
    }
    /* bilangan larian */
    if(st && st.runs > 1 && sc > .6){
      cx2d.fillStyle = '#8b7ce8';
      cx2d.font = '700 ' + Math.round(8.5*sc) + 'px JetBrains Mono, monospace';
      cx2d.textAlign = 'right';
      cx2d.fillText('×' + st.runs, p.x + w - 10*sc, p.y + h - 13*sc);
      cx2d.textAlign = 'left';
    }
  }

  /* penanda status bulat */
  if(st && st.status !== 'waiting' && sc > .4){
    const r = 4.6*sc;
    const px = p.x + w - r - 7*sc, py = p.y + r + 7*sc;
    cx2d.fillStyle = statusColor(st.status);
    cx2d.beginPath(); cx2d.arc(px, py, r, 0, Math.PI*2); cx2d.fill();
    if(st.status === 'running'){
      cx2d.strokeStyle = 'rgba(226,182,76,.85)'; cx2d.lineWidth = 2;
      cx2d.beginPath(); cx2d.arc(px, py, r + 4 + Math.sin(performance.now()/220)*2, 0, Math.PI*2); cx2d.stroke();
    }
  }

  /* port input */
  const inP = w2s(n.x, n.y + h/(2*sc));
  cx2d.fillStyle = '#0f1c2e'; cx2d.strokeStyle = '#2f5278'; cx2d.lineWidth = 1.6;
  cx2d.beginPath(); cx2d.arc(p.x, p.y + h/2, 5*sc, 0, Math.PI*2); cx2d.fill(); cx2d.stroke();

  /* port output */
  for(let i = 0; i < M.out; i++){
    const pp = portPos(n, i, true);
    const sp = w2s(pp.x, pp.y);
    const isErr = M.errOut && i === M.errIdx;
    cx2d.fillStyle = isErr ? '#f0805f' : '#0f1c2e';
    cx2d.strokeStyle = isErr ? '#f0805f' : col;
    cx2d.lineWidth = 1.6;
    cx2d.beginPath(); cx2d.arc(sp.x, sp.y, 5*sc, 0, Math.PI*2); cx2d.fill(); cx2d.stroke();
    if(M.out > 1 && sc > .62){
      cx2d.fillStyle = isErr ? '#f0805f' : '#8fa3bf';
      cx2d.font = Math.round(8.5*sc) + 'px JetBrains Mono, monospace';
      cx2d.fillText(M.ol[i] || '', sp.x + 9*sc, sp.y + 3*sc);
    }
  }

  /* penanda nota */
  if(n.notes && sc > .5){
    cx2d.fillStyle = '#e2b64c';
    cx2d.font = Math.round(9*sc) + 'px system-ui, sans-serif';
    cx2d.fillText('📝', p.x + w - 16*sc, p.y + 14*sc);
  }
  cx2d.restore();
}

function ellipsis(c, txt, maxW){
  txt = String(txt);
  if(c.measureText(txt).width <= maxW) return txt;
  let lo = 0, hi = txt.length;
  while(lo < hi){
    const mid = Math.ceil((lo + hi) / 2);
    if(c.measureText(txt.slice(0, mid) + '…').width <= maxW) lo = mid; else hi = mid - 1;
  }
  return txt.slice(0, lo) + '…';
}

/* ---------- peta kecil ---------- */
function wfBounds(wf){
  if(!wf.nodes.length) return {x0:0,y0:0,x1:800,y1:600};
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  wf.nodes.forEach(n => { const b = nodeBox(n);
    x0=Math.min(x0,n.x); y0=Math.min(y0,n.y); x1=Math.max(x1,n.x+b.w); y1=Math.max(y1,n.y+b.h); });
  return {x0:x0-70, y0:y0-70, x1:x1+70, y1:y1+70};
}
function renderMinimap(){
  if(!mm2d) return;
  const wf = curWF();
  const mm = document.getElementById('minimap');
  const W = mm.clientWidth, H = mm.clientHeight;
  mm2d.clearRect(0, 0, W, H);
  const bb = wfBounds(wf);
  const sc = Math.min(W / (bb.x1-bb.x0), H / (bb.y1-bb.y0)) * 0.94;
  const ox = (W - (bb.x1-bb.x0)*sc)/2 - bb.x0*sc;
  const oy = (H - (bb.y1-bb.y0)*sc)/2 - bb.y0*sc;
  const ex = state.exec;
  wf.edges.forEach(e => {
    const a = nodeById(wf.id, e.from), b = nodeById(wf.id, e.to);
    if(!a || !b) return;
    let c = '#1e3350';
    if(ex && ex.nodes[e.from]) c = statusColor(ex.nodes[e.from].status);
    mm2d.strokeStyle = c; mm2d.globalAlpha = .55; mm2d.lineWidth = 1;
    mm2d.beginPath();
    mm2d.moveTo(a.x*sc+ox+106*sc, a.y*sc+oy+37*sc);
    mm2d.lineTo(b.x*sc+ox, b.y*sc+oy+37*sc);
    mm2d.stroke();
  });
  mm2d.globalAlpha = 1;
  wf.nodes.forEach(n => {
    const b = nodeBox(n);
    let c = '#24405f';
    if(ex && ex.nodes[n.id]) c = statusColor(ex.nodes[n.id].status);
    else c = tdef(n.t).color + 'aa';
    mm2d.fillStyle = c;
    mm2d.fillRect(n.x*sc+ox, n.y*sc+oy, Math.max(2, b.w*sc), Math.max(1.6, b.h*sc));
  });
  /* segi empat pandangan */
  const st = document.getElementById('stage');
  const tl = s2w(0,0), br = s2w(st.clientWidth, st.clientHeight);
  mm2d.strokeStyle = 'rgba(226,182,76,.9)'; mm2d.lineWidth = 1.2;
  mm2d.strokeRect(tl.x*sc+ox, tl.y*sc+oy, (br.x-tl.x)*sc, (br.y-tl.y)*sc);
}

/* ---------- zum & muat ---------- */
function zoomAt(sx, sy, factor){
  const v = state.view;
  const ns = clamp(v.scale * factor, 0.16, 2.4);
  const before = s2w(sx, sy);
  v.scale = ns;
  v.ox = sx - before.x * ns;
  v.oy = sy - before.y * ns;
  updateZoomBadge(); syncCanvas();
}
function fitView(){
  const wf = curWF(), bb = wfBounds(wf);
  const st = document.getElementById('stage');
  const W = st.clientWidth, H = st.clientHeight;
  const sc = clamp(Math.min(W / (bb.x1-bb.x0), H / (bb.y1-bb.y0)) * 0.92, 0.16, 1.6);
  state.view.scale = sc;
  state.view.ox = (W - (bb.x1-bb.x0)*sc)/2 - bb.x0*sc;
  state.view.oy = (H - (bb.y1-bb.y0)*sc)/2 - bb.y0*sc;
  updateZoomBadge(); syncCanvas();
}
function centerOn(id){
  const n = nodeById(curWF().id, id); if(!n) return;
  const st = document.getElementById('stage');
  const b = nodeBox(n);
  const v = state.view;
  v.ox = st.clientWidth/2 - (n.x + b.w/2) * v.scale;
  v.oy = st.clientHeight/2 - (n.y + b.h/2) * v.scale;
  syncCanvas();
}
function updateZoomBadge(){
  const el = document.getElementById('zoomBadge');
  if(el) el.textContent = Math.round(state.view.scale * 100) + '%';
}

/* ---------- hit testing ---------- */
function nodeAt(wx, wy){
  const wf = curWF();
  for(let i = wf.nodes.length - 1; i >= 0; i--){
    const n = wf.nodes[i], b = nodeBox(n);
    if(wx >= n.x && wx <= n.x + b.w && wy >= n.y && wy <= n.y + b.h) return n;
  }
  return null;
}
function portAt(wx, wy){
  const wf = curWF(), tol = 11;
  for(const n of wf.nodes){
    const b = nodeBox(n), M = metaOf(n);
    if(Math.abs(wx - n.x) < tol && Math.abs(wy - (n.y + b.h/2)) < tol)
      return {node:n, kind:'in', idx:0};
    for(let i = 0; i < M.out; i++){
      const pp = portPos(n, i, true);
      if(Math.abs(wx - pp.x) < tol && Math.abs(wy - pp.y) < tol)
        return {node:n, kind:'out', idx:i};
    }
  }
  return null;
}

/* ---------- gelung animasi ---------- */
let lastClock = 0;
function loop(now){
  const needRedraw = dirty || state.running || (state.exec && state.exec.pulses.length);
  if(needRedraw){ draw(now); dirty = false; }
  if(now - lastClock > 480){ lastClock = now; tickClock(); }
  requestAnimationFrame(loop);
}
function tickClock(){
  const el = document.getElementById('sb-clock');
  if(el) el.textContent = ts(new Date());
  if(state.running && state.exec){
    const t = (performance.now() - state.exec.t0);
    const h = document.getElementById('h-time');
    if(h) h.textContent = fmtDur(t);
  }
}

/* ---------- toast ---------- */
function toast(msg, kind){
  const wrap = $('toasts'); if(!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.innerHTML = '<span>' + (kind === 'ok' ? '✓' : kind === 'err' ? '✕' : kind === 'warn' ? '⚠' : 'ℹ') +
                 '</span><span>' + esc(msg) + '</span>';
  wrap.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0';
    setTimeout(() => el.remove(), 320); }, 3200);
  while(wrap.children.length > 4) wrap.removeChild(wrap.firstChild);
}

/* ---------- tab aliran kerja ---------- */
function buildTabs(){
  const box = $('tabs');

    const rec = state.history.find(h => h.wf === w.id);

    return '<button class="wf-tab' + (w.id === state.cur ? ' on' : '') + '" data-wf="' + w.id + '" role="tab">' +

function switchWorkflow(id){
  if(state.running) resetRun();

  state.exec = null; state.paused = false; state.running = false;

function addNodeAtCenter(type){
  const st = $('stage');
  const c = s2w(st.clientWidth/2, st.clientHeight/2);
  addNode(type, c.x - 106, c.y - 37);
}

function computeMetaFor(n){
  const d = tdef(n.t), p = perf(n.t);
  const errOut = ERRBRANCH.indexOf(n.t) >= 0 && d.cat === 'platform' && n.c % 2 === 0;
  return { out: d.out + (errOut ? 1 : 0), ol: d.ol.concat(errOut ? ['ralat'] : []),
    errOut: errOut, errIdx: errOut ? d.out : -1,
    maxRetries: p.err > 0.02 ? 3 : (p.err > 0 ? 1 : 0), backoff:'exponential',
    onError: errOut ? 'continueErrorOutput' : 'stopWorkflow' };
}

function addNode(type, x, y){
  const wf = curWF();
  pushUndo();
  const d = tdef(type);
  let id = slug(d.label) || type, base = id, k = 2;
  while(wf.nodes.some(n => n.id === id)) id = base + '_' + (k++);
  const n = { id:id, t:type, name:d.label, c:Math.max(0, Math.round((x-60)/COL_W)),
    r:Math.max(0, Math.round((y-360)/ROW_H)), p:{}, x:x, y:y, disabled:false, notes:'', runs:0, lastRun:null };
  wf.nodes.push(n);
  META[wf.id][id] = computeMetaFor(n);
  state.sel = id; state.selSet.clear();
  buildTabs(); renderPanel(); syncRunUI(); syncCanvas();
  toast('Nod “' + d.label + '” ditambah', 'ok');
}

function deleteNode(id){
  const wf = curWF();
  pushUndo();
  wf.nodes = wf.nodes.filter(n => n.id !== id);
  wf.edges = wf.edges.filter(e => e.from !== id && e.to !== id);
  delete META[wf.id][id];
  if(state.sel === id) state.sel = null;
  state.selSet.delete(id);
  if(state.ndv === id) closeNDV();
  buildTabs(); renderPanel(); syncRunUI(); syncCanvas();
  toast('Nod dipadam', 'warn');
}

function duplicateNode(id){
  const wf = curWF();
  const n = wf.nodes.find(x => x.id === id); if(!n) return;
  pushUndo();
  let nid = n.id + '_copy', k = 2;
  while(wf.nodes.some(x => x.id === nid)) nid = n.id + '_copy' + (k++);
  const c = JSON.parse(JSON.stringify({ id:nid, t:n.t, name:n.name + ' (salinan)', c:n.c, r:n.r + 1,
    p:n.p, x:n.x + 30, y:n.y + 96, disabled:n.disabled, notes:n.notes, runs:0, lastRun:null }));
  wf.nodes.push(c);
  META[wf.id][nid] = computeMetaFor(c);
  state.sel = nid;
  buildTabs(); renderPanel(); syncCanvas();
  toast('Nod disalin', 'ok');
}

function toggleDisable(id){
  const n = nodeById(curWF().id, id); if(!n) return;

  n.disabled = !n.disabled;

/* ---------- undo / redo ---------- */
function snapshot(){
  const wf = curWF();
  return { wf:wf.id, nodes: JSON.parse(JSON.stringify(wf.nodes.map(n => ({
    id:n.id, name:n.name, x:n.x, y:n.y, disabled:n.disabled, notes:n.notes, p:n.p, c:n.c, r:n.r })))),
    edges: JSON.parse(JSON.stringify(wf.edges)) };
}
function pushUndo(){
  state.undo.push(snapshot());
  if(state.undo.length > 40) state.undo.shift();
  state.redo = [];
}
function applySnap(s){
  const wf = wfById(s.wf); if(!wf) return;
  wf.edges = JSON.parse(JSON.stringify(s.edges));
  s.nodes.forEach(nn => {
    const n = wf.nodes.find(x => x.id === nn.id);
    if(n){ n.name = nn.name; n.x = nn.x; n.y = nn.y; n.disabled = nn.disabled;
      n.notes = nn.notes; n.p = nn.p; n.c = nn.c; n.r = nn.r; }
  });
  buildTabs(); renderPanel(); syncCanvas();
}
function undo(){
  if(!state.undo.length){ toast('Tiada tindakan untuk diundur', 'warn'); return; }
  state.redo.push(snapshot());
  applySnap(state.undo.pop());
  toast('Diundur', 'ok');
}
function redo(){
  if(!state.redo.length){ toast('Tiada tindakan untuk diulang', 'warn'); return; }
  state.undo.push(snapshot());
  applySnap(state.redo.pop());
  toast('Diulang', 'ok');
}

/* ---------- garis masa air terjun ---------- */
function renderTimeline(){
  const box = $('rp-time');
  const ex = state.exec;
  if(!ex || !ex.spans.length){
    box.innerHTML = '<div class="empty"><span class="big">📊</span>Garis masa air terjun muncul semasa aliran berjalan.<br>Ia menunjukkan nod mana berjalan bila, berapa lama, dan di mana masa dihabiskan.</div>';
    return;
  }
  const total = Math.max(ex.endT || 0, ex.spans.reduce((m,s) => Math.max(m, s.t1), 0), 1);
  const wf = wfById(ex.wf);
  const rows = ex.spans.slice().sort((a,b) => a.t0 - b.t0);
  const conc = computeConcurrency(ex);
  box.innerHTML =
    '<div class="statgrid">' +
      '<div class="statbox"><div class="v">' + fmtDur(total) + '</div><div class="k">Tempoh keseluruhan</div></div>' +
      '<div class="statbox"><div class="v">' + rows.length + '</div><div class="k">Nod dilaksanakan</div></div>' +
      '<div class="statbox"><div class="v">' + conc + '</div><div class="k">Selari puncak</div></div>' +
      '<div class="statbox"><div class="v">' + ex.skippedCount + '</div><div class="k">Nod dilangkau</div></div>' +
    '</div>' +
    '<div class="sec-t">Air terjun nod (masa sebenar)</div>' +
    '<div class="wfchart">' + rows.map(s => {
      const n = nodeById(ex.wf, s.id) || { name:s.id };
      const l = (s.t0/total)*100, w = Math.max(0.6, ((s.t1-s.t0)/total)*100);
      return '<div class="wfrow"><span class="lbl" title="' + esc(n.name) + '">' + esc(n.name) + '</span>' +
        '<span class="track"><span class="bar ' + (s.status === 'ok' ? 'ok' : 'err') + '" style="left:' + l.toFixed(2) + '%;width:' + w.toFixed(2) + '%"></span></span></div>';
    }).join('') + '</div>' +
    '<div class="wfticks"><span></span><span class="ax"><i>0s</i><i>' + fmtDur(total/2) + '</i><i>' + fmtDur(total) + '</i></span></div>' +
    '<div class="sec-t">Nod paling perlahan</div>' +
    rows.slice().sort((a,b) => (b.t1-b.t0) - (a.t1-a.t0)).slice(0,6).map(s => {
      const n = nodeById(ex.wf, s.id) || { name:s.id, t:'http' };
      const ms = s.t1 - s.t0;
      return '<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;font-size:10.5px">' +
        '<span style="font-family:var(--mono);color:var(--ink2)">' + esc(n.name) + '</span>' +
        '<span style="font-family:var(--mono);color:var(--gold)">' + fmtDur(ms) + '</span></div>' +
        '<div class="hbar"><i style="width:' + ((ms/total)*100).toFixed(1) + '%;background:' + tdef(n.t).color + '"></i></div></div>';
    }).join('');
}
function computeConcurrency(ex){
  const ev = [];
  ex.spans.forEach(s => { ev.push([s.t0, 1]); ev.push([s.t1, -1]); });
  ev.sort((a,b) => a[0] - b[0] || a[1] - b[1]);
  let c = 0, mx = 0;
  ev.forEach(e => { c += e[1]; mx = Math.max(mx, c); });
  return mx;
}
