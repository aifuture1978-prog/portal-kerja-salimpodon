<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Islamic Quest — Pengembaraan Ilmu Tahun 3</title>
<meta name="description" content="Laman gamifikasi Pendidikan Islam Tahun 3 (KSSR Semakan 2017) — 7 pulau, 12 unit, kuiz interaktif.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ LANGIT BERBINTANG & AWAN ============ -->
<div class="sky">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="cloud c4"></div>
  <div class="sparkles" id="sparkles"></div>
</div>

<!-- ============ BAR ATAS ============ -->
<header class="topbar">
  <button class="brand" data-go="home" aria-label="Ke peta pengembaraan">
    <span class="brand-badge">IQ</span>
    <span class="brand-text">
      <strong>Islamic Quest</strong>
      <small>Pengembaraan Ilmu · Tahun 3</small>
    </span>
  </button>

  <div class="chips">
    <div class="chip chip-star" title="Bintang Ilmu">
      <span class="chip-ico">⭐</span><span id="starCount">0</span>
    </div>
    <div class="chip chip-streak" title="Streak harian">
      <span class="chip-ico">🔥</span><span id="streakCount">0</span>
    </div>
  </div>

  <nav class="topnav">
    <button class="icobtn" data-go="profile" aria-label="Profil saya"><span>🏅</span><em>Profil</em></button>
    <button class="icobtn" data-go="shop" aria-label="Kedai ganjaran"><span>🛍️</span><em>Kedai</em></button>
    <button class="icobtn" data-go="parent" aria-label="Mod ibu bapa atau guru"><span>👨‍🏫</span><em>Guru</em></button>
    <button class="icobtn" id="btnHelp" aria-label="Bantuan"><span>❓</span><em>Bantuan</em></button>
    <button class="icobtn" id="btnSound" aria-label="Hidup atau matikan bunyi"><span id="soundIco">🔊</span><em>Bunyi</em></button>
  </nav>
</header>

<!-- ============ KANDUNGAN ============ -->
<main id="view" class="view"></main>

<!-- ============ MASKOT ILMU ============ -->
<div class="mascot-wrap" id="mascotWrap">
  <div class="bubble" id="bubble" hidden></div>
  <button class="mascot" id="mascot" aria-label="Maskot Ilmu">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <ellipse cx="100" cy="182" rx="52" ry="9" fill="rgba(15,23,42,.12)"/>
      <!-- ekor -->
      <path class="tail" d="M136 152 q34 4 26 -30" stroke="#f2a33c" stroke-width="13" fill="none" stroke-linecap="round"/>
      <!-- badan -->
      <ellipse cx="100" cy="146" rx="40" ry="34" fill="#ffb84d"/>
      <ellipse cx="100" cy="152" rx="26" ry="24" fill="#ffe0ac"/>
      <!-- kaki -->
      <ellipse cx="76" cy="174" rx="14" ry="9" fill="#f2a33c"/>
      <ellipse cx="124" cy="174" rx="14" ry="9" fill="#f2a33c"/>
      <!-- telinga -->
      <path d="M64 62 L58 20 L96 46 Z" fill="#ffb84d"/>
      <path d="M136 62 L142 20 L104 46 Z" fill="#ffb84d"/>
      <path d="M68 58 L65 32 L88 48 Z" fill="#ff9db3"/>
      <path d="M132 58 L135 32 L112 48 Z" fill="#ff9db3"/>
      <!-- kepala -->
      <circle cx="100" cy="88" r="46" fill="#ffc46b"/>
      <!-- mata -->
      <g class="eyes">
        <ellipse cx="82" cy="84" rx="7.5" ry="9" fill="#1f2937"/>
        <ellipse cx="118" cy="84" rx="7.5" ry="9" fill="#1f2937"/>
        <circle cx="84.5" cy="80" r="2.6" fill="#fff"/>
        <circle cx="120.5" cy="80" r="2.6" fill="#fff"/>
      </g>
      <!-- hidung & mulut -->
      <path d="M95 100 L105 100 L100 106 Z" fill="#ff8fa3"/>
      <path d="M100 106 q-6 8 -12 2" stroke="#1f2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M100 106 q6 8 12 2" stroke="#1f2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- misai -->
      <g stroke="#e08b2a" stroke-width="2.2" stroke-linecap="round">
        <path d="M60 96 L36 90"/><path d="M60 104 L36 106"/>
        <path d="M140 96 L164 90"/><path d="M140 104 L164 106"/>
      </g>
      <!-- aksesori (dipasang/dibuka melalui kedai) -->
      <g id="acc-glasses" class="acc" hidden>
        <circle cx="82" cy="84" r="16" fill="rgba(255,255,255,.35)" stroke="#1f2937" stroke-width="3.5"/>
        <circle cx="118" cy="84" r="16" fill="rgba(255,255,255,.35)" stroke="#1f2937" stroke-width="3.5"/>
        <path d="M98 84 h4" stroke="#1f2937" stroke-width="3.5"/>
      </g>
      <g id="acc-cap" class="acc" hidden>
        <path d="M56 52 q44 -34 88 0 h-88 Z" fill="#2563eb"/>
        <path d="M56 52 q44 10 88 0 v-4 q-44 10 -88 0 Z" fill="#1d4ed8"/>
        <circle cx="100" cy="24" r="6" fill="#fde047"/>
      </g>
      <g id="acc-scarf" class="acc" hidden>
        <path d="M68 128 q32 16 64 0 v14 q-32 16 -64 0 Z" fill="#16a34a"/>
        <path d="M120 138 l14 16 -10 6 -14 -16 Z" fill="#15803d"/>
      </g>
      <g id="acc-crown" class="acc" hidden>
        <path d="M64 44 L74 22 L88 38 L100 16 L112 38 L126 22 L136 44 Z" fill="#fde047" stroke="#eab308" stroke-width="2"/>
        <circle cx="100" cy="36" r="5" fill="#ef4444"/>
      </g>
      <g id="acc-jubah" class="acc" hidden>
        <path d="M74 148 q26 12 52 0 l8 30 q-34 12 -68 0 Z" fill="#7c3aed"/>
      </g>
    </svg>
  </button>
</div>

<!-- ============ MODAL ============ -->
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h3 id="modalTitle">Bantuan</h3>
      <button class="close" id="modalClose" aria-label="Tutup">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="confetti-layer" id="confetti" aria-hidden="true"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
