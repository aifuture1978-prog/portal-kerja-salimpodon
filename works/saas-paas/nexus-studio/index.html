    '<div class="sec-t">Komposisi kategori nod</div>' +
    Object.keys(cats).map(k => {
      const pct = (cats[k]/wf.nodes.length)*100;
      return '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:10.5px">' +
        '<span>' + CAT[k].ico + ' ' + CAT[k].n + '</span><span style="font-family:var(--mono);color:var(--ink3)">' +
        cats[k] + ' · ' + Math.round(pct) + '%</span></div>' +
        '<div class="hbar"><i style="width:' + pct.toFixed(1) + '%;background:' + CAT[k].hex + '"></i></div></div>';
    }).join('') +
    '<div class="sec-t">Penggunaan token & kos (larian semasa)</div>' +
    (ex && tokByNode.length ? tokByNode.slice(0,8).map(x => {
      const max = tokByNode[0].t || 1;
      return '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:10.5px">' +
        '<span style="font-family:var(--mono);color:var(--ink2)">' + esc(x.n.name) + '</span>' +
        '<span style="font-family:var(--mono);color:var(--gold)">' + fmtTok(x.t) + ' · ' + fmtMoney(x.c) + '</span></div>' +
        '<div class="hbar"><i style="width:' + ((x.t/max)*100).toFixed(1) + '%;background:var(--violet)"></i></div></div>';
    }).join('') : '<p style="font-size:11px;color:var(--ink3)">Jalankan aliran untuk melihat penggunaan token dan kos setiap nod.</p>') +
    '<div class="sec-t">Jumlah keseluruhan (semua rekod)</div>' +
    '<dl class="kv"><dt>Item diproses</dt><dd>' + fmtNum(state.history.reduce((a,h) => a + h.items, 0)) + '</dd>' +
      '<dt>Token</dt><dd>' + fmtTok(state.history.reduce((a,h) => a + h.tokens, 0)) + '</dd>' +
      '<dt>Kos terkumpul</dt><dd>' + fmtMoney(state.history.reduce((a,h) => a + h.cost, 0)) + '</dd>' +
      '<dt>Setara RM</dt><dd>' + fmtRM(state.history.reduce((a,h) => a + h.cost, 0)) + '</dd>' +
      '<dt>Pustaka nod tersedia</dt><dd>' + NTYPES.length + ' jenis</dd></dl>';
}

/* ---------- HUD & bar status ---------- */
function syncRunUI(){
  const ex = state.exec;
  const wf = curWF();
  const set = (id, v) => { const e = $(id); if(e) e.textContent = v; };
  set('h-nodes', ex ? ex.totals.nodes : 0);
  set('h-items', ex ? ex.totals.items : 0);
  set('h-tokens', ex ? fmtTok(ex.totals.tokens) : '0');
  set('h-cost', ex ? fmtMoney(ex.totals.cost) : '$0.0000');
  const stTxt = !ex ? 'Sedia' : (ex.status === 'running' ? (state.paused ? 'Dijeda' : 'Berjalan')
      : (ex.status === 'success' ? 'Berjaya' : 'Gagal'));
  set('h-status', stTxt);
  const hs = $('h-status');
  if(hs) hs.style.color = !ex ? 'var(--ink2)' : (ex.status === 'running' ? 'var(--gold)'
      : ex.status === 'success' ? 'var(--ok)' : 'var(--bad)');

  set('sb-wf', wf.nama);
  set('sb-n', wf.nodes.length);
  set('sb-e', wf.edges.length);
  set('sb-sel', state.sel ? (nodeById(wf.id, state.sel) || {}).name : (state.selSet.size ? state.selSet.size + ' nod' : '—'));
  set('sb-cost', ex ? fmtMoney(ex.totals.cost) + ' · ' + fmtRM(ex.totals.cost) : '$0.0000');
  const sr = $('sb-run');
  if(sr){
    sr.className = 'sb-i ' + (ex ? (ex.status === 'running' ? 'run' : ex.status === 'success' ? 'ok' : 'err') : '');
    sr.textContent = !ex ? 'Belum dijalankan'
      : ex.status === 'running' ? 'Berjalan · ' + ex.totals.nodes + ' nod selesai'
      : (ex.status === 'success' ? 'Berjaya · ' + fmtDur(ex.endT) : 'Gagal · ' + (ex.err ? (nodeById(ex.wf, ex.err.node)||{}).name : ''));
  }
  const br = $('btnRun'); if(br){ br.disabled = state.running; }
  const bs = $('btnStep'); if(bs) bs.disabled = false;
  const bp = $('btnPause'); if(bp){ bp.disabled = !(ex && ex.status === 'running');
    bp.classList.toggle('on', state.paused); bp.textContent = state.paused ? '▶ Sambung' : '⏸ Jeda'; }
  const bz = $('btnReset'); if(bz) bz.disabled = false;
  updateZoomBadge();
}

/* =====================================================================
   NDV — Paparan Butiran Nod
   ===================================================================== */
function paramSchema(n){
  const d = tdef(n.t), out = [];
  const model = { k:'model', label:'Model', type:'select', opts:MODELS.map(m => m.id + ' — ' + m.nama + ' ($' + m.inR + '/' + m.outR + ' per 1J)') , help:'Kadar harga sebenar digunakan untuk kira kos token.' };
  switch(n.t){
    case 'llm': case 'agent': case 'summarizer': case 'translator': case 'extractor':
    case 'sentiment': case 'reranker': case 'vision': case 'guard': case 'ocr':
      out.push(model);
      out.push({ k:'temp', label:'Suhu (temperature)', type:'number', help:'0 = deterministik, 1 = kreatif.' });
      out.push({ k:'maxTokens', label:'Token maksimum', type:'number' });
      out.push({ k:'prompt', label:'Prompt sistem', type:'textarea', help:'Arahan kekal untuk model ini.' });
      if(n.p.alat) out.push({ k:'alat', label:'Alat dibenarkan', type:'text', help:'Dipisah dengan koma.' });
      if(n.p.maxSteps) out.push({ k:'maxSteps', label:'Langkah maksimum', type:'number' });
      break;
    case 'embedder':
      out.push(model); out.push({ k:'dimensi', label:'Dimensi vektor', type:'number' }); break;
    case 'vectorStore':
      out.push({ k:'koleksi', label:'Nama koleksi', type:'text' });
      out.push({ k:'topK', label:'Top-K', type:'number' });
      out.push({ k:'op', label:'Operasi', type:'select', opts:['query','upsert','delete'] }); break;
    case 'http':
      out.push({ k:'method', label:'Kaedah', type:'select', opts:['GET','POST','PUT','PATCH','DELETE'] });
      out.push({ k:'url', label:'URL', type:'text' });
      out.push({ k:'timeout', label:'Tamat masa (ms)', type:'number' });
      out.push({ k:'headers', label:'Pen kepala (JSON)', type:'textarea' });
      out.push({ k:'body', label:'Badan permintaan', type:'textarea' });
      out.push({ k:'auth', label:'Pengesahan', type:'select', opts:['tiada','bearer','basic','oauth2','api_key'] });
      break;
    case 'postgres': case 'mysql': case 'mongo': case 'elastic':
      out.push({ k:'op', label:'Operasi', type:'select', opts:['select','insert','update','delete','upsert'] });
      out.push({ k:'table', label:'Jadual / koleksi', type:'text' });
      out.push({ k:'query', label:'Pertanyaan', type:'textarea' });
      out.push({ k:'limit', label:'Had baris', type:'number' }); break;
    case 'redis': out.push({ k:'kunci', label:'Kunci', type:'text' });
      out.push({ k:'ttl', label:'TTL (saat)', type:'number' }); break;
    case 'code':
      out.push({ k:'expr', label:'Ekspresi JavaScript', type:'textarea',
        help:'Pemboleh ubah tersedia: items (tatasusunan), $input. Mesti memulangkan tatasusunan atau objek.' });
      out.push({ k:'mode', label:'Mod', type:'select', opts:['runOnceForAllItems','runOnceForEachItem'] }); break;
    case 'ifNode': case 'filter':
      out.push({ k:'syarat', label:'Syarat', type:'text', help:'Contoh: {{$json.skor}} >= 70' }); break;
    case 'switchNode':
      out.push({ k:'syarat', label:'Medan penilai', type:'text' });
      out.push({ k:'cabang', label:'Nilai cabang', type:'text', help:'Dipisah koma; cabang terakhir ialah lalai.' }); break;
    case 'wait': out.push({ k:'ms', label:'Tempoh tunggu (ms)', type:'number',
        help:'Simulasi memampatkan masa: nod tunggu panjang dipaparkan sebagai bar tetapi tidak menyekat larian.' });
      out.push({ k:'unit', label:'Unit paparan', type:'select', opts:['milisaat','saat','minit','jam','hari'] }); break;
    case 'loop': out.push({ k:'batchSize', label:'Saiz kelompok', type:'number' });
      out.push({ k:'maxIter', label:'Gelung maksimum', type:'number' }); break;
    case 'approval': out.push({ k:'penerima', label:'Pelulus', type:'text' });
      out.push({ k:'SLA', label:'SLA', type:'text' }); break;
    case 'schedule': out.push({ k:'cron', label:'Ungkapan cron', type:'text', help:'5 medan: minit jam hari bulan hari-minggu.' });
      out.push({ k:'zon', label:'Zon masa', type:'text' }); break;
    case 'webhook': out.push({ k:'path', label:'Laluan', type:'text' });
      out.push({ k:'method', label:'Kaedah', type:'select', opts:['GET','POST','PUT'] });
      out.push({ k:'auth', label:'Pengesahan', type:'select', opts:['tiada','header','basic','jwt'] }); break;
    case 'form': out.push({ k:'path', label:'Laluan borang', type:'text' });
      out.push({ k:'fields', label:'Medan', type:'text' }); break;
    case 'slack': case 'discord': case 'telegram':
      out.push({ k:'saluran', label:'Saluran', type:'text' });
      out.push({ k:'teks', label:'Templat mesej', type:'textarea' }); break;
    case 'gmail': case 'sendgrid': case 'smtp':
      out.push({ k:'kepada', label:'Kepada', type:'text' });
      out.push({ k:'subjek', label:'Subjek', type:'text' });
      out.push({ k:'templat', label:'Templat badan', type:'textarea' }); break;
    case 'whatsapp': out.push({ k:'templat', label:'Nama templat', type:'text' });
      out.push({ k:'bahasa', label:'Kod bahasa', type:'text' }); break;
    case 'twilio': out.push({ k:'kepada', label:'Nombor', type:'text' });
      out.push({ k:'jenis', label:'Jenis', type:'select', opts:['sms','panggilan'] }); break;
    case 'sheets': out.push({ k:'spreadsheet', label:'Hamparan', type:'text' });
      out.push({ k:'sheet', label:'Helaian', type:'text' });
      out.push({ k:'op', label:'Operasi', type:'select', opts:['append','read','update','clear'] }); break;
    case 'notion': case 'airtable': case 'trello': case 'monday':
      out.push({ k:'pangkalan', label:'Pangkalan / papan', type:'text' });
      out.push({ k:'op', label:'Operasi', type:'select', opts:['create','update','get','delete'] }); break;
    case 'stripe': out.push({ k:'op', label:'Operasi', type:'select',
        opts:['payment_intent.create','payment_intent.retrieve','charge.capture','refund.create'] });
      out.push({ k:'mataWang', label:'Mata wang', type:'text' }); break;
    case 'shopify': out.push({ k:'topik', label:'Topik', type:'text' });
      out.push({ k:'op', label:'Operasi', type:'select', opts:['get','create','update'] }); break;
    case 's3': case 'azureBlob': case 'gdrive': case 'sftp':
      out.push({ k:'bucket', label:'Bucket / folder', type:'text' });
      out.push({ k:'op', label:'Operasi', type:'select', opts:['upload','download','list','delete'] });
      out.push({ k:'acl', label:'ACL', type:'select', opts:['private','public-read'] }); break;
    case 'mqtt': out.push({ k:'topik', label:'Topik', type:'text' });
      out.push({ k:'qos', label:'QoS', type:'select', opts:['0','1','2'] }); break;
    case 'jira': out.push({ k:'projek', label:'Projek', type:'text' });
      out.push({ k:'jenis', label:'Jenis isu', type:'select', opts:['Task','Bug','Story','Epic'] }); break;
    case 'youtube': out.push({ k:'privasi', label:'Privasi', type:'select', opts:['public','unlisted','private'] });
      out.push({ k:'kategori', label:'Kod kategori', type:'text' });
      out.push({ k:'monetize', label:'Monetisasi', type:'select', opts:['true','false'] }); break;
    case 'setFields': out.push({ k:'medan', label:'Medan ditetapkan', type:'text' });
      out.push({ k:'mod', label:'Mod', type:'select', opts:['tambah','kekalkan','buang'] }); break;
    case 'aggregate': out.push({ k:'mod', label:'Mod agregat', type:'select',
        opts:['aggregateAllItemData','aggregateItems','count'] }); break;
    case 'sort': out.push({ k:'medan', label:'Medan', type:'text' });
      out.push({ k:'tertib', label:'Tertib', type:'select', opts:['menaik','menurun'] }); break;
    case 'limit': out.push({ k:'had', label:'Bilangan maksimum', type:'number' }); break;
    case 'dedupe': out.push({ k:'kunci', label:'Medan kunci', type:'text' }); break;
    case 'outlier': out.push({ k:'metrik', label:'Metrik', type:'text' });
      out.push({ k:'z', label:'Ambang Z', type:'number' }); break;
    case 'mathSum': out.push({ k:'medan', label:'Medan', type:'text' });
      out.push({ k:'tetingkap', label:'Tetingkap', type:'text' }); break;
    case 'errorTrig': out.push({ k:'tangkap', label:'Tangkap daripada', type:'select',
        opts:['semua_nod','nod_tertentu','aliran_lain'] }); break;
    case 'subWorkflow': out.push({ k:'aliran', label:'ID aliran', type:'text' }); break;
    case 'grafana': out.push({ k:'papan', label:'Papan pemuka', type:'text' });
      out.push({ k:'tag', label:'Tag', type:'text' }); break;
    case 'sap': out.push({ k:'modul', label:'Modul', type:'select', opts:['HCM','MM','FI','SD'] });
      out.push({ k:'tindakan', label:'Tindakan', type:'text' }); break;
    case 'gcalendar': out.push({ k:'tempoh', label:'Tempoh (minit)', type:'number' }); break;
    case 'noOp': out.push({ k:'nota', label:'Nota', type:'text' }); break;
  }
  if(!out.length) out.push({ k:'config', label:'Konfigurasi (JSON)', type:'textarea',
    help:'Nod ini tiada parameter wajib; gunakan medan bebas.' });
  return out;
}

function openNDV(id, tab){
  state.ndv = id; state.ndvTab = tab || 'param';
  $('ndv').classList.add('on');
  renderNDV();
}
function closeNDV(){ state.ndv = null; $('ndv').classList.remove('on'); }

function renderNDV(soft){
  if(!state.ndv) return;
  const n = nodeById(curWF().id, state.ndv);
  if(!n){ closeNDV(); return; }
  const d = tdef(n.t), M = metaOf(n), ex = state.exec, st = ex ? ex.nodes[n.id] : null;
  const ico = $('ndv-ico');
  ico.textContent = d.ico;
  ico.style.background = d.color + '22'; ico.style.color = d.color; ico.style.border = '1px solid ' + d.color + '55';
  $('ndv-name').textContent = n.name;
  $('ndv-type').textContent = d.label + ' · ' + n.id + ' · ' + CAT[d.cat].n;

  Array.prototype.forEach.call(document.querySelectorAll('.ndvt'), b => {
    b.classList.toggle('on', b.dataset.t === state.ndvTab);
  });
  const body = $('ndv-body');

  if(state.ndvTab === 'param'){
    const sch = paramSchema(n);
    body.innerHTML = sch.map(f => {
      const v = n.p[f.k] == null ? (f.type === 'select' ? f.opts[0].split(' — ')[0] : '') : n.p[f.k];
      if(f.type === 'select'){
        return '<div class="cfg"><label>' + esc(f.label) + '</label><select data-p="' + f.k + '">' +
          f.opts.map(o => { const val = o.indexOf(' — ') > 0 ? o.split(' — ')[0] : o;
            return '<option value="' + esc(val) + '"' + (String(v) === val ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') +
          '</select>' + (f.help ? '<div class="help">' + esc(f.help) + '</div>' : '') + '</div>';
      }
      if(f.type === 'textarea'){
        return '<div class="cfg"><label>' + esc(f.label) + '</label><textarea data-p="' + f.k + '">' +
          esc(v) + '</textarea>' + (f.help ? '<div class="help">' + esc(f.help) + '</div>' : '') + '</div>';
      }
      return '<div class="cfg"><label>' + esc(f.label) + '</label><input type="' + f.type + '" data-p="' + f.k +
        '" value="' + esc(v) + '">' + (f.help ? '<div class="help">' + esc(f.help) + '</div>' : '') + '</div>';
    }).join('') +
    '<div class="sec-t">Konteks nod</div>' +
    '<dl class="kv"><dt>Jenis</dt><dd>' + n.t + '</dd><dt>Input</dt><dd>' +
      curWF().edges.filter(e => e.to === n.id).length + '</dd><dt>Output</dt><dd>' +
      curWF().edges.filter(e => e.from === n.id).length + '</dd>' +
      '<dt>Port output</dt><dd>' + M.out + '</dd><dt>Kategori</dt><dd>' + CAT[d.cat].n + '</dd></dl>';
    Array.prototype.forEach.call(body.querySelectorAll('[data-p]'), el => {
      el.addEventListener('input', () => {
        let val = el.value;
        if(el.tagName === 'INPUT' && el.type === 'number') val = Number(val);
        n.p[el.dataset.p] = val;
        syncCanvas();
      });
    });
  }

  else if(state.ndvTab === 'in'){
    const items = st && st.lastIn && st.lastIn.length ? st.lastIn
      : makeItems({ id:n.id, t:n.t, p:n.p }, curWF().id, 2, 2);
    body.innerHTML = '<div class="sec-t">Item input (' + items.length + ')</div>' +
      '<div class="json">' + jsonHtml(items) + '</div>' +
      '<div class="sec-t">Jadual</div>' + tableOf(items);
  }

  else if(state.ndvTab === 'out'){
    const items = st && st.items && st.items.length ? st.items
      : makeItems({ id:n.id, t:n.t, p:n.p }, curWF().id, 2, 3);
    const note = st ? '' : '<p style="font-size:11px;color:var(--ink3);margin-bottom:9px">Pratonton data — nod belum dijalankan dalam larian ini.</p>';
    body.innerHTML = note + '<div class="sec-t">Item output (' + items.length + ')</div>' +
      '<div class="json">' + jsonHtml(items) + '</div>' +
      '<div class="sec-t">Jadual</div>' + tableOf(items);
  }

  else if(state.ndvTab === 'set'){
    body.innerHTML =
      '<div class="switchrow"><span>Nyahaktifkan nod</span><span class="sw' + (n.disabled ? ' on' : '') + '" data-sw="disabled"></span></div>' +
      '<div class="switchrow"><span>Cuba semula bila gagal</span><span class="sw' + (M.maxRetries > 0 ? ' on' : '') + '" data-sw="retry"></span></div>' +
      '<div class="switchrow"><span>Teruskan pada output ralat</span><span class="sw' + (M.errOut ? ' on' : '') + '" data-sw="err"></span></div>' +
      '<div class="switchrow"><span>Selalu keluarkan data (alwaysOutputData)</span><span class="sw on" data-sw="always"></span></div>' +
      '<div class="sec-t">Cuba semula</div>' +
      '<div class="cfg"><label>Cubaan maksimum</label><input type="number" data-s="maxRetries" value="' + M.maxRetries + '"></div>' +
      '<div class="cfg"><label>Strategi backoff</label><select data-s="backoff">' +
        ['exponential','fixed','linear'].map(o => '<option' + (M.backoff === o ? ' selected' : '') + '>' + o + '</option>').join('') +
      '</select></div>' +
      '<div class="cfg"><label>Bila ralat</label><select data-s="onError">' +
        ['stopWorkflow','continueRegularOutput','continueErrorOutput'].map(o =>
          '<option value="' + o + '"' + (M.onError === o ? ' selected' : '') + '>' + o + '</option>').join('') +
      '</select></div>' +
      '<div class="sec-t">Nota nod</div>' +
      '<div class="cfg"><textarea data-s="notes" placeholder="Nota untuk pasukan…">' + esc(n.notes) + '</textarea></div>' +
      '<div class="sec-t">Nama paparan</div>' +
      '<div class="cfg"><input type="text" data-s="name" value="' + esc(n.name) + '"></div>' +
      '<p class="help" style="font-size:10.5px;color:var(--ink3);margin-top:8px">Perubahan disimpan pada nod serta-merta dalam sesi ini.</p>';

    Array.prototype.forEach.call(body.querySelectorAll('[data-sw]'), el => {
      el.addEventListener('click', () => {
        const k = el.dataset.sw;
        if(k === 'disabled'){ n.disabled = !n.disabled; el.classList.toggle('on', n.disabled); }
        else if(k === 'retry'){ M.maxRetries = M.maxRetries > 0 ? 0 : 3; el.classList.toggle('on', M.maxRetries > 0); }
        else if(k === 'err'){ const has = M.errOut; el.classList.toggle('on', !has);
          if(has){ M.out = M.out - 1; M.errIdx = -1; M.errOut = false; M.ol = M.ol.slice(0,-1); M.onError = 'stopWorkflow'; }
          else { M.out = M.out + 1; M.errIdx = M.out - 1; M.errOut = true; M.ol = M.ol.concat(['ralat']); M.onError = 'continueErrorOutput'; }
        }
        syncCanvas(); renderNodePanel();
      });
    });
    Array.prototype.forEach.call(body.querySelectorAll('[data-s]'), el => {
      el.addEventListener('input', () => {
        const k = el.dataset.s;
        if(k === 'name'){ n.name = el.value; buildTabs(); renderNodePanel(); }
        else if(k === 'notes'){ n.notes = el.value; }
        else { M[k] = el.type === 'number' ? Number(el.value) : el.value; }
        syncCanvas();
      });
    });
  }

  else if(state.ndvTab === 'log'){
    const logs = (st && st.logs.length ? st.logs : []);
    body.innerHTML = '<div class="sec-t">Log nod (' + logs.length + ')</div>' +
      (logs.length ? logs.map(l => '<div class="logline ' + l.lvl + '"><span class="ts">' + ts(new Date(l.t)) +
        '</span><span class="m">' + esc(l.m) + '</span></div>').join('')
        : '<p style="font-size:11px;color:var(--ink3)">Tiada log nod. Jalankan aliran untuk merekod aktiviti nod ini.</p>') +
      '<div class="sec-t">Log aliran (berkaitan)</div>' +
      ((ex && ex.logs.length) ? ex.logs.filter(l => l.node === n.id).slice(-20).map(l =>
        '<div class="logline ' + l.lvl + '"><span class="ts">' + ts(new Date(l.t)) + '</span><span class="m">' +
        esc(l.m) + '</span></div>').join('') : '<p style="font-size:11px;color:var(--ink3)">—</p>');
  }

  /* footer */
  const tot = st ? (st.tokensIn + st.tokensOut) : 0;
  $('ndv-foot').innerHTML =
    '<span>Status: <b style="color:' + (st ? statusColor(st.status) : 'var(--ink3)') + '">' +
      (st ? st.status : 'belum dijalankan') + '</b></span>' +
    '<span>Item: ' + (st ? st.items.length : '—') + '</span>' +
    '<span>Tempoh: ' + (st ? fmtDur(st.ms) : '—') + '</span>' +
    '<span>Token: ' + (tot ? fmtTok(tot) : '—') + '</span>' +
    '<span>Kos: ' + (st ? fmtMoney(st.cost) + ' · ' + fmtRM(st.cost) : '—') + '</span>' +
    '<span>Cuba semula: ' + (st ? st.retries : 0) + '</span>';
}

function tableOf(items){
  if(!items || !items.length) return '<p style="font-size:11px;color:var(--ink3)">Tiada item.</p>';
  const keys = [];
  items.forEach(it => Object.keys(it.json || {}).forEach(k => { if(keys.indexOf(k) < 0) keys.push(k); }));
  const cols = keys.slice(0, 8);
  return '<div style="overflow-x:auto"><table class="tbl"><thead><tr>' +
    cols.map(k => '<th>' + esc(k) + '</th>').join('') + '</tr></thead><tbody>' +
    items.slice(0, 12).map(it => '<tr>' + cols.map(k => {
      let v = (it.json || {})[k];
      if(v && typeof v === 'object') v = JSON.stringify(v);
      if(typeof v === 'string' && v.length > 34) v = v.slice(0, 34) + '…';
      return '<td>' + esc(v == null ? '' : v) + '</td>';
    }).join('') + '</tr>').join('') + '</tbody></table></div>' +
    (items.length > 12 ? '<p style="font-size:10px;color:var(--ink3);margin-top:6px">…dan ' + (items.length-12) + ' item lagi</p>' : '');
}

/* =====================================================================
   Menu konteks
   ===================================================================== */
function showCtx(x, y, items){
  const el = $('ctx');
  el.innerHTML = items.map(it => it.sep ? '<div class="ctx-sep"></div>'
    : it.head ? '<div class="ctx-h">' + esc(it.head) + '</div>'
    : '<div class="ctx-i" data-a="' + it.a + '"><i>' + it.ico + '</i>' + esc(it.t) +
      (it.k ? '<kbd>' + it.k + '</kbd>' : '') + '</div>').join('');
  el.classList.add('on');
  const st = $('stage').getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.min(x, st.width - w - 8) + 'px';
  el.style.top = Math.min(y, st.height - h - 8) + 'px';
  Array.prototype.forEach.call(el.querySelectorAll('.ctx-i'), b => {
    b.addEventListener('click', () => { hideCtx(); ctxAction(b.dataset.a); });
  });
}
function hideCtx(){ $('ctx').classList.remove('on'); }

function ctxAction(a){
  const id = state.sel;
  const wf = curWF();
  switch(a){
    case 'run': startRun(); break;
    case 'step': stepOnce(); break;
    case 'reset': resetRun(); toast('Aliran diset semula', 'ok'); break;
    case 'fit': fitView(); break;
    case 'autolayout': reflow(wf); syncCanvas(); toast('Susun atur automatik digunakan', 'ok'); break;
    case 'runnode': if(id) runSingleNode(id); break;
    case 'ndv': if(id) openNDV(id, 'param'); break;
    case 'dup': if(id) duplicateNode(id); break;
    case 'del': if(id) deleteNode(id); break;
    case 'disable': if(id) toggleDisable(id); break;
    case 'copy': if(id) copyNode(id); break;
    case 'paste': pasteNode(); break;
    case 'note': if(id){ const t = prompt('Nota untuk nod ini:', nodeById(wf.id, id).notes || '');
      if(t != null){ pushUndo(); nodeById(wf.id, id).notes = t; renderPanel(); syncCanvas(); } } break;
    case 'addwebhook': addNodeAtCenter('webhook'); break;
    case 'addllm': addNodeAtCenter('llm'); break;
    case 'addhttp': addNodeAtCenter('http'); break;
    case 'addif': addNodeAtCenter('ifNode'); break;
    case 'shortcuts': $('scModal').classList.add('on'); break;
  }
}

function copyNode(id){
  const n = nodeById(curWF().id, id); if(!n) return;
  state.clipboard = JSON.parse(JSON.stringify(n));
  toast('Nod disalin ke papan klip', 'ok');
}
function pasteNode(){
  if(!state.clipboard){ toast('Papan klip kosong', 'warn'); return; }
  const wf = curWF(), src = state.clipboard;
  pushUndo();
  let nid = src.id + '_p', k = 2;
  while(wf.nodes.some(n => n.id === nid)) nid = src.id + '_p' + (k++);
  const n = JSON.parse(JSON.stringify(src));
  n.id = nid; n.name = src.name + ' (tampal)'; n.x += 40; n.y += 40; n.runs = 0; n.lastRun = null;
  wf.nodes.push(n);
  META[wf.id][nid] = computeMetaFor(n);
  state.sel = nid;
  buildTabs(); renderPanel(); syncCanvas();
  toast('Nod ditampal', 'ok');
}

/* =====================================================================
   Input papan kekunci & tetikus
   ===================================================================== */
function bindStage(){
  const stage = $('stage');

  stage.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  stage.addEventListener('drop', e => {
    e.preventDefault();
    const t = e.dataTransfer.getData('text/nexus-node');
    if(!t || !T[t]) return;
    const r = stage.getBoundingClientRect();
    const w = s2w(e.clientX - r.left, e.clientY - r.top);
    addNode(t, w.x - 106, w.y - 37);
  });

  let moved = false;
  stage.addEventListener('mousedown', e => {
    if(e.target !== cv) return;
    hideCtx();
    const r = stage.getBoundingClientRect();
    const sx = e.clientX - r.left, sy = e.clientY - r.top;
    const w = s2w(sx, sy);
    const p = portAt(w.x, w.y);
    if(p && p.kind === 'out' && e.shiftKey){ state.link = { from:p.node.id, out:p.idx }; hint('Lepaskan pada nod sasaran untuk menyambung'); return; }
    const n = nodeAt(w.x, w.y);
    if(e.button === 2) return;
    if(n){
      if(e.shiftKey){ if(state.selSet.has(n.id)) state.selSet.delete(n.id); else state.selSet.add(n.id); }
      else if(!state.selSet.has(n.id)){ state.selSet.clear(); state.sel = n.id; }
      const dragIds = state.selSet.size ? Array.from(state.selSet) : [n.id];
      state.drag = { ids:dragIds, sx:sx, sy:sy,
        orig: dragIds.map(i => { const x = nodeById(curWF().id, i); return {id:i, x:x.x, y:x.y}; }),
        moved:false };
      moved = false;
    } else {
      state.pan = { sx:sx, sy:sy, ox:state.view.ox, oy:state.view.oy };
      if(!e.shiftKey){ state.sel = null; state.selSet.clear(); }
      state.marquee = { x0:w.x, y0:w.y, x1:w.x, y1:w.y, add:e.shiftKey };
      renderPanel();
    }
    syncCanvas();
  });

  window.addEventListener('mousemove', e => {
    const r = stage.getBoundingClientRect();
    const sx = e.clientX - r.left, sy = e.clientY - r.top;
    if(state.drag){
      const d = state.drag;
      if(Math.abs(sx-d.sx) > 2 || Math.abs(sy-d.sy) > 2){ d.moved = true; if(!moved){ pushUndo(); moved = true; } }
      const dx = (sx - d.sx)/state.view.scale, dy = (sy - d.sy)/state.view.scale;
      d.orig.forEach(o => { const n = nodeById(curWF().id, o.id); if(n){ n.x = o.x + dx; n.y = o.y + dy; } });
      syncCanvas(); return;
    }
    if(state.pan){
      state.view.ox = state.pan.ox + (sx - state.pan.sx);
      state.view.oy = state.pan.oy + (sy - state.pan.sy);
      syncCanvas(); return;
    }
    if(state.marquee){
      const w = s2w(sx, sy);
      state.marquee.x1 = w.x; state.marquee.y1 = w.y;
      const x0 = Math.min(state.marquee.x0, w.x), x1 = Math.max(state.marquee.x0, w.x);
      const y0 = Math.min(state.marquee.y0, w.y), y1 = Math.max(state.marquee.y0, w.y);
      const sel = curWF().nodes.filter(n => { const b = nodeBox(n);
        return n.x + b.w > x0 && n.x < x1 && n.y + b.h > y0 && n.y < y1; });
      state.selSet = new Set(sel.map(n => n.id));
      if(sel.length) state.sel = sel[0].id;
      syncCanvas(); renderNodePanel(); syncRunUI();
      return;
    }
    if(state.hover !== undefined){
      const w = s2w(sx, sy);
      const n = nodeAt(w.x, w.y);
      const hid = n ? n.id : null;
      if(hid !== state.hover){ state.hover = hid; syncCanvas();
        if(n) showNtb(n); else hideNtb(); }
    }
  });

  window.addEventListener('mouseup', e => {
    if(state.link){
      const r = stage.getBoundingClientRect();
      const w = s2w(e.clientX - r.left, e.clientY - r.top);
      const t = nodeAt(w.x, w.y);
      if(t && t.id !== state.link.from){
        pushUndo();
        curWF().edges.push(E(state.link.from, t.id, state.link.out));
        toast('Sambungan ditambah: ' + state.link.from + ' → ' + t.id, 'ok');
        syncCanvas(); renderPanel();
      }
      state.link = null; hint('');
    }
    if(state.marquee){ state.marquee = null; syncCanvas(); }
    if(state.drag){ state.drag = null; }
    if(state.pan){ state.pan = null; }
  });

  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    const sx = e.clientX - r.left, sy = e.clientY - r.top;
    if(e.ctrlKey || e.metaKey || Math.abs(e.deltaY) > 40){
      zoomAt(sx, sy, e.deltaY < 0 ? 1.12 : 1/1.12);
    } else {
      state.view.ox -= e.deltaX; state.view.oy -= e.deltaY; syncCanvas();
    }
  }, { passive:false });

  cv.addEventListener('dblclick', e => {
    const r = stage.getBoundingClientRect();
    const w = s2w(e.clientX - r.left, e.clientY - r.top);
    const n = nodeAt(w.x, w.y);
    if(n) openNDV(n.id, 'param');
    else { $('palSearch').focus(); hint('Taip untuk mencari nod, atau seret dari pustaka'); }
  });

  cv.addEventListener('contextmenu', e => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const w = s2w(x, y);
    const n = nodeAt(w.x, w.y);
    if(n){
      state.sel = n.id;
      showCtx(x, y, [
        { head:n.name },
        { a:'ndv', ico:'⚙', t:'Buka parameter', k:'Dbl-klik' },
        { a:'runnode', ico:'▶', t:'Jalankan nod ini' },
        { a:'dup', ico:'⧉', t:'Salin pendua', k:'Ctrl+D' },
        { a:'copy', ico:'📋', t:'Salin', k:'Ctrl+C' },
        { a:'disable', ico:'⏻', t:(n.disabled ? 'Aktifkan' : 'Nyahaktifkan') },
        { a:'note', ico:'📝', t:'Tambah / ubah nota' },
        { sep:true },
        { a:'del', ico:'🗑', t:'Padam', k:'Del' },
      ]);
    } else {
      showCtx(x, y, [
        { head:'Kanvas' },
        { a:'run', ico:'▶', t:'Jalankan aliran', k:'Ctrl+↵' },
        { a:'step', ico:'⏭', t:'Langkah seterusnya', k:'→' },
        { a:'reset', ico:'⟲', t:'Set semula', k:'Ctrl+R' },
        { sep:true },
        { head:'Tambah nod' },
        { a:'addwebhook', ico:'⚡', t:'Pencetus Webhook' },
        { a:'addllm', ico:'🧠', t:'Model Bahasa' },
        { a:'addhttp', ico:'🌐', t:'Permintaan HTTP' },
        { a:'addif', ico:'🔀', t:'Jika' },
        { sep:true },
        { a:'paste', ico:'📋', t:'Tampal', k:'Ctrl+V' },
        { a:'fit', ico:'⤢', t:'Muat ke skrin', k:'F' },
        { a:'autolayout', ico:'⇲', t:'Susun atur automatik' },
        { a:'shortcuts', ico:'⌨', t:'Pintasan papan kekunci', k:'?' },
      ]);
    }
    renderPanel();
  });

  /* klik pada peta kecil untuk melompat */
  mmc.addEventListener('click', e => {
    const r = mmc.getBoundingClientRect();
    const wf = curWF(), bb = wfBounds(wf);
    const W = mmc.clientWidth, H = mmc.clientHeight;
    const sc = Math.min(W/(bb.x1-bb.x0), H/(bb.y1-bb.y0)) * 0.94;
    const ox = (W - (bb.x1-bb.x0)*sc)/2 - bb.x0*sc;
    const oy = (H - (bb.y1-bb.y0)*sc)/2 - bb.y0*sc;
    const wx = ((e.clientX - r.left) - ox)/sc, wy = ((e.clientY - r.top) - oy)/sc;
    const st = $('stage');
    state.view.ox = st.clientWidth/2 - wx*state.view.scale;
    state.view.oy = st.clientHeight/2 - wy*state.view.scale;
    syncCanvas();
  });
}

/* ---------- papan kekunci ---------- */
function bindKeys(){
  window.addEventListener('keydown', e => {
    const inField = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || '')) || e.target.isContentEditable;
    const mod = e.ctrlKey || e.metaKey;

    if(e.key === 'Escape'){
      if($('scModal').classList.contains('on')) { $('scModal').classList.remove('on'); return; }
      if(state.ndv){ closeNDV(); return; }
      if($('ctx').classList.contains('on')){ hideCtx(); return; }
      state.sel = null; state.selSet.clear(); renderPanel(); syncCanvas(); return;
    }
    if(inField && e.key !== 'Escape') return;

    if(mod && e.key === 'Enter'){ e.preventDefault(); startRun(); return; }
    if(mod && (e.key === 'r' || e.key === 'R')){ e.preventDefault(); resetRun(); toast('Aliran diset semula', 'ok'); return; }
    if(mod && (e.key === 'd' || e.key === 'D')){ e.preventDefault(); if(state.sel) duplicateNode(state.sel); return; }
    if(mod && (e.key === 'c' || e.key === 'C')){ e.preventDefault(); if(state.sel) copyNode(state.sel); return; }
    if(mod && (e.key === 'v' || e.key === 'V')){ e.preventDefault(); pasteNode(); return; }
    if(mod && (e.key === 'z' || e.key === 'Z')){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); return; }
    if(mod && (e.key === 'y' || e.key === 'Y')){ e.preventDefault(); redo(); return; }
    if(mod && (e.key === 'a' || e.key === 'A')){
      e.preventDefault();
      state.selSet = new Set(curWF().nodes.map(n => n.id)); syncCanvas(); syncRunUI(); return; }

    switch(e.key){
      case ' ': e.preventDefault(); pauseRun(); break;
      case 'ArrowRight': e.preventDefault(); stepOnce(); break;
      case 'f': case 'F': fitView(); break;
      case '+': case '=': zoomAt($('stage').clientWidth/2, $('stage').clientHeight/2, 1.18); break;
      case '-': case '_': zoomAt($('stage').clientWidth/2, $('stage').clientHeight/2, 1/1.18); break;
      case 'Delete': case 'Backspace': if(state.sel){ e.preventDefault(); deleteNode(state.sel); } break;
      case '/': e.preventDefault(); $('palSearch').focus(); break;
      case '?': $('scModal').classList.add('on'); break;
      case 'n': case 'N': addNodeAtCenter('noOp'); break;
    }
    /* gerakkan nod terpilih */
    if(state.sel && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.key) < 0){
      /* tiada */
    }
  });

  window.addEventListener('keydown', e => {
    if(!state.sel) return;
    const inField = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''));
    if(inField || e.ctrlKey || e.metaKey || e.altKey) return;
    const map = { ArrowUp:[0,-12], ArrowDown:[0,12], ArrowLeft:[-12,0], ArrowRight:[12,0] };
    if(!map[e.key]) return;
    e.preventDefault();
    const n = nodeById(curWF().id, state.sel);
    n.x += map[e.key][0]; n.y += map[e.key][1];
    syncCanvas();
  });
}

}

function navNDV(dir){
  const wf = curWF();
  const i = wf.nodes.findIndex(n => n.id === state.ndv);
  const j = (i + dir + wf.nodes.length) % wf.nodes.length;
  state.ndv = wf.nodes[j].id;
  state.sel = state.ndv;
  renderNDV(); renderNodePanel(); centerOn(state.ndv); syncRunUI();
}

  try{
    initCanvas();
    buildTabs();

    renderShortcuts();
    bindControls();
    bindStage();

    renderPanel();

    setTimeout(() => hint('Selamat datang ke NEXUS Studio — ' + wf.nodes.length +
      ' nod dimuatkan. Tekan ▶ Jalankan, atau seret nod daripada pustaka.'), 500);

    /* ---------------- API untuk suite pengesahan ---------------- */
    window.NEXUS = {
      version:'2.0.0',
      ready:true,
      errors:BOOT_ERRORS,
      state:state,
      workflows:WORKFLOWS,
      nodeTypes:T,
      models:MODELS,

        return {
          workflows:WORKFLOWS.length,

          types:NTYPES.length,
          stickies:WORKFLOWS.reduce((a,w) => a + w.stickies.length, 0),
          branches:WORKFLOWS.reduce((a,w) => a + w.nodes.filter(n => metaOfIn(w.id, n).out > 1).length, 0),
          errBranches:WORKFLOWS.reduce((a,w) => a + w.nodes.filter(n => metaOfIn(w.id, n).errOut).length, 0),
        };
      },
      wf(id){ return wfById(id); },
      wfNodeCount(id){ const w = wfById(id); return w ? w.nodes.length : 0; },
      curWF(){ return curWF().id; },
      switchWorkflow:switchWorkflow,
      startRun:startRun,
      stepOnce:stepOnce,
      pauseRun:pauseRun,
      resetRun:resetRun,
      runNode:runSingleNode,
      isRunning(){ return state.running; },
      isPaused(){ return state.paused; },
      exec(){ return state.exec; },
      history(){ return state.history; },
      nodeState(id){ return state.exec ? state.exec.nodes[id] : null; },
      nodeById(id){ return nodeById(curWF().id, id); },
      openNDV:openNDV,
      closeNDV:closeNDV,
      setTab:setTab,
      fitView:fitView,
      addNode:addNodeAtCenter,
      addNodeAt:addNode,
      deleteNode:deleteNode,
      duplicateNode:duplicateNode,
      toggleDisable:toggleDisable,
      undo:undo, redo:redo,
      setSpeed(v){ state.speed = v; $('speed').value = v; $('speedVal').textContent = v.toFixed(1) + '×'; },
      setMaxConc(n){ state.maxConc = n; },

        $('speedVal').textContent = '3.0×'; return true; },
      paletteCount(){ return document.querySelectorAll('.pal-i').length; },
      paletteTotal(){ return NTYPES.length; },
      setPaletteQuery(q){ state.pal.q = q; $('palSearch').value = q; renderPalette(); },
      setPaletteCat(c){ state.pal.cat = c; renderPalette(); },
      zoom(){ return state.view.scale; },
      selected(){ return state.sel; },
      execOrder(){ return state.exec ? state.exec.order.slice() : []; },
      timelineRows(){ return state.exec ? state.exec.spans.length : 0; },
      logs(){ return state.exec ? state.exec.logs.length : 0; },
      samplePayload(type, n){
        const wf = curWF();
        return makeItems({ id:'ujian', t:type, p:{} }, wf.id, 2, n || 2);
      },
      runToCompletion(timeout){
        return new Promise((res, rej) => {
          const t0 = Date.now();
          if(!state.running) startRun();
          const iv = setInterval(() => {
            const done = !state.exec || state.exec.status !== 'running';
            if(done){ clearInterval(iv); res(state.exec); }
            else if(Date.now() - t0 > (timeout || 90000)){ clearInterval(iv); rej(new Error('tamat masa')); }
          }, 50);
        });
      },
    };
    document.documentElement.setAttribute('data-nexus-ready','1');
  } catch(err){
    BOOT_ERRORS.push({ jenis:'boot', mesej:String(err && err.message || err) });
    document.documentElement.setAttribute('data-nexus-error', String(err && err.message || err));
  }
}

/* meta bagi nod dalam aliran tertentu (untuk API) */
function metaOfIn(wfId, n){
  return (META[wfId] && META[wfId][n.id]) || computeMetaFor(n);
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
