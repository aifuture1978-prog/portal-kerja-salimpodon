function enc(obj) {
  try {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    const s = new TextEncoder().encode(SALT);
    for (let i = 0; i < bytes.length; i++) bytes[i] ^= s[i % s.length];
    let bin = ''; for (const b of bytes) bin += String.fromCharCode(b);
    return btoa(bin);
  } catch { return ''; }
}
function dec(txt) {
  try {
    const bin = atob(txt);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const s = new TextEncoder().encode(SALT);
    for (let i = 0; i < bytes.length; i++) bytes[i] ^= s[i % s.length];
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch { return null; }
}

/* ---------------------------- 4. AUDIO ------------------------------ */
let actx = null, masterGain = null, musicTimer = null, musicStep = 0, musicOn = false;

function ensureCtx() {
  if (actx) return actx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  actx = new AC();
  masterGain = actx.createGain();
  masterGain.gain.value = 0.9;
  masterGain.connect(actx.destination);
  return actx;
}
function tone(freq, at, dur, type = 'triangle', gain = 0.16, glide = 0) {
  const c = ensureCtx(); if (!c || !S.settings.sfx) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at);
  if (glide) o.frequency.exponentialRampToValueAtTime(Math.max(60, freq * glide), at + dur);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(gain, at + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(masterGain);
  o.start(at); o.stop(at + dur + 0.05);
}
function noise(at, dur = 0.16, gain = 0.12) {
  const c = ensureCtx(); if (!c || !S.settings.sfx) return;
  const n = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, n, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = c.createBufferSource(); src.buffer = buf;
  const g = c.createGain(); g.gain.value = gain;
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900;
  src.connect(f); f.connect(g); g.connect(masterGain); src.start(at);
}

const SFX = {
  tap:   (t) => tone(720, t, 0.09, 'square', 0.07),
  pop:   (t) => tone(880, t, 0.1, 'triangle', 0.12, 1.4),
  correct: (t) => { [523.25, 659.25, 783.99].forEach((f, i) => tone(f, t + i * 0.075, 0.22, 'triangle', 0.15)); },
  wrong: (t) => { [392, 329.63].forEach((f, i) => tone(f, t + i * 0.13, 0.24, 'sine', 0.11)); },
  star:  (t) => { [1046.5, 1318.5, 1568, 2093].forEach((f, i) => tone(f, t + i * 0.055, 0.2, 'triangle', 0.1)); },
  badge: (t) => { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, t + i * 0.11, 0.34, 'triangle', 0.14)); },
  whoosh:(t) => noise(t, 0.22, 0.09),
  count: (t) => tone(440, t, 0.11, 'sine', 0.12),
  drum:  (t) => noise(t, 0.13, 0.2),
  bell:  (t) => { tone(1318.5, t, 0.7, 'sine', 0.1); tone(1975.5, t, 0.5, 'sine', 0.05); },
  hint:  (t) => { [659.25, 987.77].forEach((f, i) => tone(f, t + i * 0.1, 0.3, 'sine', 0.1)); }
};
/** Nada "nyanyian" lembut (dua oscillator + lowpass) untuk muzik latar */
function singNote(c, freq, at, dur = 1.0, peak = 0.07) {
  if (!c) return;
  const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1900;
  const g = c.createGain(); f.connect(g); g.connect(masterGain);
  const o1 = c.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq;
  const o2 = c.createOscillator(); o2.type = 'triangle'; o2.frequency.value = freq; o2.detune.value = 5;
  o1.connect(f); o2.connect(f);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(peak, at + 0.07);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o1.start(at); o2.start(at); o1.stop(at + dur + 0.05); o2.stop(at + dur + 0.05);
}
/** Bes lembut pada permulaan frasa */
function bassNote(c, freq, at) {
  if (!c) return;
  const g = c.createGain(); const o = c.createOscillator();
  o.type = 'sine'; o.frequency.value = freq; o.connect(g); g.connect(masterGain);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(0.05, at + 0.2);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 2.2);
  o.start(at); o.stop(at + 2.3);
}
/** Nota terapung yang bergerak naik mengikut irama (kesan kartun nyanyian) */
function rhymeNote() {
  if (S.settings.reduceMotion || S.settings.calm) return;
  const sky = document.getElementById('sky'); if (!sky) return;

}

       const audio = {
  unlock() {
    const c = ensureCtx(); if (c && c.state === 'suspended') c.resume();
  },
  sfx(name) {
    const c = ensureCtx(); if (!c || !S.settings.sfx) return;

  },
/**
 * Muzik latar = lagu kanak-kanak ringkas ("Bintang Kecil" / Twinkle Twinkle)
 * dinyanyikan dengan nada lembut + harmoni & bes. Berulang tanpa henti.
 */
startMusic() {
  const c = ensureCtx(); if (!c || musicOn) return;
  musicOn = true;
  // Skala C major: C D E F G A B C5
  const scale = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
  // Irama "Bintang Kecil" (Twinkle Twinkle Little Star)
  const melody = [0,0,4,4,5,5,4, 3,3,2,2,1,1,0, 4,4,3,3,2,2,1, 4,4,3,3,2,2,1, 0,0,4,4,5,5,4, 3,3,2,2,1,1,0];
  const beat = 520;
  musicStep = 0;
  const tick = () => {
    if (!S.settings.music || !musicOn) return;
    const calm = S.settings.calm;
    const n = melody[musicStep % melody.length];
    const t = c.currentTime + 0.05;
    singNote(c, scale[n], t, calm ? 0.72 : 1.0, calm ? 0.05 : 0.07);
    if (musicStep % 2 === 1) singNote(c, scale[Math.max(0, n - 4)], t + 0.02, calm ? 0.42 : 0.62, calm ? 0.028 : 0.04);
    if (musicStep % 7 === 0) bassNote(c, scale[0] / 2, t);
    if (musicStep % 4 === 0) rhymeNote();
    musicStep++;
  };
  tick();
  musicTimer = setInterval(tick, beat);
},
  stopMusic() { musicOn = false; if (musicTimer) clearInterval(musicTimer); musicTimer = null; }
};

/* --------------------------- 5. NARRATION --------------------------- */
let voiceCache = null;
function bestVoice() {
  if (!('speechSynthesis' in window)) return null;
  if (voiceCache) return voiceCache;
  const vs = speechSynthesis.getVoices();
  if (!vs.length) return null;
  const want = S.settings.lang === 'en' ? ['en-GB', 'en-US', 'en'] : ['ms-MY', 'ms', 'id-ID', 'id'];
  for (const w of want) {
    const v = vs.find((x) => x.lang && x.lang.toLowerCase().startsWith(w.toLowerCase()));
    if (v) { voiceCache = v; return v; }
  }
  voiceCache = vs.find((v) => /female|zira|samantha|google/i.test(v.name)) || vs[0];
  return voiceCache;
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { voiceCache = null; bestVoice(); };

       function speak(text, opts = {}) {
  if (!S.settings.tts || !text || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/[•★☆→←]/g, ' '));
    const v = bestVoice(); if (v) u.voice = v;
    u.lang = S.settings.lang === 'en' ? 'en-US' : 'ms-MY';
    u.rate = opts.rate ?? S.settings.narrationRate;
    u.pitch = opts.pitch ?? 1.15;
    u.volume = 1;
    speechSynthesis.speak(u);
  } catch { /* senyap jika tidak disokong */ }
}
       function stopSpeak() { try { speechSynthesis.cancel(); } catch {} }

/* ----------------------- 6. ADAPTIVE ENGINE ------------------------- */
/**
 * Menyesuaikan tahap kesukaran berdasarkan prestasi 3 pusingan terakhir.
 * Naik tahap jika ketepatan ≥ 85%, turun jika < 50%.
 */
       const adaptive = {
  level(gameId) { return clamp(gameStats(gameId).level, 1, 5); },
  record(gameId, res) {
    const st = gameStats(gameId);
    const acc = res.total ? res.correct / res.total : 0;
    st.plays++; st.correct += res.correct; st.total += res.total; st.ms += res.ms || 0;
    st.lastPlayed = Date.now();
    st.recent = [...(st.recent || []), +acc.toFixed(3)].slice(-3);
    st.maxLevel = Math.max(st.maxLevel || 1, st.level);
    const avg = mean(st.recent);
    let move = 'hold';
    if (st.recent.length >= 2 && avg >= 0.85 && st.level < 5) { st.level++; move = 'up'; }
    else if (st.recent.length >= 2 && avg < 0.5 && st.level > 1) { st.level--; move = 'down'; }
    if (res.streak > (st.bestStreak || 0)) st.bestStreak = res.streak;
    (res.skills || []).forEach((k) => {
      const cur = st.skills[k] || { c: 0, t: 0 };
      st.skills[k] = { c: cur.c + res.correct, t: cur.t + res.total };
    });
    save();
    return { move, acc, level: st.level, avg };
  },
  /** Cadangan modul seterusnya berdasarkan kelemahan & minat */
  suggest() {
    const p = childProgress();
    const ranked = Object.entries(p)
      .filter(([, v]) => v.plays > 0)
      .map(([id, v]) => ({ id, acc: v.total ? v.correct / v.total : 0, level: v.level, last: v.lastPlayed }));
    const weak = ranked.filter((r) => r.acc < 0.7).sort((a, b) => a.acc - b.acc)[0];
    const idle = ranked.sort((a, b) => a.last - b.last)[0];
    return { weak, idle, played: ranked.length };
  }
};

       const rewards = {
  addStars(n) {
    const r = childRewards(); r.stars = Math.max(0, r.stars + n); save(); emit('stars');
    return r.stars;
  },
  /** Kira semula badge/sticker/unlock selepas setiap pusingan */
  sync(extra = {}) {
    const r = childRewards(), p = childProgress();
    const stats = {
      stars: r.stars,
      totalPlays: Object.values(p).reduce((s, v) => s + (v.plays || 0), 0),
      playedGames: Object.values(p).filter((v) => v.plays > 0).length,
      bestStreak: Math.max(0, ...Object.values(p).map((v) => v.bestStreak || 0)),
      days: new Set(S.sessions.filter((s) => s.childId === child().id).map((s) => s.date)).size,
      g: (id, lv, stars) => { const st = p[id]; return !!(st && st.level >= lv && (st.stars || 0) >= stars); },
      ...extra
    };
    const baru = [];
    BADGES.forEach((b) => { if (!r.badges.includes(b.id) && b.test(stats)) { r.badges.push(b.id); baru.push(b); } });
    const stickerCount = clamp(Math.floor(r.stars / 6), 0, STICKERS.length);
    while (r.stickers.length < stickerCount) r.stickers.push(STICKERS[r.stickers.length]);
    UNLOCKS.forEach((u) => { if (!r.unlocks.includes(u.id) && r.stars >= u.stars) r.unlocks.push(u.id); });
    save(); emit('rewards');
    return baru;
  },
  stars: () => childRewards().stars,
  badges: () => childRewards().badges,
  stickers: () => childRewards().stickers,
  unlocks: () => childRewards().unlocks,
  reset() { const c = child(); S.rewards[c.id] = { stars: 0, badges: [], stickers: [], unlocks: [] }; S.progress[c.id] = {}; save(); emit('rewards'); }
};

       const screenTime = {
  today() {
    const d = todayKey(), c = child();
    return S.sessions.filter((s) => s.childId === c.id && s.date === d).reduce((a, b) => a + b.minutes, 0);
  },
  add(minutes) {
    const d = todayKey(), c = child();
    let row = S.sessions.find((s) => s.childId === c.id && s.date === d);
    if (!row) { row = { childId: c.id, date: d, minutes: 0 }; S.sessions.push(row); }
    row.minutes += minutes;
    if (S.sessions.length > 400) S.sessions = S.sessions.slice(-400);
    save();
  },
  limit() { return S.settings.screenLimitMin || 30; },
  locked() { return S.settings.screenLimitMin > 0 && this.today() >= this.limit(); },
  remaining() { return S.settings.screenLimitMin > 0 ? Math.max(0, this.limit() - this.today()) : Infinity; },
  week() {
    const out = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const k = d.toISOString().slice(0, 10);
      out.push({ date: k, day: d.toLocaleDateString(S.settings.lang === 'en' ? 'en-GB' : 'ms-MY', { weekday: 'short' }), minutes: S.sessions.filter((s) => s.date === k).reduce((a, b) => a + b.minutes, 0) });
    }
    return out;
  }
};

const BLOCK = ['bodoh','bangang','sial','celaka','babi','anjing','stupid','idiot','hate','kill','bunuh','darah','gay','sex','seksi','porno'];
       const safety = {
  sanitize(s) { return String(s ?? '').replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 24); },
  filter(s) {
    const t = String(s || '');
    const hit = BLOCK.some((w) => new RegExp('\\b' + w + '\\b', 'i').test(t));
    if (hit) this.audit('content_filtered', { len: t.length });
    return { ok: !hit, text: hit ? '...' : t };
  },
  audit(action, meta = {}) {
    S.safetyLog.push({ t: Date.now(), action, meta });
    if (S.safetyLog.length > 200) S.safetyLog = S.safetyLog.slice(-200);
    save();
  },
  /** Senarai asal luaran yang benar-benar dihubungi oleh aplikasi */
  networkAudit() {
    try {
      const res = performance.getEntriesByType('resource');
      const origins = [...new Set(res.map((r) => { try { return new URL(r.name).origin; } catch { return null; } }).filter(Boolean))];
      return origins.filter((o) => o !== location.origin);
    } catch { return []; }
  },
  log: () => S.safetyLog
};

       function announce(text) { const l = $('#live'); if (l) l.textContent = ''; setTimeout(() => { if (l) l.textContent = text; }, 30); }
       function toast(text, ms = 2200) {
  const box = $('#toast'); if (!box) return;
  const el = h(`<div class="toast-item">${esc(text)}</div>`);
  box.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, ms);
}
       function burst(x, y, chars = ['⭐', '✨', '🌟', '💫'], n = 12) {
  if (S.settings.reduceMotion || S.settings.calm) return;
  const fx = $('#fx'); if (!fx) return;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    p.className = 'fx-particle';
    p.textContent = pick(chars);
    const a = (Math.PI * 2 * i) / n + Math.random();
    const d = 90 + Math.random() * 170;
    p.style.left = x + 'px'; p.style.top = y + 'px';
    p.style.setProperty('--dx', Math.cos(a) * d + 'px');
    p.style.setProperty('--dy', (Math.sin(a) * d - 60) + 'px');
    p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    p.style.fontSize = (1.1 + Math.random() * 1.5) + 'rem';
    p.style.animationDelay = (Math.random() * 0.12) + 's';
    fx.appendChild(p);
    setTimeout(() => p.remove(), 1500);
  }
}
       function burstAt(node, chars, n) {
  if (!node) return;
  const r = node.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, chars, n);
}
       function overlay(html, opts = {}) {

  o.hidden = false;
  document.body.style.overflow = 'hidden';
  const sheet = o.querySelector('.sheet');
  const focusable = sheet.querySelector('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (focusable) focusable.focus();
  o.onclick = (e) => { if (e.target === o && !opts.sticky) closeOverlay(); };
  o.onkeydown = (e) => { if (e.key === 'Escape' && !opts.sticky) closeOverlay(); };
  return sheet;
}
       function closeOverlay() {
  const o = $('#overlay');

}

       function say(api, text, mood = 'happy', who) {

        <span>${L('Sentuh gambar untuk jawab', 'Tap a picture to answer')}</span>
      </div>

  api.el = {
    shell: api.root.querySelector('.game-shell'),
    dots: api.root.querySelector('[data-dots]'),
    stage: api.root.querySelector('[data-stage]'),
    opts: api.root.querySelector('[data-opts]'),
    bubble: api.root.querySelector('[data-narrator]'),
    score: api.root.querySelector('[data-score]')
  };
  api.el.stage.dataset.wm = (api.game && api.game.ico) || '⭐';
  api.setDots = (active, bad = -1) => {
    api.el.dots.innerHTML = Array.from({ length: api.rounds }, (_, i) =>
      `<span class="dot ${i < active ? 'done' : ''} ${i === active ? 'now' : ''} ${i === bad ? 'bad' : ''}"></span>`).join('');
  };
  api.updateScore = () => { api.el.score.textContent = `${L('Betul', 'Correct')}: ${api.stats.correct}/${api.stats.total} · ⭐ ${api.stats.streak}`; };
  api.root.querySelector('[data-act="exit"]').onclick = () => { audio.sfx('whoosh'); api.onExit(); };
  api.root.querySelector('[data-act="repeat"]').onclick = () => { if (api.el.lastSay) speak(api.el.lastSay); else api.say(L('Dengar arahan ya!', 'Listen to the instructions!')); };
  api.root.querySelector('[data-act="hint"]').onclick = () => { if (api.el.hintFn) api.el.hintFn(true); };

  // Input suara (opsyenal, untuk kanak-kanak yang suka bercakap)
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR && settings().voiceInput) {
    const mic = document.createElement('button');
    mic.type = 'button';
    mic.className = 'btn-icon';
    mic.textContent = '🎙️';
    mic.setAttribute('aria-label', L('Jawab dengan suara', 'Answer by voice'));
    mic.setAttribute('aria-pressed', 'false');
    mic.onclick = () => {
      const rec = new SR();
      rec.lang = settings().lang === 'en' ? 'en-US' : 'ms-MY';
      rec.interimResults = false;
      rec.maxAlternatives = 3;
      mic.textContent = '🔴'; mic.setAttribute('aria-pressed', 'true');
      audio.sfx('pop');
      rec.onresult = (ev) => {
        const text = Array.from(ev.results[0]).map((a) => a.transcript).join(' ').toLowerCase().trim();
        announce(text);
        if (api.voiceHandler) api.voiceHandler(text);
        else api.say(`${L('Saya dengar', 'I heard')}: ${text}`, 'happy');
      };
      rec.onerror = () => toast(L('Cuba sebut sekali lagi ya', 'Please say that again'));
      rec.onend = () => { mic.textContent = '🎙️'; mic.setAttribute('aria-pressed', 'false'); };
      try { rec.start(); } catch { /* diabaikan */ }
    };
    api.el.shell.querySelector('.game-top').appendChild(mic);
  }
  api.setDots(0);
  api.updateScore();
  return api.el;
}

  const delay = settings().hintDelayMs || 10000;

  api._hintT = setTimeout(() => {
    // Jangan cetuskan petunjuk jika kanak-kanak sudah keluar dari permainan ini
    if (!api.root || !api.root.isConnected || api._ended) return;
    if (api.el.hintFn) api.el.hintFn(false);
  }, delay);
}
       function clearHint(api) { clearTimeout(api._hintT); api._hintT = null; }
/** Hentikan semua aktiviti latar bagi sesi ini (dipanggil apabila keluar dari permainan) */
       function endSession(api) { api._ended = true; clearHint(api); api.el.hintFn = null; }

       function showHint(api, text) {
  if (!text || api._ended || !api.root || !api.root.isConnected) return;
  api.stats.hints++;
  audio.sfx('hint');
  toast('💡 ' + text, 3200);
  speak(text);
}

       function markCorrect(api, node) {

       function finishRound(api) {
  clearHint(api);
  const st = api.stats;
  const acc = st.total ? st.correct / st.total : 0;
  const stars = acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : 1;
  st.ms = Date.now() - st.t0;
  const res = adaptive.record(api.game.id, { correct: st.correct, total: st.total, streak: st.best, ms: st.ms, skills: st.skills });
  const gst = gameStats(api.game.id);
  gst.stars = Math.max(gst.stars || 0, stars);
  gst.maxLevel = Math.max(gst.maxLevel || 1, api.level);
  rewards.addStars(stars);
  const baru = rewards.sync();
  audio.sfx('star');
  setTimeout(() => audio.sfx('badge'), 400);
  showSummary(api, { stars, acc, res, baru });
  announce(`${praise()} ${stars} ${L('bintang', 'stars')}`);
}

/**
 * gen(level, index, api) → { prompt, instruction, say, hint, layout, options:[{html,label,aria,cls,correct}] }
 */
       function runQuiz(api, gen, opts = {}) {
  buildShell(api);
  let idx = 0, firstTry = true, wrongCount = 0, locked = false;
  api.restart = () => { idx = 0; firstTry = true; wrongCount = 0; locked = false; api.stats.correct = 0; api.stats.total = 0; api.stats.streak = 0; api.stats.t0 = Date.now(); api.updateScore(); round(); };

  function round() {
    if (idx >= api.rounds) return finishRound(api);
    api.setDots(idx);
    const q = gen(api.level, idx, api);
    firstTry = true; wrongCount = 0; locked = false;
    api.el.stage.innerHTML = q.prompt;
    api.el.opts.className = 'opts ' + (q.layout || '');
    api.el.opts.innerHTML = '';
    const order = q.shuffle === false ? q.options : shuffle(q.options);
    const nodes = [];
    order.forEach((o, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt' + (o.cls ? ' ' + o.cls : '');
      b.style.animationDelay = (i * 0.05) + 's';
      b.innerHTML = o.html;
      b.setAttribute('aria-label', o.aria || o.label || '');
      b.dataset.correct = o.correct ? '1' : '0';
      b.onclick = () => answer(b, q);
      api.el.opts.appendChild(b);
      nodes.push(b);
    });
    // Input suara: padankan sebutan kanak-kanak dengan pilihan jawapan
    api.voiceTargets = order.map((o, i) => ({ label: String(o.aria || o.label || '').toLowerCase().trim(), node: nodes[i] }));
    api.voiceHandler = (text) => {
      const hit = api.voiceTargets.find((v) => v.label && (text.includes(v.label) || v.label.includes(text)));
      if (hit) { api.say(L('Bagus, saya dengar jawapan kamu!', 'Great, I heard your answer!'), 'cheer'); hit.node.click(); }
      else api.say(L('Saya tidak pasti. Cuba sebut dengan jelas ya.', 'I am not sure. Try saying it clearly.'), 'think');
    };
    api.el.lastSay = q.say || q.instruction;
    api.say(q.instruction, q.mood || 'happy');
    startHint(api, (manual) => showHint(api, manual ? (q.hint2 || q.hint) : q.hint));
    idx++;
    api.setDots(idx - 1);
  }

  function answer(node, q) {
    if (locked) return;
    clearHint(api);
    const ok = node.dataset.correct === '1';
    if (ok) {
      locked = true;
      api.stats.total++;
      if (firstTry) { api.stats.correct++; api.stats.streak++; api.stats.best = Math.max(api.stats.best, api.stats.streak); }
      markCorrect(api, node);
      api.updateScore();
      api.say(firstTry ? praise() : L('Betul! Bagus!', 'Correct! Good!'), 'cheer');
      setTimeout(round, 1150);
    } else {
      if (firstTry) { api.stats.total++; firstTry = false; api.stats.streak = 0; }
      wrongCount++;
      api.updateScore();
      const correctNode = api.el.opts.querySelector('[data-correct="1"]');
      markWrong(api, node, wrongCount >= 2 ? correctNode : null);
      if (wrongCount >= 2) {
        locked = true;
        api.say(L('Tak apa! Ini jawapannya. Cuba soalan seterusnya ya.', 'It is okay! Here is the answer. Let us try the next one.'), 'think');
        setTimeout(round, 1900);
      } else {
        api.say(retryWord(), 'think');
        speak(retryWord());
      }
    }
  }
  round();
}

/* ------------------------ 8. RUNNER: MEMORI ------------------------- */
       function runMemory(api, cfg) {
  buildShell(api);
  let pairFound = 0, flips = 0, locked = false, open = [];
  api.restart = () => { pairFound = 0; flips = 0; open = []; locked = false; api.stats.correct = 0; api.stats.total = 0; api.stats.t0 = Date.now(); draw(); };

  function draw() {
    api.el.opts.className = 'opts';
    const cols = cfg.size <= 4 ? 2 : cfg.size <= 6 ? 3 : 4;
    api.el.opts.style.gridTemplateColumns = `repeat(${cols}, minmax(0,1fr))`;
    const items = cfg.cards();
    api.rounds = items.length / 2;
    api.setDots(pairFound);
    api.el.opts.innerHTML = items.map((c, i) =>
      `<button class="opt emoji-tile" data-i="${i}" aria-label="${L('Kad tertutup', 'Hidden card')}"><span class="opt-visual" style="font-size:0">?</span></button>`).join('');
    api.el.opts.querySelectorAll('.opt').forEach((b) => {
      b.onclick = () => flip(b, items[+b.dataset.i]);
    });
    api.say(cfg.instruction || L('Cari pasangan yang sama!', 'Find the matching pairs!'));
    startHint(api, () => showHint(api, cfg.hint));
  }

  function flip(node, card) {
    if (locked || node.dataset.done) return;
    clearHint(api);
    audio.sfx('pop');
    node.innerHTML = `<span class="opt-visual">${card.face}</span>`;
    node.setAttribute('aria-label', card.face);
    open.push({ node, card });
    if (open.length === 2) {
      flips++;
      locked = true;
      const [a, b] = open;
      if (a.card.key === b.card.key) {
        setTimeout(() => {
          a.node.classList.add('correct'); b.node.classList.add('correct');
          a.node.dataset.done = '1'; b.node.dataset.done = '1';
          pairFound++; api.stats.correct++; api.stats.total++; api.stats.streak++;
          api.stats.best = Math.max(api.stats.best, api.stats.streak);
          markCorrect(api, a.node); api.updateScore();
          api.say(praise(), 'cheer');
          open = []; locked = false; api.setDots(pairFound);
          if (pairFound === api.stats.total) setTimeout(() => finishRound(api), 700);
        }, 320);
      } else {
        setTimeout(() => {
          a.node.innerHTML = '<span class="opt-visual" style="font-size:0">?</span>';
          b.node.innerHTML = '<span class="opt-visual" style="font-size:0">?</span>';
          a.node.setAttribute('aria-label', L('Kad tertutup', 'Hidden card'));
          b.node.setAttribute('aria-label', L('Kad tertutup', 'Hidden card'));
          audio.sfx('wrong'); api.stats.streak = 0; api.stats.total++; api.updateScore();
          open = []; locked = false;
        }, 1000);
      }
    }
  }
  draw();
}

       function runBuilder(api, cfg) {
  buildShell(api);
  let idx = 0;
  api.restart = () => { idx = 0; api.stats.correct = 0; api.stats.total = 0; api.stats.t0 = Date.now(); draw(); };

  function draw() {
    if (idx >= api.rounds) return finishRound(api);
    api.setDots(idx);
    const task = cfg.task(api.level, idx);
    let placed = [];
    let firstTry = true;
    const letters = shuffle(task.letters);
    api.el.stage.innerHTML = `
      <div class="prompt-big">${task.emoji}</div>
      <div class="prompt-text">${esc(task.clue)}</div>
      <div class="slots" data-slots style="display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;margin-top:.6rem">
        ${task.word.split('').map(() => `<span class="slot" style="width:3.2rem;height:3.6rem;border-radius:.8rem;background:#F1EDFF;border:.18rem dashed #B79CED;display:grid;place-items:center;font-size:1.7rem;font-weight:800"></span>`).join('')}
      </div>`;
    api.el.opts.className = 'opts';
    api.el.opts.style.gridTemplateColumns = '';
    api.el.opts.innerHTML = letters.map((ch, i) =>
      `<button class="opt" data-ch="${esc(ch)}" data-k="${i}" style="min-height:5rem" aria-label="${L('Huruf', 'Letter')} ${esc(ch)}"><span class="opt-visual" style="font-size:2rem">${esc(ch)}</span></button>`).join('');
    api.el.opts.querySelectorAll('.opt').forEach((b) => { b.onclick = () => place(b); });
    api.say(task.instruction || L('Susun huruf untuk membentuk perkataan.', 'Arrange the letters to build the word.'), 'happy');
    startHint(api, () => showHint(api, L(`Huruf pertama ialah "${task.word[0]}".`, `The first letter is "${task.word[0]}".`)));

    function render() {
      const slots = api.el.stage.querySelectorAll('.slot');
      slots.forEach((s, i) => { s.textContent = placed[i] ? placed[i].ch : ''; });
    }
    function place(btn) {
      clearHint(api);
      const ch = btn.dataset.ch;
      const need = task.word[placed.length];
      if (ch === need) {
        audio.sfx('pop');
        placed.push({ ch, btn });
        btn.classList.add('dim'); btn.disabled = true;
        render(); api.updateScore();
        api.stats.streak++;
        api.stats.best = Math.max(api.stats.best, api.stats.streak);
        if (placed.length === task.word.length) {
          api.stats.total++;
          if (firstTry) api.stats.correct++;
          api.updateScore();
          api.el.opts.querySelectorAll('.opt').forEach((b) => b.classList.add('correct'));
          markCorrect(api, api.el.stage.querySelector('[data-slots]'));
          api.say(L('Pandai! Perkataan siap!', 'Well done! Word complete!'), 'cheer');
          idx++; api.setDots(idx);
          setTimeout(draw, 1250);
        } else {
          api.say(L('Betul! Sambung lagi.', 'Correct! Keep going.'), 'happy');
        }
      } else {
        audio.sfx('wrong');
        btn.classList.add('wrong');
        setTimeout(() => btn.classList.remove('wrong'), 600);
        if (firstTry) { api.stats.total++; firstTry = false; api.stats.streak = 0; api.updateScore(); }
        api.say(L(`Bukan itu. Cuba huruf "${need}".`, `Not that one. Try the letter "${need}".`), 'think');
      }
    }
  }
  draw();
}

/* ------------------------- 11. RUNNER: TRACE ------------------------ */
/** Panduan bentuk/latihan tulisan untuk modul Mewarna & Trace */
       function traceGlyph(ch, box = 100) {
  const W = box, H = box;
  const P = (x, y) => ({ x: x / 100 * W, y: y / 100 * H });
  const line = (x1, y1, x2, y2, n = 14) => { const a = P(x1, y1), b = P(x2, y2); return Array.from({ length: n }, (_, i) => ({ x: a.x + (b.x - a.x) * i / (n - 1), y: a.y + (b.y - a.y) * i / (n - 1) })); };
  const quad = (x0, y0, cx, cy, x1, y1, n = 22) => { const a = P(x0, y0), c = P(cx, cy), b = P(x1, y1); return Array.from({ length: n }, (_, i) => { const t = i / (n - 1); return { x: (1 - t) ** 2 * a.x + 2 * (1 - t) * t * c.x + t * t * b.x, y: (1 - t) ** 2 * a.y + 2 * (1 - t) * t * c.y + t * t * b.y }; }); };
  const ellipse = (cx, cy, rx, ry, a0 = 0, a1 = 360, n = 30) => { const c = P(cx, cy); const RX = rx / 100 * W, RY = ry / 100 * H; return Array.from({ length: n }, (_, i) => { const a = (a0 + (a1 - a0) * i / (n - 1)) * Math.PI / 180; return { x: c.x + Math.cos(a) * RX, y: c.y + Math.sin(a) * RY }; }); };
  const poly = (pts, close = true, n = 12) => { const segs = []; for (let i = 0; i < pts.length - 1; i++) segs.push(line(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], n)); if (close) segs.push(line(pts[pts.length - 1][0], pts[pts.length - 1][1], pts[0][0], pts[0][1], n)); return [segs.flat()]; };
  const G = {
    'I': [line(50, 14, 50, 86)],
    'L': [line(34, 14, 34, 86), line(34, 86, 74, 86)],
    'T': [line(22, 14, 78, 14), line(50, 14, 50, 86)],
    'U': [line(26, 14, 26, 62), quad(26, 62, 26, 88, 50, 88), quad(50, 88, 74, 88, 74, 62), line(74, 62, 74, 14)],
    'O': [ellipse(50, 50, 27, 37)],
    'C': [ellipse(52, 50, 27, 37, 55, 305)],
    'E': [line(34, 14, 34, 86), line(34, 14, 72, 14), line(34, 50, 66, 50), line(34, 86, 72, 86)],
    'A': [line(24, 86, 50, 14), line(50, 14, 76, 86), line(35, 60, 65, 60)],
    'B': [line(32, 14, 32, 86), quad(32, 14, 74, 16, 32, 50), quad(32, 50, 80, 52, 32, 86)],
    'P': [line(32, 14, 32, 86), quad(32, 14, 76, 16, 32, 50)],
    'K': [line(30, 14, 30, 86), line(74, 16, 36, 56), line(44, 48, 78, 86)],
    'S': [quad(72, 20, 30, 14, 36, 48), quad(36, 48, 74, 60, 36, 84), quad(36, 84, 72, 90, 74, 62)],
    '1': [line(38, 26, 52, 14), line(52, 14, 52, 86), line(36, 86, 68, 86)],
    '2': [quad(28, 26, 52, 8, 72, 26), quad(72, 26, 80, 44, 30, 86), line(30, 86, 74, 86)],
    '3': [quad(30, 24, 52, 12, 70, 28), quad(70, 28, 78, 46, 46, 50), quad(46, 50, 80, 54, 66, 84), quad(66, 84, 48, 92, 30, 80)],
    '7': [line(26, 16, 76, 16), line(76, 16, 42, 86)],
    'garis': [line(50, 10, 50, 90)],
    'zigzag': [[...line(12, 80, 30, 22), ...line(30, 22, 48, 80), ...line(48, 80, 66, 22), ...line(66, 22, 84, 80)]],
    'gelombang': [[...quad(10, 55, 24, 18, 38, 55), ...quad(38, 55, 52, 92, 66, 55), ...quad(66, 55, 80, 18, 92, 55)]],
    'segiempat': poly([[20, 14], [80, 14], [80, 86], [20, 86]]),
    'segitiga': poly([[50, 10], [88, 86], [12, 86]]),
    'hati': [[...quad(50, 88, 8, 58, 20, 30), ...quad(20, 30, 30, 8, 50, 30), ...quad(50, 30, 70, 8, 80, 30), ...quad(80, 30, 92, 58, 50, 88)]],
    'bintang': poly([[50, 8], [62, 38], [95, 40], [70, 60], [78, 92], [50, 74], [22, 92], [30, 60], [5, 40], [38, 38]])
  };
  return G[ch] || null;
}

/** Gabungkan beberapa glif menjadi satu baris perkataan (untuk trace perkataan) */
       function wordStrokes(word, box = 100) {
  const n = word.length, w = box / n;
  return word.split('').flatMap((ch, i) => {
    const g = traceGlyph(ch, box);
    if (!g) return [];
    const s = (w / box) * 0.9;
    const off = i * w + w * 0.05;
    return g.map((st) => st.map((p) => ({ x: p.x * s + off, y: p.y * 0.84 + 8 })));
  });
}

      const pal = api.el.stage.querySelector('[data-pal]');
      pal.innerHTML = colors.map((c, i) => `<button class="swatch-btn" data-c="${c}" style="background:${c}" aria-label="${L('Warna', 'Color')} ${i + 1}" aria-pressed="${i === 0}"></button>`).join('');
      pal.querySelectorAll('.swatch-btn').forEach((b) => {
        b.onclick = () => {
          picked = b.dataset.c;
          pal.querySelectorAll('.swatch-btn').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
          audio.sfx('tap');
        };
      });
    }

    function drawGuide() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.save();
      ctx.lineWidth = task.mode === 'color' ? 0 : 16;
      ctx.strokeStyle = '#E7E0D4';
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.setLineDash([2, 22]);
      guide.forEach((s) => { ctx.beginPath(); s.forEach((p, i) => i ? ctx.lineTo(p.x * 7.2, p.y * 7.2) : ctx.moveTo(p.x * 7.2, p.y * 7.2)); ctx.stroke(); });
      ctx.restore();
    }
    function render() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      if (task.mode !== 'color') { ctx.save(); ctx.setLineDash([2, 22]); ctx.lineWidth = 16; ctx.strokeStyle = '#E7E0D4'; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; guide.forEach((s) => { ctx.beginPath(); s.forEach((p, i) => i ? ctx.lineTo(p.x * 7.2, p.y * 7.2) : ctx.moveTo(p.x * 7.2, p.y * 7.2)); ctx.stroke(); }); ctx.restore(); }
      ctx.save();
      ctx.lineWidth = 18; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = mode === 'color' ? picked : '#5BC0EB';
      stroke.forEach((s) => { if (s.length < 2) return; ctx.beginPath(); ctx.strokeStyle = s.color; s.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); });
      ctx.restore();
    }
    drawGuide(); render();

    const pos = (e) => {
      const r = cv.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: (t.clientX - r.left) * (cv.width / r.width), y: (t.clientY - r.top) * (cv.height / r.height) };
    };
    const start = (e) => { e.preventDefault(); audio.unlock(); clearHint(api); drawing = true; stroke.push({ color: mode === 'color' ? picked : '#5BC0EB', pts: [pos(e)] }); render(); };
    const move = (e) => { if (!drawing) return; e.preventDefault(); stroke[stroke.length - 1].pts.push(pos(e)); render(); };
    const end = () => { if (!drawing) return; drawing = false; };

    cv.addEventListener('pointerdown', start);
    cv.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);

    api.el.stage.querySelector('[data-cw]').addEventListener('pointerup', () => {
      if (task.mode === 'color') return;
      const all = stroke.flatMap((s) => s.pts);
      const total = guide.flat();
      const tol = 40;
      let hit = 0;
      total.forEach((g) => {
        const gp = { x: g.x * 7.2, y: g.y * 7.2 };
        if (all.some((p) => Math.hypot(p.x - gp.x, p.y - gp.y) < tol)) hit++;
      });
      const cov = total.length ? hit / total.length : 0;
      api.stats.total++;
      const good = cov >= 0.62;
      if (good) {
        api.stats.correct++; api.stats.streak++;
        api.stats.best = Math.max(api.stats.best, api.stats.streak);
        api.updateScore(); markCorrect(api, api.el.stage.querySelector('[data-cw]'));
        api.say(L('Cantik! Tulisan kamu kemas.', 'Beautiful! Neat writing.'), 'cheer');
      } else {
        api.stats.streak = 0; api.updateScore();
        api.sfx('wrong');
        api.say(L('Cuba ikut garis putus-putus itu ya.', 'Try to follow the dotted line.'), 'think');
      }
      if (cov >= 0.35) { idx++; api.setDots(idx); setTimeout(round, 1200); }
    });

    api.say(task.instruction, 'happy');
    startHint(api, () => showHint(api, L('Ikut garis putus-putus perlahan-lahan.', 'Follow the dotted line slowly.')));
  }
  round();
}

/* ----------------------- 12. RUNNER: MUZIK -------------------------- */
       function runMusic(api, cfg) {
  buildShell(api);
  let idx = 0, firstTry = true;
  const NOTES = [261.63, 329.63, 392, 523.25, 659.25, 783.99];
  const PADCOL = ['#FF7C7C', '#FFA552', '#FFD34E', '#7BD389', '#5BC0EB', '#B79CED'];
  api.restart = () => { idx = 0; api.stats.correct = 0; api.stats.total = 0; api.stats.t0 = Date.now(); round(); };

  function round() {
    if (idx >= api.rounds) return finishRound(api);
    api.setDots(idx);
    const task = cfg.task(api.level, idx);
    firstTry = true;
    let seq = task.seq, input = [], playing = false;
    api.el.stage.innerHTML = `<div class="prompt-sub">${esc(task.clue)}</div><div class="seq-display" data-seq>${seq.map((s, i) => `<span class="seq-item" data-s="${i}">${task.mode === 'instrument' ? '🎵' : '●'}</span>`).join('')}</div>`;
    api.el.opts.className = 'opts';
    api.el.opts.style.gridTemplateColumns = '';
    api.el.opts.innerHTML = task.mode === 'instrument'
      ? task.instruments.map((ins) => `<button class="opt" data-ins="${ins.id}" style="min-height:6rem"><span class="opt-visual">${ins.ico}</span><span class="opt-label">${esc(settings().lang === 'en' ? ins.en : ins.ms)}</span></button>`).join('')
      : PADCOL.slice(0, task.pads).map((c, i) => `<button class="pad" data-n="${i}" style="background:linear-gradient(180deg,${c},${c}cc)" aria-label="${L('Pad', 'Pad')} ${i + 1}"><span>${i + 1}</span></button>`).join('');
    api.el.opts.className = task.mode === 'instrument' ? 'opts' : 'pads';

    function light(i, dur = 420) {
      const el = api.el.stage.querySelector(`[data-s="${i}"]`);
      if (!el) return;
      el.classList.add('active');
      const pad = api.el.opts.querySelector(`[data-n="${seq[i] ?? i}"]`);
      if (pad) pad.classList.add('lit');
      setTimeout(() => { el.classList.remove('active'); if (pad) pad.classList.remove('lit'); }, dur);
    }
    function playSeq() {
      if (playing) return; playing = true;
      seq.forEach((n, i) => setTimeout(() => { light(i); audio.note(NOTES[n], task.timbre || 'piano'); }, i * (task.speed || 620)));
      setTimeout(() => { playing = false; }, seq.length * (task.speed || 620) + 200);
    }

    if (task.mode === 'instrument') {
      api.el.opts.querySelectorAll('.opt').forEach((b) => {
        b.onclick = () => {
          clearHint(api);
          api.stats.total++;
          const ok = b.dataset.ins === task.answer;
          if (ok) { if (firstTry) api.stats.correct++; markCorrect(api, b); api.say(praise(), 'cheer'); setTimeout(round, 1200); }
          else { firstTry = false; markWrong(api, b, api.el.opts.querySelector(`[data-ins="${task.answer}"]`)); api.say(retryWord(), 'think'); }
          api.updateScore();
        };
      });
      setTimeout(() => { audio.note(task.freq || 440, task.answer); }, 700);
      api.say(task.instruction, 'happy');
      startHint(api, () => showHint(api, task.hint));
      idx++; api.setDots(idx - 1);
      return;
    }

    api.el.opts.querySelectorAll('.pad').forEach((b) => {
      b.onclick = () => {
        clearHint(api);
        if (playing) return;
        const n = +b.dataset.n;
        b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 140);
        audio.note(NOTES[n], task.timbre || 'piano');
        input.push(n);
        const i = input.length - 1;
        if (input[i] !== seq[i]) {
          audio.sfx('wrong'); api.stats.streak = 0; api.updateScore();
          if (firstTry) { api.stats.total++; firstTry = false; }
          api.say(L('Hampir! Dengar sekali lagi ya.', 'Almost! Listen once more.'), 'think');
          input = []; setTimeout(playSeq, 900);
          return;
        }
        light(i, 240);
        if (input.length === seq.length) {
          api.stats.total++;
          if (firstTry) { api.stats.correct++; api.stats.streak++; api.stats.best = Math.max(api.stats.best, api.stats.streak); }
          api.updateScore(); markCorrect(api, api.el.opts.querySelector('.pad'));
          api.say(L('Tepat sekali! Kamu berbakat muzik!', 'Perfect! You have musical talent!'), 'cheer');
          input = [];
          setTimeout(round, 1400);
        }
      };
    });
    api.say(task.instruction, 'happy');
    startHint(api, () => showHint(api, task.hint));
    setTimeout(playSeq, 800);
    idx++; api.setDots(idx - 1);
  }
  round();
}

const mcq = (correct, pool, n = 4) => {
  const others = shuffle(pool.filter((x) => x.key !== correct.key)).slice(0, n - 1);
  correct.correct = true;            // TAHAP BETUL: tandakan pilihan yang betul
  return shuffle([correct, ...others]);
};
/** Pilih warna teks yang kontras di atas swatch (kuning/putih → teks gelap) */
const inkOn = (hex) => {
  const c = hex.replace('#', '');
  const r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return lum > 0.62 ? '#2E2A44' : '#FFFFFF';
};
const swatchOpt = (c) => ({
  key: c.key,
  html: `<span class="sw" style="background:${c.hex}"></span><span class="opt-label" style="color:${inkOn(c.hex)};text-shadow:${inkOn(c.hex) === '#FFFFFF' ? '0 .1rem .3rem rgba(0,0,0,.55)' : 'none'}">${esc(settings().lang === 'en' ? c.en : c.ms)}</span>`,
  aria: settings().lang === 'en' ? c.en : c.ms, cls: 'swatch'
});
const textOpt = (label, emoji = '') => ({ key: label, html: `${emoji ? `<span class="opt-visual">${emoji}</span>` : ''}<span class="opt-label">${esc(label)}</span>`, aria: label });
const bigOpt = (label, emoji) => ({ key: label, html: `<span class="opt-visual" style="font-size:3.2rem">${emoji}</span>`, aria: label, cls: 'emoji-tile' });
const numOpt = (n) => ({ key: String(n), html: `<span class="opt-visual" style="font-size:2.6rem">${n}</span>`, aria: String(n) });

/* ==================== DATA: WARNA ==================== */
       const COLORS = {

  { emoji: '🌹', ms: 'bunga ros', en: 'rose', c: C.pink }, { emoji: '🖤', ms: 'hati hitam', en: 'black heart', c: C.hitam }
];
const MIX = [

];

function genColors(level, i) {

  if (level === 1 || level === 2) {
    const pool = level === 1 ? BASE4 : SEC6;
    const ans = pick(pool);
    return {
      prompt: `<div class="prompt-big">${L('Sentuh warna ini!', 'Tap this colour!')}</div>
        <div style="width:9rem;height:9rem;border-radius:50%;background:${ans.hex};box-shadow:0 .6rem 1.4rem rgba(0,0,0,.22);border:.4rem solid #fff"></div>`,

      hint2: L(`Warnanya ${o.c.ms}.`, `It is ${o.c.ms}.`),

    return {
      prompt: `<div class="prompt-sub">${esc(L('Campurkan warna ini', 'Mix these colours'))}</div>
        <div style="display:flex;align-items:center;gap:.8rem">
          <span style="width:6rem;height:6rem;border-radius:50%;background:${m.a.hex};border:.3rem solid #fff;box-shadow:0 .4rem 1rem rgba(0,0,0,.2)"></span>

          <span style="font-size:2.4rem">🟰</span><span style="font-size:3rem">❓</span>

    hint: L('Terang bermaksud lebih hampir kepada putih. Gelap lebih hampir kepada hitam.', 'Lighter is closer to white. Darker is closer to black.'),
    hint2: askLight ? L('Yang lebih cerah dan lembut.', 'The brighter, softer one.') : L('Yang lebih tua warnanya.', 'The deeper one.'),
    options: shuffle([
      Object.assign(swatchOpt(ans), { correct: true }),
      swatchOpt(wrong), swatchOpt(mid), swatchOpt(pick(ALLC.filter((c) => c.key !== s.base.key)))
    ])
  };

/* ==================== DATA: HURUF ==================== */
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const LOBJ = [
  { ch: 'A', w: 'Ayam', e: '🐔' }, { ch: 'B', w: 'Bola', e: '⚽' }, { ch: 'C', w: 'Cawan', e: '☕' },

const SYL = [
  { a: 'BA', b: 'JU', w: 'BAJU', e: '👕' }, { a: 'BO', b: 'LA', w: 'BOLA', e: '⚽' },
  { a: 'BU', b: 'KU', w: 'BUKU', e: '📚' }, { a: 'MA', b: 'TA', w: 'MATA', e: '👁️' },

];

function genLetters(level, i) {
  if (level === 1) {
    const pool = LETTERS.slice(0, 5);
    const ans = pick(pool);
    return {
      prompt: `<div class="prompt-big" style="color:${pick(['#5BC0EB', '#FFA552', '#7BD389', '#B79CED'])}">${ans}</div>`,
      instruction: L(`Sentuh huruf ${ans}!`, `Tap the letter ${ans}!`),
      hint: L('Huruf besar. Tengok betul-betul bentuknya.', 'Capital letter. Look at its shape.'),
      hint2: L(`Cari huruf ${ans}.`, `Look for the letter ${ans}.`),
      options: mcq(textOpt(ans), pool.map((x) => textOpt(x)))
    };
  }
  if (level === 2) {
    const pool = LETTERS.slice(0, 8);
    const up = pick(pool);
    const low = up.toLowerCase();
    const conf = shuffle([low, ...shuffle(pool.filter((x) => x !== up).map((x) => x.toLowerCase()))].slice(0, 4));
    return {
      prompt: `<div class="prompt-big">${up}</div><div class="prompt-sub">${esc(L('Cari huruf kecilnya', 'Find its small letter'))}</div>`,

      hint2: L(`Huruf kecil bagi ${up} ialah ${low}.`, `The small letter of ${up} is ${low}.`),
      options: conf.map((x) => Object.assign(textOpt(x), { correct: x === low }))
    };
  }
  if (level === 3) {
    const o = pick(LOBJ);
    const pool = LOBJ.filter((x) => x.ch !== o.ch);
    return {
      prompt: `<div class="prompt-big">${o.e}</div><div class="prompt-text">${esc(o.w)}</div>`,
      instruction: L(`${o.w} bermula dengan huruf apa?`, `Which letter does ${o.w} start with?`),
      hint: L('Sebut perkataan itu perlahan-lahan, dengar bunyi pertama.', 'Say the word slowly and listen to the first sound.'),
      hint2: L(`Bunyi pertama ialah "${o.ch}".`, `The first sound is "${o.ch}".`),
      options: mcq(textOpt(o.ch), pool.map((x) => textOpt(x.ch)))
    };
  }
  if (level === 4) {
    const start = rnd(20);
    const seq = LETTERS.slice(start, start + 5);
    const missIdx = 1 + rnd(3);
    const ans = seq[missIdx];
    const shown = seq.map((c, k) => (k === missIdx ? '<span style="color:#B79CED">?</span>' : c)).join(' ');

const COUNT_EMOJI = ['🍎', '⭐', '🐠', '🎈', '🐥', '🍪', '🌸', '🚗', '🦋', '🍓'];

function genNumbers(level, i) {
  if (level <= 2) {
    const max = level === 1 ? 5 : 10;
    const n = 1 + rnd(max);
    const e = pick(COUNT_EMOJI);
    const pool = Array.from({ length: max }, (_, k) => k + 1).filter((x) => x !== n);
    return {
      prompt: `<div class="prompt-sub">${esc(L('Kira berapa banyak?', 'How many are there?'))}</div>
        <div style="display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;max-width:26rem">${Array.from({ length: n }, () => `<span style="font-size:2.4rem">${e}</span>`).join('')}</div>`,
      instruction: L(`Kira ${e} ini. Ada berapa?`, `Count the ${e}. How many?`),
      hint: L('Sentuh setiap gambar sambil mengira: satu, dua, tiga...', 'Point at each picture and count: one, two, three...'),
      hint2: L(`Jumlahnya ${n}.`, `There are ${n}.`),
      options: mcq(numOpt(n), shuffle(pool).slice(0, 3).map(numOpt))
    };
  }
  if (level === 3) {
    const n = 3 + rnd(8);
    const e = pick(COUNT_EMOJI);
    const mk = (k) => ({ key: String(k), html: `<span class="opt-visual" style="font-size:1.5rem;line-height:1.1;max-width:7rem">${e.repeat(k)}</span><span class="opt-label">${k}</span>`, aria: String(k), cls: 'emoji-tile' });
    const pool = [n - 1, n + 1, n + 2, n - 2].filter((x) => x > 0 && x !== n);
    return {
      prompt: `<div class="prompt-big" style="font-size:6rem;color:#2F80ED">${n}</div><div class="prompt-sub">${esc(L('Cari gambar yang bilangannya sama', 'Find the picture with the same number'))}</div>`,
      instruction: L(`Nombor ${n}. Cari kumpulan yang ada ${n} benda.`, `Number ${n}. Find the group with ${n} items.`),
      hint: L('Kira setiap kumpulan satu per satu.', 'Count each group one by one.'),
      hint2: L(`Kumpulan yang betul ada ${n} benda.`, `The correct group has ${n} items.`),
      options: shuffle([Object.assign(mk(n), { correct: true }), ...shuffle(pool).slice(0, 3).map(mk)])
    };
  }
  const max = level === 4 ? 10 : 20;
  const sub = level === 5 && i % 2 === 1;
  let a, b, ans;
  if (sub) { a = 3 + rnd(max - 4); b = 1 + rnd(a - 1); ans = a - b; }
  else { a = 1 + rnd(Math.floor(max / 2)); b = 1 + rnd(Math.floor(max / 2)); ans = a + b; }
  const e = pick(COUNT_EMOJI);
  const op = sub ? '➖' : '➕';
  const pool = [ans - 1, ans + 1, ans + 2, ans - 2, ans + 3].filter((x) => x >= 0 && x !== ans);
  return {
    prompt: `<div class="prompt-sub">${esc(L('Kira jumlahnya', 'Work out the answer'))}</div>
      <div style="font-size:clamp(1.6rem,7vw,2.6rem);font-weight:800;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:center">
        <span>${e.repeat(Math.min(a, 10))}</span><span>${a}</span><span>${op}</span><span>${e.repeat(Math.min(b, 10))}</span><span>${b}</span><span>=</span><span style="color:#B79CED">?</span></div>`,
    instruction: sub ? L(`${a} tolak ${b} sama dengan berapa?`, `What is ${a} minus ${b}?`) : L(`${a} tambah ${b} sama dengan berapa?`, `What is ${a} plus ${b}?`),
    hint: sub ? L('Tolak bermaksud kita ambil keluar beberapa benda.', 'Minus means we take some items away.') : L('Tambah bermaksud kita kumpulkan semua benda.', 'Plus means we put all the items together.'),
    hint2: L(`Jawapannya ${ans}.`, `The answer is ${ans}.`),
    options: mcq(numOpt(ans), shuffle(pool).slice(0, 3).map(numOpt))
  };
}

      options: mcq(bigOpt(ans.ms, ans.obj), shuffle(pool.filter((s) => s.id !== ans.id)).map((s) => bigOpt(s.ms, s.obj)))
    };
  }
  if (level === 4) {
    const pool = SHAPES.filter((s) => s.sides > 0 && s.sides <= 6);
    const ans = pick(pool);
    const pool2 = [3, 4, 5, 6].filter((n) => n !== ans.sides);

function runColoring(api, pageKey) {
  const el = buildShell(api);
  api.rounds = 1;
  api.setDots(0);
  let picked = PAL[0], filled = 0, used = new Set();
  const total = (PAGES[pageKey].match(/class="region"/g) || []).length;
  api.el.stage.innerHTML = `
    <div class="prompt-sub">${esc(L('Pilih warna, kemudian sentuh bahagian gambar untuk mewarnakannya.', 'Pick a colour, then tap a part of the picture to colour it.'))}</div>
    <div data-page>${PAGES[pageKey]}</div>
    <div class="palette" data-pal></div>
    <div class="row" style="justify-content:center;margin-top:.7rem">
      <button class="btn grass" data-done>✅ ${L('Siap!', 'Done!')}</button>
      <button class="btn ghost" data-clear>🧽 ${L('Padam warna', 'Clear')}</button>
    </div>`;
  const pal = api.el.stage.querySelector('[data-pal]');
  pal.innerHTML = PAL.map((c, i) => `<button class="swatch-btn" data-c="${c}" style="background:${c}" aria-label="${L('Warna', 'Colour')} ${i + 1}" aria-pressed="${i === 0}"></button>`).join('');
  pal.querySelectorAll('.swatch-btn').forEach((b) => {
    b.onclick = () => {
      picked = b.dataset.c;
      pal.querySelectorAll('.swatch-btn').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      audio.sfx('tap');
    };
  });
  api.el.stage.querySelectorAll('.region').forEach((r) => {
    r.setAttribute('tabindex', '0');
    r.setAttribute('role', 'button');
    const paint = () => {
      if (r.dataset.painted) return;
      r.dataset.painted = '1';
      r.style.fill = picked;
      used.add(picked); filled++;
      audio.sfx('pop');
      burstAt(r, ['✨'], 5);
      api.updateScore();
      if (filled === total) api.say(L('Cantik sekali lukisan kamu!', 'Your artwork is beautiful!'), 'cheer');
    };
    r.onclick = paint;
    r.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); paint(); } };
  });
  api.el.stage.querySelector('[data-clear]').onclick = () => {
    api.el.stage.querySelectorAll('.region').forEach((r) => { delete r.dataset.painted; r.style.fill = ''; });
    filled = 0; used = new Set(); api.sfx('whoosh');
  };
  api.el.stage.querySelector('[data-done]').onclick = () => {
    api.stats.total = total;
    api.stats.correct = Math.max(1, Math.round(filled * (used.size >= 2 ? 1 : 0.8)));
    api.stats.streak = used.size;
    finishRound(api);
  };
  api.say(L('Warnakan gambar ini dengan warna kegemaran kamu!', 'Colour this picture with your favourite colours!'));
  startHint(api, () => showHint(api, L('Sentuh bulatan warna dahulu, kemudian sentuh gambar.', 'Tap a colour circle first, then tap the picture.')));
}

const t = (o) => (settings().lang === 'en' ? o.en : o.ms);
const fill = (s, hero, place) => s.replace(/\{hero\}/g, hero).replace(/\{place\}/g, place);

function runStory(api) {
  buildShell(api);
  api.rounds = 3;
  let step = 'hero', hero = MASCOTS[0], place = PLACES[0], values = [], beatsDone = 0, qk = 0, firstTry = true;
  const H = () => hero.name, PL = () => t(place);

  const setStage = (html) => { api.el.stage.innerHTML = html; };
  const setOpts = (cls, html) => { api.el.opts.className = cls; api.el.opts.innerHTML = html; };

  function pickHero() {
    api.setDots(0);
    setStage(`<div class="prompt-text">${esc(L('Pilih kawan cerita kamu!', 'Choose your story friend!'))}</div>
      <div class="row" style="justify-content:center;gap:1rem">${MASCOTS.map((m) => `<span class="mascot lg">${mascotSVG(m.id, 'happy').replace(/^<span[^>]*>|<\/span>$/g, '')}</span>`).join('')}</div>`);
    setOpts('opts', MASCOTS.map((m) => `<button class="opt" data-h="${m.id}"><span class="opt-visual">${m.ico}</span><span class="opt-label">${m.name}</span></button>`).join(''));
    api.el.opts.querySelectorAll('.opt').forEach((b) => {
      b.onclick = () => { hero = MASCOTS.find((m) => m.id === b.dataset.h); audio.sfx('pop'); pickPlace(); };
    });
    api.say(L('Siapa kawan kamu dalam cerita ini?', 'Who is your friend in this story?'));
  }
  function pickPlace() {
    step = 'place';
    setStage(`<div class="prompt-text">${esc(L(`Di mana ${H()} mahu bermain?`, `Where should ${H()} play?`))}</div>`);
    setOpts('opts', PLACES.map((p) => `<button class="opt" data-p="${p.id}"><span class="opt-visual">${p.ico}</span><span class="opt-label">${esc(t(p))}</span></button>`).join(''));
    api.el.opts.querySelectorAll('.opt').forEach((b) => {
      b.onclick = () => { place = PLACES.find((p) => p.id === b.dataset.p); audio.sfx('pop'); beat(0); };
    });
    api.say(L('Pilih tempat cerita ini berlaku.', 'Choose where the story happens.'));
  }
  function beat(i) {
    beatsDone = i;
    const b = BEATS[i];
    const intro = i === 0 ? `<p>${esc(fill(t(INTRO[place.id]), H(), PL()))}</p>` : '';
    setStage(`<div class="story-scene">${intro}<p>${esc(fill(t(b), H(), PL()))}</p>
      <div class="tiny muted">${esc(L('Apa yang patut dilakukan?', 'What should happen next?'))}</div></div>`);
    setOpts('choice-list', b.options.map((o, k) => `<button class="opt" style="align-items:flex-start;text-align:left" data-k="${k}"><span class="opt-label">${esc(fill(t(o), H(), PL()))}</span></button>`).join(''));
    api.el.opts.querySelectorAll('.opt').forEach((btn) => {
      btn.onclick = () => {
        const o = b.options[+btn.dataset.k];
        values.push(o.v); audio.sfx('pop');
        btn.classList.add('correct'); burstAt(btn, ['✨'], 6);
        if (i + 1 < BEATS.length) setTimeout(() => beat(i + 1), 700);
        else setTimeout(ending, 900);
      };
    });
    api.say(fill(t(b), H(), PL()));
  }
  function topValue() {
    const count = {};
    values.forEach((v) => { count[v] = (count[v] || 0) + 1; });
    return Object.entries(count).sort((a, b) => b[1] - a[1])[0][0];
  }
  function ending() {
    const v = topValue();
    const e = ENDINGS[v];
    const story = BEATS.map((b, i) => fill(t(b.options.find((o) => o.v === values[i]) || b.options[0]), H(), PL()));
    const full = `${fill(t(INTRO[place.id]), H(), PL())} ${story.join(' ')} ${fill(t(e), H(), PL())}`;
    setStage(`<div class="story-scene">
        <div style="font-size:3rem;text-align:center">${e.ico}</div>
        <p><b>${esc(L('Tamat cerita', 'The end'))}</b></p>
        <p>${esc(fill(t(e), H(), PL()))}</p>
        <p><span class="pill g">💛 ${esc(L('Nilai murni', 'Moral value'))}: ${esc(t(e.v))}</span></p>
        <details><summary class="tiny">${esc(L('Baca cerita penuh', 'Read the full story'))}</summary><p class="tiny">${esc(full)}</p></details>
      </div>`);
    setOpts('opts', `<button class="btn grass big" data-next>📖 ${L('Jawab soalan cerita', 'Answer story questions')}</button>`);
    api.el.opts.querySelector('[data-next]').onclick = () => { audio.sfx('pop'); question(0); };
    api.say(`${L('Tamat cerita. Nilai murni:', 'The end. The moral value is:')} ${t(e.v)}`, 'cheer');
    burst(window.innerWidth / 2, window.innerHeight / 2, ['📖', '✨', '💛', '⭐'], 14);
  }
  function question(k) {
    qk = k; firstTry = true;
    api.setDots(k);
    const v = topValue();
    let q, options;
    if (k === 0) {
      q = L('Di mana cerita ini berlaku?', 'Where did the story happen?');
      options = PLACES.map((p) => ({ key: p.id, html: `<span class="opt-visual">${p.ico}</span><span class="opt-label">${esc(t(p))}</span>`, aria: t(p), ok: p.id === place.id }));
    } else if (k === 1) {
      q = L('Apa nilai murni dalam cerita ini?', 'What is the moral value of this story?');
      const vals = ['tolong', 'jujur', 'keluarga', 'sabar'];
      options = vals.map((x) => ({ key: x, html: `<span class="opt-label">${esc(t(ENDINGS[x].v))}</span>`, aria: t(ENDINGS[x].v), ok: x === v }));
    } else {
      q = L('Siapa kawan dalam cerita ini?', 'Who was the friend in this story?');
      options = MASCOTS.map((m) => ({ key: m.id, html: `<span class="opt-visual">${m.ico}</span><span class="opt-label">${m.name}</span>`, aria: m.name, ok: m.id === hero.id }));
    }
    setStage(`<div class="prompt-text">${esc(q)}</div>`);
    setOpts('opts', '');
    shuffle(options).forEach((o) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'opt'; b.innerHTML = o.html; b.setAttribute('aria-label', o.aria);
      b.onclick = () => {
        if (o.ok) {
          api.stats.total++; if (firstTry) api.stats.correct++;
          api.stats.streak++; api.stats.best = Math.max(api.stats.best, api.stats.streak);
          markCorrect(api, b); api.updateScore(); api.say(praise(), 'cheer');
          api.setDots(k + 1);
          if (k + 1 < 3) setTimeout(() => question(k + 1), 1200); else setTimeout(() => finishRound(api), 1200);
        } else {
          if (firstTry) { api.stats.total++; firstTry = false; api.stats.streak = 0; }
          markWrong(api, b, null); api.say(retryWord(), 'think'); api.updateScore();
        }
      };
      api.el.opts.appendChild(b);
    });
    api.say(q);
    startHint(api, () => showHint(api, L('Ingat semula cerita tadi.', 'Remember the story you just heard.')));
  }
  pickHero();
}

const SOUNDS = [
  { s: 'mmm', ch: 'M' }, { s: 'sss', ch: 'S' }, { s: 'aaa', ch: 'A' }, { s: 'iii', ch: 'I' },
  { s: 'bbb', ch: 'B' }, { s: 'kkk', ch: 'K' }, { s: 'nnn', ch: 'N' }, { s: 'ttt', ch: 'T' }
];
const PHONW = [
  { w: 'Bola', e: '⚽' }, { w: 'Mata', e: '👁️' }, { w: 'Susu', e: '🥛' }, { w: 'Kaki', e: '🦶' },
  { w: 'Topi', e: '🎩' }, { w: 'Bunga', e: '🌸' }, { w: 'Roti', e: '🍞' }, { w: 'Nanas', e: '🍍' }
];
const READW = [
  { w: 'BOLA', e: '⚽' }, { w: 'BUKU', e: '📚' }, { w: 'SUSU', e: '🥛' }, { w: 'TOPI', e: '🎩' },
  { w: 'MEJA', e: '🪑' }, { w: 'ROTI', e: '🍞' }, { w: 'BUNGA', e: '🌸' }, { w: 'KUCING', e: '🐱' }
];
const SENT = [
  { s: 'Ibu minum susu.', e: '🥛', o: ['🥛', '📚', '⚽'] },
  { s: 'Ayah baca buku.', e: '📚', o: ['📚', '🍞', '🌸'] },
  { s: 'Ari main bola.', e: '⚽', o: ['⚽', '🥛', '🎩'] },
  { s: 'Kakak makan roti.', e: '🍞', o: ['🍞', '🐱', '🪑'] },
  { s: 'Kucing tidur di rumah.', e: '🐱', o: ['🐱', '🌸', '🥛'] }
];

function genPhonics(level, i) {
  if (level === 1) {
    const ans = pick(SOUNDS);
    const pool = SOUNDS.filter((x) => x.ch !== ans.ch);
    return {
      prompt: `<div class="prompt-big">🔊</div><div class="prompt-sub">${esc(L('Dengar bunyi, pilih hurufnya', 'Listen to the sound, pick the letter'))}</div>`,
      instruction: L(`Dengar bunyi "${ans.s}". Huruf apa?`, `Listen to the sound "${ans.s}". Which letter?`),
      say: `${ans.s}`,
      hint: L('Sebut bunyi itu perlahan-lahan, bentuk mulut kamu.', 'Say the sound slowly and feel your mouth shape.'),
      hint2: L(`Bunyi itu ialah huruf ${ans.ch}.`, `That sound is the letter ${ans.ch}.`),
      options: mcq__games_b(textOpt__games_b(ans.ch), pool.map((x) => textOpt__games_b(x.ch)))
    };
  }
  if (level === 2) {
    const o = pick(PHONW);
    const pool = PHONW.filter((x) => x.w !== o.w);
    return {
      prompt: `<div class="prompt-big">${o.e}</div><div class="prompt-text">${esc(o.w)}</div>`,
      instruction: L(`Bunyi pertama bagi ${o.w} ialah?`, `What is the first sound of ${o.w}?`),
      hint: L('Sebut perkataan itu dan dengar bunyi yang paling awal.', 'Say the word and listen to the very first sound.'),
      hint2: L(`Bunyi pertama ialah "${o.w[0]}".`, `The first sound is "${o.w[0]}".`),
      options: mcq__games_b(textOpt__games_b(o.w[0]), pool.map((x) => textOpt__games_b(x.w[0])))
    };
  }
  if (level === 3) {
    const syl = [['BA', 'JU', 'BAJU', '👕'], ['BO', 'LA', 'BOLA', '⚽'], ['BU', 'KU', 'BUKU', '📚'], ['MA', 'TA', 'MATA', '👁️'], ['RO', 'TI', 'ROTI', '🍞'], ['SU', 'SU', 'SUSU', '🥛']];
    const s = pick(syl);
    const pool = syl.filter((x) => x[2] !== s[2]);
    return {
      prompt: `<div style="display:flex;gap:.6rem;align-items:center;font-size:2.2rem;font-weight:800"><span style="background:#E4F4FF;padding:.3rem .8rem;border-radius:1rem">${s[0]}</span><span>➕</span><span style="background:#FFF4D6;padding:.3rem .8rem;border-radius:1rem">${s[1]}</span><span>🟰</span><span>❓</span></div>`,
      instruction: L(`Baca ${s[0]} ${s[1]}. Jadi perkataan apa?`, `Read ${s[0]} ${s[1]}. Which word is it?`),
      hint: L('Cantumkan dua bunyi itu dengan cepat.', 'Blend the two sounds together quickly.'),
      hint2: L(`Jawapannya ${s[2]}.`, `The answer is ${s[2]}.`),
      options: mcq__games_b({ key: s[2], html: `<span class="opt-visual">${s[3]}</span><span class="opt-label">${s[2]}</span>`, aria: s[2] }, pool.map((x) => ({ key: x[2], html: `<span class="opt-visual">${x[3]}</span><span class="opt-label">${x[2]}</span>`, aria: x[2] })))
    };
  }
  if (level === 4) {
    const o = pick(READW);
    const pool = READW.filter((x) => x.w !== o.w);
    return {
      prompt: `<div class="prompt-text" style="letter-spacing:.2rem">${esc(o.w)}</div>`,
      instruction: L('Baca perkataan ini. Pilih gambarnya.', 'Read this word. Pick its picture.'),
      hint: L('Sebut setiap huruf, kemudian gabungkan.', 'Say each letter, then blend them.'),
      hint2: L(`${o.w} — cari gambar itu.`, `${o.w} — find that picture.`),
      options: mcq__games_b(emojiOpt(o.w, o.e), shuffle(pool).slice(0, 3).map((x) => emojiOpt(x.w, x.e)))
    };
  }
  const s = pick(SENT);
  return {
    prompt: `<div class="prompt-text" style="font-size:clamp(1.2rem,4.4vw,1.8rem)">${esc(s.s)}</div>`,
    instruction: L('Baca ayat ini dengan kuat, kemudian pilih gambar yang betul.', 'Read this sentence aloud, then pick the right picture.'),
    hint: L('Cari perkataan yang paling penting dalam ayat itu.', 'Look for the most important word in the sentence.'),
    hint2: L('Gambarnya ialah ' + s.e, 'The picture is ' + s.e),
    options: shuffle(s.o.map((e) => Object.assign(emojiOpt(e, e), { correct: e === s.e })))
  };
}

function genMusicTask(level, i) {
  if (level === 4) {
    const ans = pick(INSTR);
    return {
      mode: 'instrument', instruments: INSTR, answer: ans.id, freq: 523.25,
      clue: L('Dengar bunyi alat muzik ini', 'Listen to this instrument'),
      instruction: L('Alat muzik apa yang kamu dengar?', 'Which instrument did you hear?'),
      hint: L('Gendang berbunyi "dum", loceng berbunyi "ting".', 'A drum goes "dum", a bell goes "ting".')
    };
  }
  const pads = level === 1 || level === 2 ? 4 : level === 3 ? 5 : 6;
  const len = level === 1 ? 2 : level === 2 ? 3 : level === 3 ? 4 : 6;
  const seq = Array.from({ length: len }, () => rnd(pads));
  return {
    mode: 'pads', pads, seq, speed: level >= 5 ? 500 : 620, timbre: level === 5 ? 'bell' : 'piano',
    clue: L(`Ikut irama ${len} bunyi ini`, `Copy this ${len}-note rhythm`),
    instruction: L('Dengar irama, kemudian tekan pad mengikut urutan yang sama.', 'Listen to the rhythm, then tap the pads in the same order.'),
    hint: L('Tengok pad yang menyala, kemudian ikut susunannya.', 'Watch which pad lights up, then follow the order.')
  };
}

let currentCleanup = null;
const parseHash = () => (location.hash || '#/').replace(/^#\/?/, '').split('/');

       function navigate(path) {
  if (location.hash === '#' + path) render();
  else location.hash = path;
}

function render() {
  if (currentCleanup) { try { currentCleanup(); } catch { } currentCleanup = null; }
  stopSpeak();
  closeOverlay(); // pastikan dialog ringkasan/petunjuk tidak menyekat navigasi
  const [route, arg] = parseHash();
  const view = $('#view');
  if (route !== 'parent') delete view.dataset.unlocked; // Mod Ibu Bapa sentiasa berkunci semula
  view.scrollTop = 0;
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  renderTop();
  renderBottom();
  switch (route) {
    case 'play': return playView(view, arg);
    case 'playground': return playgroundView(view);
    case 'rewards': return rewardsView(view);
    case 'settings': return settingsView(view);
    case 'help': return helpView(view);
    case 'parent': return parentView(view);
    case 'story': return playView(view, 'story');
    default: return landingView(view);
  }
}

/* -------------------------- 3. SKRIN PERMAINAN ----------------------- */
function playView(view, gameId) {
  const game = GAMES[gameId];
  if (!game) { navigate('#/playground'); return; }
  audio.unlock();
  if (settings().music) audio.startMusic();
  const level = adaptive.level(game.id);
  const container = document.createElement('div');
  view.innerHTML = '';
  view.appendChild(container);
  const api = makeApi({
    root: container, game, level,
    onExit: () => { audio.stopMusic(); navigate('#/playground'); }
  });
  announce(`${gname(game)} — ${L('Tahap', 'Level')} ${level}`);
  try {
    game.render(api);
  } catch (e) {
    console.error(e);
    container.innerHTML = `<div class="card center"><h2>${L('Maaf, ada masalah kecil', 'Sorry, a small problem')}</h2><p class="muted">${esc(String(e.message || e))}</p>
      <button class="btn" data-back>${L('Kembali', 'Back')}</button></div>`;
    $('[data-back]', container).onclick = () => navigate('#/playground');
  }
  currentCleanup = () => { endSession(api); audio.stopMusic(); stopSpeak(); };
}

function rowToggle(id, label, on, ico) {

function wireSettings(view) {
  $$('[data-toggle]', view).forEach((b) => {
    b.onclick = () => {
      const k = b.dataset.toggle;
      audio.sfx('tap');
      if (k === 'lang_ms' || k === 'lang_en') { setLang(k === 'lang_en' ? 'en' : 'ms'); refresh(); return; }
      setSetting(k, !settings()[k]);
      if (k === 'music') { settings().music ? audio.startMusic() : audio.stopMusic(); }
      if (k === 'tts' && settings().tts) speak(L('Narration dihidupkan. Saya akan membaca semua arahan.', 'Narration is on. I will read every instruction.'));
      refresh();
    };
  });
  const fs = $('#fs', view);
  if (fs) fs.oninput = () => { setSetting('fontPx', +fs.value); $('[data-fs]', view).textContent = fs.value + 'px'; };
  const rt = $('#rate', view);
  if (rt) rt.oninput = () => { setSetting('narrationRate', +rt.value); $('[data-rate]', view).textContent = (+rt.value).toFixed(2); };
  const lm = $('#limit', view);
  if (lm) lm.oninput = () => { setSetting('screenLimitMin', +lm.value); $('[data-limit]', view).textContent = lm.value === '0' ? L('Tiada had', 'No limit') : lm.value + ' ' + L('minit', 'minutes'); };
  const hn = $('#hint', view);
  if (hn) hn.oninput = () => { setSetting('hintDelayMs', +hn.value * 1000); $('[data-hint]', view).textContent = hn.value + 's'; };
  $$('[data-child]', view).forEach((b) => { b.onclick = () => { setActiveChild(b.dataset.child); audio.sfx('pop'); refresh(); toast(L('Profil ditukar', 'Profile switched')); }; });
  const add = $('[data-addchild]', view);
  if (add) add.onclick = () => addChildFlow(refresh);
  const refresh = () => { renderTop(); settingsView(view); };
}

function hashPin(p) { let x = 5381; for (const ch of String(p)) x = ((x << 5) + x + ch.charCodeAt(0)) >>> 0; return 'h' + x.toString(36); }

function parentView(view) {
  const st = state();
  if (!st.parent.pinSet) return setPinView(view);
  if (st.parent.lockedUntil > Date.now()) {
    view.innerHTML = `<div class="card center"><h1>🔒 ${L('Sekejap ya', 'One moment')}</h1>
      <p class="muted">${L('Terlalu banyak cubaan salah. Sila cuba lagi dalam', 'Too many wrong attempts. Please try again in')} ${Math.ceil((st.parent.lockedUntil - Date.now()) / 1000)}s.</p></div>`;
    setTimeout(() => parentView(view), 1000);
    return;
  }
  if (!view.dataset.unlocked) return pinView(view);
  dashboardView(view);
}

function keypadView(view, title, sub, onDone, extra = '') {
  let buf = '';
  view.innerHTML = `
    <div class="card center" style="max-width:32rem;margin:2rem auto">
      <div style="font-size:3rem">👨‍👩‍👧</div>
      <h1>${esc(title)}</h1>
      <p class="muted">${esc(sub)}</p>
      <div class="row" style="justify-content:center;gap:.6rem;margin:.8rem 0" data-dots>${[0, 1, 2, 3].map(() => '<span class="dot" style="width:1.4rem;height:1.4rem"></span>').join('')}</div>
      <div class="grid" style="grid-template-columns:repeat(3,1fr);max-width:20rem;margin:0 auto;gap:.6rem">
        ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button class="btn ghost" data-k="${n}" style="min-height:4rem;font-size:1.5rem">${n}</button>`).join('')}
        <button class="btn ghost" data-k="del" style="min-height:4rem">⌫</button>
        <button class="btn ghost" data-k="0" style="min-height:4rem;font-size:1.5rem">0</button>
        <button class="btn grass" data-k="ok" style="min-height:4rem">✓</button>
      </div>
      ${extra}
      <p class="tiny muted mt1">${L('PIN menghalang kanak-kanak daripada menukar tetapan.', 'The PIN stops children from changing settings.')}</p>
    </div>`;
  const dots = () => $$('[data-dots] .dot', view).forEach((d, i) => d.classList.toggle('done', i < buf.length));
  const press = (k) => {
    audio.sfx('tap');
    if (k === 'del') buf = buf.slice(0, -1);
    else if (k === 'ok') { if (buf.length === 4) onDone(buf); else toast(L('Masukkan 4 digit', 'Enter 4 digits')); return; }
    else if (buf.length < 4) buf += k;
    dots();
  };
  $$('[data-k]', view).forEach((b) => { b.onclick = () => press(b.dataset.k); });
  view.onkeydown = (e) => { if (/^[0-9]$/.test(e.key)) press(e.key); if (e.key === 'Backspace') press('del'); if (e.key === 'Enter') press('ok'); };
}

function setPinView(view) {
  keypadView(view, L('Cipta PIN ibu bapa', 'Create a parent PIN'), L('Pilih 4 digit yang mudah diingat oleh ibu bapa.', 'Choose 4 digits that are easy for a parent to remember.'), (pin) => {
    const st = state();
    st.parent.pin = hashPin(pin); st.parent.pinSet = true; st.parent.failedTries = 0;
    save(); audio.sfx('badge'); toast(L('PIN disimpan', 'PIN saved'));
    view.dataset.unlocked = '1'; parentView(view);
  });
}

function pinView(view) {
  keypadView(view, L('Mod Ibu Bapa', 'Parent Mode'), L('Masukkan PIN 4 digit untuk teruskan.', 'Enter your 4-digit PIN to continue.'), (pin) => {
    const st = state();
    if (hashPin(pin) === st.parent.pin) {
      st.parent.failedTries = 0; save();
      audio.sfx('badge'); view.dataset.unlocked = '1'; parentView(view);
    } else {
      st.parent.failedTries = (st.parent.failedTries || 0) + 1;
      audio.sfx('wrong');
      if (st.parent.failedTries >= 5) { st.parent.lockedUntil = Date.now() + 60000; st.parent.failedTries = 0; }
      save(); toast(L('PIN salah', 'Wrong PIN'));
      parentView(view);
    }
  }, `<button class="btn ghost mt1" data-forgot>${L('Lupa PIN? Set semula', 'Forgot PIN? Reset')}</button>`)
  ;
  const f = $('[data-forgot]', view);
  if (f) f.onclick = () => {
    if (!confirm(L('Set semula PIN? Data kemajuan kanak-kanak tidak akan dipadam.', 'Reset the PIN? Children\'s progress data will not be deleted.'))) return;
    const st = state(); st.parent.pin = null; st.parent.pinSet = false; save(); parentView(view);
  };
}

function wireDashboard(view) {
  $$('[data-go]', view).forEach((b) => { b.onclick = () => navigate(b.dataset.go); });
  const lock = $('[data-lock]', view);
  if (lock) lock.onclick = () => { delete view.dataset.unlocked; audio.sfx('whoosh'); parentView(view); };
  const rep = $('[data-report]', view);
  if (rep) rep.onclick = () => printReport();
  const ex = $('[data-export]', view);
  if (ex) ex.onclick = () => {
    const data = JSON.stringify(state(), null, 2);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    a.download = `ai-playground-data-${todayKey()}.json`;
    a.click();
    toast(L('Data dieksport', 'Data exported'));
  };
  const w = $('[data-wipe]', view);
  if (w) w.onclick = () => {
    if (!confirm(L('Padam semua data kemajuan? Tindakan ini tidak boleh dibatalkan.', 'Delete all progress data? This cannot be undone.'))) return;
    localStorage.removeItem('aipk.v2'); location.reload();
  };
  $$('[data-switch]', view).forEach((b) => { b.onclick = () => { setActiveChild(b.dataset.switch); renderTop(); dashboardView(view); }; });
  $$('[data-del]', view).forEach((b) => {
    b.onclick = () => {
      if (!confirm(L('Padam profil ini?', 'Delete this profile?'))) return;
      if (removeChild(b.dataset.del)) { renderTop(); dashboardView(view); } else toast(L('Mesti ada sekurang-kurangnya satu profil', 'At least one profile is required'));
    };
  });
  const a2 = $('[data-addchild2]', view);
  if (a2) a2.onclick = () => addChildFlow(() => { renderTop(); dashboardView(view); });
}

    b.onclick = () => {
      avatar = b.dataset.av2;
      $$('[data-av2]', sheet).forEach((x) => { x.className = 'btn ' + (x === b ? 'purple' : 'ghost'); });
    };
  });
  $('[data-ac-cancel]', sheet).onclick = closeOverlay;
  $('[data-ac-save]', sheet).onclick = () => {
    addChild($('#ac-name', sheet).value, +$('#ac-age', sheet).value, avatar);
    closeOverlay(); toast(L('Profil ditambah', 'Profile added')); if (after) after();
  };
}

/* --------------------------- 9. MASA SKRIN --------------------------- */
       function checkScreenTime() {
  const [route] = parseHash();
  if (route === 'parent') return;
  if (!screenTime.locked()) {
    const left = screenTime.remaining();
    if (left !== Infinity && left <= 5 && !checkScreenTime.warned) {
      checkScreenTime.warned = true;
      overlay(`<div class="center"><div style="font-size:3rem">⏳</div><h2>${L('5 minit lagi', '5 minutes left')}</h2>
        <p class="muted">${L('Masa bermain hampir tamat. Mari bersiap untuk aktiviti lain.', 'Play time is almost over. Let us get ready for another activity.')}</p>
        <button class="btn grass big" data-ok>${L('Baik, faham', 'Okay, understood')}</button></div>`);
      const s = $('#overlay .sheet');
      $('[data-ok]', s).onclick = () => { closeOverlay(); speak(L('Lima minit lagi ya.', 'Five more minutes.')); };
    }
    return;
  }
  if (checkScreenTime.shown) return;
  checkScreenTime.shown = true;
  stopSpeak();
  overlay(`<div class="center"><div style="font-size:3.5rem">🌙</div>
    <h1>${L('Masa bermain tamat', 'Play time is over')}</h1>
    <p class="muted">${L('Kamu sudah bermain cukup lama hari ini. Mari berehat, minum air dan bermain di luar!', 'You have played enough today. Let us rest, drink water and play outside!')}</p>
    <div class="row" style="justify-content:center"><span class="mascot lg">${inner(mascotSVG('kiko', 'happy'))}</span></div>
    <div class="row mt2" style="justify-content:center">
      <button class="btn purple big" data-parent>👨‍👩‍👧 ${L('Mod Ibu Bapa', 'Parent Mode')}</button>
    </div>
    <p class="tiny muted mt1">${L('Ibu bapa boleh menambah had masa dalam Tetapan atau Mod Ibu Bapa.', 'Parents can increase the limit in Settings or Parent Mode.')}</p></div>`, { sticky: true });
  const s = $('#overlay .sheet');
  $('[data-parent]', s).onclick = () => { closeOverlay(); checkScreenTime.shown = false; navigate('#/parent'); };
  speak(L('Masa bermain tamat. Jumpa lagi esok!', 'Play time is over. See you tomorrow!'));
}

/* ---------------------------- 10. BOOT ------------------------------- */
       function boot() {
  load();
  document.documentElement.lang = settings().lang;
  const onFirst = () => {
    audio.unlock();
    if (settings().music && !isOverlayOpen()) audio.startMusic();
    document.removeEventListener('pointerdown', onFirst);
  };
  document.addEventListener('pointerdown', onFirst, { once: false });

  window.addEventListener('hashchange', render);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isOverlayOpen()) closeOverlay();
    if (e.altKey && e.key === 'h') navigate('#/');
    if (e.altKey && e.key === 'p') navigate('#/playground');
  });
  onChange((evt) => { if (evt === 'stars' || evt === 'rewards') renderTop(); });

  render();
  if (!state().onboarded) setTimeout(() => onboardingFlow(), 400);

  // Kiraan masa skrin
  setInterval(() => {
    if (document.visibilityState !== 'visible') return;
    const [route] = parseHash();
    if (route === 'parent' || isOverlayOpen()) return;
    screenTime.add(0.5);
    checkScreenTime();
  }, 30000);
  checkScreenTime();

  // PWA
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
  safety.audit('app_started', { lang: settings().lang });
}

/* main.js — titik masuk aplikasi */
                               

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
