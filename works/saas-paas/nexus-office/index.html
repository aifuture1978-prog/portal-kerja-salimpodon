<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS Office — Miniatur Workflow Orchestration</title>
<style>
/* =====================================================================
   TEMA: pejabat miniatur
   - Langit kebiruan di luar, dinding kuning pucat di dalam bilik
   - Lantai kayu jati, perabot pixel, watak kartun sederhana
   - Semua dalam Bahasa Malaysia
   ===================================================================== */
:root{
  --sky:#bde0fe; --sky2:#a2d2ff; --grass:#c7e9b0;
  --floor:#d4a373; --floor2:#b08968; --wall:#fef3c7; --wall-trim:#e6c47a;
  --desk:#a0522d; --desk-top:#cd853f; --chair:#6f4e37; --monitor:#1f2937; --screen:#0ea5e9;
  --ink:#0f172a; --ink-soft:#475569; --ink-mute:#94a3b8;
  --paper:#fff8e7; --paper-edge:#e9d6a8;
  --ok:#16a34a; --warn:#d97706; --err:#dc2626; --info:#2563eb;
  --shadow:rgba(15,23,42,.18);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--sky);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* shell */
#app{display:grid;grid-template-rows:48px 1fr 28px;height:100vh;background:linear-gradient(180deg,#bde0fe 0%,#a2d2ff 35%,var(--grass) 100%)}

/* topbar */
#topbar{display:flex;align-items:center;gap:12px;padding:0 14px;background:rgba(255,255,255,.85);border-bottom:1px solid #cbd5e1;backdrop-filter:blur(8px)}
#topbar .logo{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--ink)}
#topbar .logo .dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f97316);box-shadow:0 0 0 3px rgba(249,115,22,.18)}
#topbar .crumb{display:flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:13px}
#topbar .crumb b{color:var(--ink)}
#topbar .spacer{flex:1}
.btn{padding:6px 12px;border-radius:8px;background:#fff;border:1px solid #cbd5e1;font-size:13px;color:var(--ink);font-weight:600}
.btn:hover{background:#f1f5f9}
.btn.pri{background:var(--info);color:#fff;border-color:var(--info)}
.btn.pri:hover{background:#1d4ed8}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ok:hover{background:#15803d}
.btn.warn{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn.err{background:var(--err);color:#fff;border-color:var(--err)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#speedSel{padding:5px 8px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;font-size:12px}

/* room selector */
#roomSelector{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.7);border-radius:10px;border:1px solid #cbd5e1}
#roomSelector .wf{padding:5px 10px;border-radius:7px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;color:var(--ink-soft);cursor:pointer}
#roomSelector .wf:hover{background:#f1f5f9;color:var(--ink)}
#roomSelector .wf.act{background:#fff;color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
#roomSelector .wf .ct{font-size:10px;color:var(--ink-mute);font-weight:500}

/* main */
#main{display:grid;grid-template-columns:60px 1fr 340px;min-height:0}

/* palette rail */
#palRail{background:rgba(255,255,255,.7);border-right:1px solid #cbd5e1;padding:6px 4px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.pal-cat{font-size:10px;font-weight:700;color:var(--ink-mute);padding:6px 4px 2px;text-transform:uppercase;letter-spacing:.5px}
.pal-it{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:6px;font-size:11px;background:#fff;border:1px solid #e2e8f0;color:var(--ink);cursor:grab}
.pal-it:hover{border-color:#94a3b8;background:#f8fafc}
.pal-it .ic{font-size:14px}

/* stage — the office miniworld */
#stage{position:relative;overflow:hidden;cursor:grab}
#stage.pan{cursor:grabbing}
#floor{position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,transparent 0 79px,rgba(0,0,0,.06) 79px 80px),
  repeating-linear-gradient(0deg,transparent 0 39px,rgba(0,0,0,.04) 39px 40px),
  linear-gradient(180deg,#d4a373,#b08968)}
#skyline{position:absolute;top:0;left:0;right:0;height:60px;background:linear-gradient(180deg,#bde0fe,#a2d2ff);border-bottom:2px solid #7c9eb2}
#skyline::after{content:'';position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(180deg,transparent,#7c9eb2)}
.clouds{position:absolute;top:8px;left:0;right:0;height:30px;pointer-events:none}
.cloud{position:absolute;width:46px;height:14px;background:#fff;border-radius:14px;opacity:.85;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cloud::before{content:'';position:absolute;left:8px;top:-6px;width:18px;height:14px;background:#fff;border-radius:14px}
.cloud::after{content:'';position:absolute;right:8px;top:-5px;width:14px;height:12px;background:#fff;border-radius:14px}

/* room container */
.room{position:absolute;background:var(--wall);border:3px solid var(--wall-trim);border-radius:8px;box-shadow:0 4px 12px var(--shadow),inset 0 0 0 2px rgba(255,255,255,.5);overflow:hidden}
.room::before{content:attr(data-label);position:absolute;top:6px;left:8px;background:rgba(15,23,42,.85);color:#fff;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.5px;z-index:5;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.room::after{content:attr(data-sub);position:absolute;top:6px;right:8px;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;color:var(--ink-soft);z-index:5}
.room .deco{position:absolute;bottom:0;left:0;right:0;height:8px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.1))}
.window-row{position:absolute;top:24px;left:0;right:0;display:flex;justify-content:space-around;padding:0 12px;pointer-events:none;z-index:1}
.window{width:22px;height:18px;background:linear-gradient(180deg,#bfdbfe,#dbeafe);border:2px solid #64748b;border-radius:2px;position:relative}
.window::after{content:'';position:absolute;inset:0;background:linear-gradient(45deg,transparent 45%,rgba(255,255,255,.6) 50%,transparent 55%)}

/* character desk */
.char-desk{position:absolute;width:120px;height:118px}
.char-desk .desk-svg{position:absolute;left:6px;top:36px;width:108px;height:80px}
.char-desk .char-svg{position:absolute;left:18px;top:0;width:84px;height:80px;z-index:2}
.char-desk .label{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:9px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.92);padding:2px 4px;border-radius:4px;border:1px solid #cbd5e1;box-shadow:0 1px 2px rgba(0,0,0,.1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3}
.char-desk .badge{position:absolute;left:-6px;top:-6px;background:var(--info);color:#fff;font-size:9px;font-weight:700;padding:2px 5px;border-radius:8px;z-index:4;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.char-desk .port{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--ink-soft);z-index:4;cursor:crosshair}
.char-desk .port:hover{background:#fbbf24;transform:scale(1.2)}
.char-desk .port.in{left:-7px;top:50%;margin-top:-7px}
.char-desk .port.out{right:-7px;top:50%;margin-top:-7px}
.char-desk .port.out-2{right:-7px;top:80%;margin-top:-7px}

/* character states */
.char-desk.s-running .char-svg{animation:bob .9s ease-in-out infinite}
.char-desk.s-running .badge{background:var(--info)}
.char-desk.s-success .badge{background:var(--ok)}
.char-desk.s-error .badge{background:var(--err)}
.char-desk.s-error .char-svg{animation:shake .4s ease-in-out infinite}
.char-desk.s-retrying .badge{background:var(--warn)}
.char-desk.s-retrying .char-svg{animation:pulse 1.2s ease-in-out infinite}
.char-desk.s-queued .badge{background:var(--ink-mute)}
.char-desk.s-waiting .badge{background:#cbd5e1;color:var(--ink)}
.char-desk.s-queued .badge::after{content:'…'}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* document in flight */
.doc{position:absolute;width:18px;height:14px;background:var(--paper);border:1px solid var(--paper-edge);border-radius:1px;box-shadow:0 1px 2px rgba(0,0,0,.2);z-index:50;pointer-events:none}
.doc::before{content:'';position:absolute;left:2px;right:2px;top:3px;height:1px;background:rgba(0,0,0,.15)}
.doc::after{content:'';position:absolute;left:2px;right:2px;top:6px;height:1px;background:rgba(0,0,0,.15)}
.doc.doc-err{background:#fecaca;border-color:#dc2626}
.doc.doc-warn{background:#fde68a;border-color:#d97706}
.doc.doc-ok{background:#bbf7d0;border-color:#16a34a}

/* corridor lines between rooms */
.corridor{position:absolute;pointer-events:none;z-index:3}

/* right rail */
#rightRail{background:rgba(255,255,255,.85);border-left:1px solid #cbd5e1;padding:0;display:flex;flex-direction:column;overflow:hidden}
#rrTabs{display:flex;border-bottom:1px solid #cbd5e1;background:#fff}
#rrTabs .t{padding:8px 12px;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent}
#rrTabs .t.act{color:var(--ink);border-bottom-color:var(--info)}
#rrTabs .t:hover{color:var(--ink)}
#rrBody{flex:1;overflow-y:auto;padding:10px}
#rrBody h4{margin:8px 0 4px;font-size:11px;text-transform:uppercase;color:var(--ink-mute);letter-spacing:.5px}
#rrBody .card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12px}
#rrBody .card .k{color:var(--ink-mute);font-size:10px;text-transform:uppercase}
#rrBody .card .v{font-weight:600;color:var(--ink);font-size:13px}

/* statusbar */
#statusbar{display:flex;align-items:center;gap:14px;padding:0 12px;background:rgba(15,23,42,.92);color:#fff;font-size:11px;font-weight:600}
#statusbar .stat{display:flex;align-items:center;gap:4px}
#statusbar .stat .v{color:#fbbf24}
#statusbar .stat.ok .v{color:#4ade80}
#statusbar .stat.err .v{color:#f87171}
#statusbar .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-mute)}
#statusbar .dot.run{background:#3b82f6;animation:pulse 1.2s infinite}
#statusbar .dot.ok{background:#22c55e}
#statusbar .dot.err{background:#ef4444}

/* NDV modal */
#ndv{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(3px)}
#ndv.open{display:flex}
#ndv .box{background:#fff;border-radius:14px;width:min(720px,90vw);max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#ndv .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #e2e8f0;background:linear-gradient(180deg,#f8fafc,#fff)}
#ndv .hd .ch{font-size:34px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#f1f5f9;border:2px solid #cbd5e1}
#ndv .hd .ti{font-size:15px;font-weight:700;color:var(--ink)}
#ndv .hd .sub{font-size:11px;color:var(--ink-soft);margin-top:2px}
#ndv .hd .x{margin-left:auto;background:none;color:var(--ink-soft);font-size:18px;padding:4px 10px;border-radius:6px}
#ndv .hd .x:hover{background:#f1f5f9;color:var(--ink)}
#ndv .nav{display:flex;background:#f8fafc;border-bottom:1px solid #e2e8f0;padding:0 16px}
#ndv .nav .t{padding:10px 14px;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent}
#ndv .nav .t.act{color:var(--ink);border-bottom-color:var(--info);background:#fff}
#ndv .bd{flex:1;overflow-y:auto;padding:14px 16px}
#ndv .ft{display:flex;gap:8px;padding:10px 16px;border-top:1px solid #e2e8f0;background:#f8fafc}
#ndv .ft .spacer{flex:1}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;margin-bottom:10px}
.kv .k{color:var(--ink-soft);font-size:12px;padding-top:2px}
.kv .v{color:var(--ink);font-size:13px;font-weight:500}
.jsonh{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;background:#0f172a;color:#e2e8f0;padding:10px;border-radius:8px;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow-y:auto}
.jsonh .k{color:#7dd3fc}
.jsonh .s{color:#fbbf24}
.jsonh .n{color:#a78bfa}
.jsonh .b{color:#f472b6}

/* toast */
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80vw}
#toast.show{opacity:1}
#toast.warn{background:#d97706}
#toast.err{background:#dc2626}
#toast.ok{background:#16a34a}

/* stickies */
.sticky{position:absolute;padding:6px 8px;border-radius:4px;font-size:10px;font-weight:600;line-height:1.3;color:var(--ink);box-shadow:0 2px 4px rgba(0,0,0,.15);max-width:200px;z-index:6;font-family:"Comic Sans MS",cursive}
.sticky.gold{background:#fef3c7;border:1px solid #fbbf24;transform:rotate(-2deg)}
.sticky.blue{background:#dbeafe;border:1px solid #60a5fa;transform:rotate(1.5deg)}
.sticky.red{background:#fee2e2;border:1px solid #f87171;transform:rotate(-1deg)}

/* scrollbars */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.35)}

</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo"><span class="dot"></span>NEXUS Office</div>
    <div class="crumb">› <b id="crumbWF">Kilang Video</b> · <span id="crumbMeta">Miniatur Workflow Orchestration</span></div>
    <div id="roomSelector"></div>
    <div class="spacer"></div>
    <select id="speedSel" title="Kelajuan">
      <option value="1">1×</option>
      <option value="2" selected>2×</option>
      <option value="3">3×</option>
      <option value="6">6×</option>
    </select>
    <button class="btn" id="resetBtn" title="Reset">↺ Reset</button>
    <button class="btn ok" id="runBtn" title="Jalankan aliran">▶ Jalankan</button>
  </div>

  <div id="main">
    <div id="palRail"></div>
    <div id="stage">
      <div id="skyline"><div class="clouds" id="clouds"></div></div>
      <div id="floor"></div>
      <div id="world"></div>
    </div>
    <div id="rightRail">
      <div id="rrTabs">
        <div class="t act" data-tab="nod">Nod</div>
        <div class="t" data-tab="pelaksanaan">Pelaksanaan</div>
        <div class="t" data-tab="garismasa">Garis Masa</div>
        <div class="t" data-tab="stat">Statistik</div>
      </div>
      <div id="rrBody"></div>
    </div>
  </div>

  <div id="statusbar">
    <div class="stat"><span class="dot" id="statusDot"></span><span id="statusText">Sedia</span></div>
    <div class="stat">Nod: <span class="v" id="stNodes">0</span></div>
    <div class="stat ok">Item: <span class="v" id="stItems">0</span></div>
    <div class="stat">Token: <span class="v" id="stTokens">0</span></div>
    <div class="stat">Kos: <span class="v" id="stCost">$0.0000</span></div>
    <div class="stat">Masa: <span class="v" id="stTime">0ms</span></div>
    <div class="spacer" style="flex:1"></div>
    <div class="stat" id="stHint">Klik watak untuk butiran · Seret untuk panorama</div>
  </div>
</div>

<div id="ndv">
  <div class="box">
    <div class="hd">
      <div class="ch" id="ndvCh"></div>
      <div>
        <div class="ti" id="ndvTi"></div>
        <div class="sub" id="ndvSub"></div>
      </div>
      <button class="x" id="ndvX">×</button>
    </div>
    <div class="nav">
      <div class="t act" data-ntab="parameter">Parameter</div>
      <div class="t" data-ntab="input">Input</div>
      <div class="t" data-ntab="output">Output</div>
      <div class="t" data-ntab="log">Log</div>
    </div>
    <div class="bd" id="ndvBd"></div>
    <div class="ft">
      <span style="color:var(--ink-mute);font-size:11px" id="ndvId"></span>
      <div class="spacer"></div>
      <button class="btn" id="ndvClose2">Tutup</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
   PART C — Jenis nod, kategori, definisi watak & bilik
   ===================================================================== */
const T = {
  /* pencetus */
  webhook:      ['trigger','⚡','Webhook','Permintaan HTTP masuk'],
  schedule:     ['trigger','⏰','Jadual (Cron)','Cetus mengikut jadual cron'],
  manual:       ['trigger','▶','Pencetus Manual','Cetus secara manual'],
  form:         ['trigger','📝','Borang Web','Hantar borang awam'],
  emailIn:      ['trigger','📧','E-mel Masuk','IMAP: e-mel baharu'],
  fileWatch:    ['trigger','📁','Pemantau Fail','Fail baharu muncul'],
  queueTrig:    ['trigger','📥','Antrian Mesej','Mesej baharu dalam antrian'],
  appEvent:     ['trigger','🔔','Peristiwa Aplikasi','Webhook pihak ketiga'],
  chatTrig:     ['trigger','💬','Mesej Sembang','Mesej masuk'],
  errorTrig:    ['trigger','⚠','Pencetus Ralat','Tangkap ralat aliran',{c:'#f0805f'}],
  /* AI / Ejen */
  llm:          ['ai','🧠','Model Bahasa','Jana teks dengan LLM'],
  agent:        ['ai','🤖','Ejen AI','Ejen autonomi'],
  classifier:   ['ai','🏷','Pengelas','Klasifikasi kategori'],
  embedder:     ['ai','🧬','Embedding','Tukar teks kepada vektor'],
  vectorStore:  ['ai','🗄','Stor Vektor','Cari persamaan'],
  vision:       ['ai','👁','Penglihatan','Analisis imej'],
  stt:          ['ai','🎙','Tutur→Teks','Transkripsi audio'],
  tts:          ['ai','🔊','Teks→Tutur','Sintesis suara'],
  imageGen:     ['ai','🎨','Jana Imej','Imej generatif'],
  reranker:     ['ai','📊','Penyusun Semula','Susun hasil carian'],
  summarizer:   ['ai','📝','Perumus','Ringkaskan teks'],
  extractor:    ['ai','🧾','Pengekstrak','Keluarkan entiti'],
  guard:        ['ai','🛡','Pengawal','Tapis tidak selamat'],
  translator:   ['ai','🔤','Penterjemah','Terjemah bahasa'],
  ocr:          ['ai','🔍','OCR','Teks daripada imej'],
  sentiment:    ['ai','😊','Sentimen','Skor sentimen'],
  /* logik */
  ifNode:       ['logic','🔀','Jika','Cabang benar/palsu',{o:2,ol:['benar','palsu']}],
  switchNode:   ['logic','🎚','Suis','Berbilang cabang',{o:3,ol:['A','B','lalai']}],
  merge:        ['logic','🔗','Gabung','Gabung aliran'],
  loop:         ['logic','🔁','Gelung','Ulang setiap item',{o:2,ol:['gelung','selesai']}],
  wait:         ['logic','⏳','Tunggu','Jeda'],
  filter:       ['logic','🪄','Penapis','Tapis item'],
  code:         ['logic','⌨','Kod (JS)','Jalankan JavaScript'],
  splitBatch:   ['logic','✂','Pecah Kelompok','Pecah kecil'],
  noOp:         ['logic','⭕','Tiada Op','Titik gabung'],
  stopError:    ['logic','🛑','Henti Ralat','Gagalkan aliran',{c:'#f0805f'}],
  subWorkflow:  ['logic','🧩','Sub-Aliran','Panggil aliran lain'],
  approval:     ['logic','✋','Kelulusan','Tunggu manusia',{o:2,ol:['lulus','tolak'],c:'#e06ea8'}],
  rateLimit:    ['logic','🚦','Had Kadar','Kawal kadar'],
  retryWrap:    ['logic','🔄','Cuba Semula','Balut retry'],
  /* data */
  setFields:    ['data','✏','Tetapkan Medan','Ubah medan'],
  aggregate:    ['data','📦','Agregat','Kumpulkan item'],
  sort:         ['data','🔢','Susun','Isih item'],
  limit:        ['data','🔻','Had','Hadkan item'],
  dedupe:       ['data','🧹','Nyahduplikasi','Buang duplikat'],
  crypto:       ['data','🔐','Kripto','Hash/HMAC'],
  dateTime:     ['data','📅','Tarikh & Masa','Format tarikh'],
  xmlJson:      ['data','🔠','XML↔JSON','Tukar format'],
  csvDoc:       ['data','📄','CSV','Hurai/jana CSV'],
  compare:      ['data','⚖','Banding','Banding dua set'],
  rename:       ['data','🔡','Nama Semula','Ubah nama medan'],
  htmlExtract:  ['data','🕸','Hurai HTML','Ekstrak HTML'],
  mathSum:      ['data','➗','Matematik','Kira agregat'],

/* ---------- utiliti ---------- */
let _seed=20261003;
function seedSet(n){_seed=(n>>>0)||1}
function srand(){_seed=(_seed*1664525+1013904223)>>>0;return _seed/4294967296}
function ri(a,b){return a+Math.floor(srand()*(b-a+1))}
function rf(a,b){return a+srand()*(b-a)}
function pick(a){return a[Math.floor(srand()*a.length)]}
function pickn(a,n){const c=a.slice();const o=[];while(o.length<n&&c.length)o.push(c.splice(Math.floor(srand()*c.length),1)[0]);return o}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[m]))}
function fmtNum(v){return(v==null||isNaN(v))?'0':Math.round(v).toLocaleString('en-US')}
function fmtMoney(v){return'$'+(v||0).toFixed(4)}
function fmtDur(ms){if(ms<1000)return Math.round(ms)+'ms';if(ms<60000)return(ms/1000).toFixed(1)+'s';return Math.floor(ms/60000)+'m'+Math.round((ms%60000)/1000)+'s'}
function ts(){const x=new Date();const p=v=>String(v).padStart(2,'0');return p(x.getHours())+':'+p(x.getMinutes())+':'+p(x.getSeconds())+'.'+String(x.getMilliseconds()).padStart(3,'0')}
function isoLocal(d){const x=d||new Date();const p=v=>String(v).padStart(2,'0');return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate())+' '+p(x.getHours())+':'+p(x.getMinutes())+':'+p(x.getSeconds())}
function rndId(p,n){let s='';const a='abcdef0123456789';for(let i=0;i<n;i++)s+=a[Math.floor(srand()*a.length)];return p+s}
function humanWait(ms){if(ms>=86400000)return Math.round(ms/86400000)+' hari';if(ms>=3600000)return Math.round(ms/3600000)+' jam';if(ms>=60000)return Math.round(ms/60000)+' minit';return Math.round(ms/1000)+' saat'}

function jsonHtml(o, depth){
  depth=depth||0;
  if(depth>6)return'<span class="k">…</span>';
  if(o===null)return'<span class="b">null</span>';
  if(typeof o==='string')return'<span class="s">"'+esc(o).replace(/\n/g,'\\n')+'"</span>';
  if(typeof o==='number')return'<span class="n">'+o+'</span>';
  if(typeof o==='boolean')return'<span class="b">'+o+'</span>';
  if(Array.isArray(o)){
    if(!o.length)return'[]';
    const pad='  '.repeat(depth+1),pad0='  '.repeat(depth);
    return'[\n'+o.map(v=>pad+jsonHtml(v,depth+1)).join(',\n')+'\n'+pad0+']';
  }
  if(typeof o==='object'){
    const ks=Object.keys(o);
    if(!ks.length)return'{}';
    const pad='  '.repeat(depth+1),pad0='  '.repeat(depth);
    return'{\n'+ks.map(k=>pad+'<span class="k">"'+esc(k)+'"</span>: '+jsonHtml(o[k],depth+1)).join(',\n')+'\n'+pad0+'}';
  }
  return esc(String(o));
}

function rndId(p,n){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<(n||6);i++)s+=c[Math.floor(srand()*c.length)];return(p||'')+s;}

function makeItems(node, wfId, nIn, forceN){
  const C = CORPUS[wfId] || {};
  const d = tdef(node.t);
  const ctx = ctxOf(wfId);
  const ix = (a,i,fb)=>{const arr=(a&&a.length)?a:null;return arr?arr[(i+ctx.step)%arr.length]:fb;};
  let n;
  if(forceN != null) n = forceN;
  else if(d.cat === 'trigger') n = ri(1,3);
  else if(nIn > 0) n = nIn;

  n = clamp(n, 1, 12);
  const items = [];
  for(let i=0;i<n;i++) items.push({json: payload(node, C, i, n, ix, ctx)});
  return items;
}

/* =====================================================================
   PART E — Enjin pelaksanaan (baris gilir, tak segerak, gelung, cabang)
   ===================================================================== */
const state = {
  cur:'video', view:{scale:1, ox:0, oy:0},
  sel:null, selSet:new Set(), hover:null,
  speed:2, running:false, paused:false,
  exec:null, history:[], exSeq:1000,
  tab:'nod', ndv:null, ndvTab:'parameter',
  drag:null, pan:null,
  maxConc:3, autoFollow:true,
  roomMap:{}, /* id nod → id bilik */
};
const META = {};
const ERRBRANCH = ['http','stripe','shopify','youtube','sap','twilio','sendgrid','smtp',
                   'postgres','s3','mqtt','jira','gmail','hubspot','notion','sheets','slack'];

function buildMeta(){
  WORKFLOWS.forEach(wf => {
    META[wf.id] = {};
    wf.nodes.forEach(n => {
      const isErr = ERRBRANCH.includes(n.t);
      META[wf.id][n.id] = {
        out: tdef(n.t).out,
        ol: tdef(n.t).ol,
        errOut: isErr,
        errIdx: tdef(n.t).out,
        maxRetries: isErr ? 2 : 0,
        onError: isErr ? 'continueErrorOutput' : 'stopWorkflow',
        backoff: 'exponential',
      };
    });
  });
}
buildMeta();

function curWF(){return WORKFLOWS.find(w=>w.id===state.cur)||WORKFLOWS[0];}
function wfById(id){return WORKFLOWS.find(w=>w.id===id);}
function nodeById(wfId,id){const wf=wfById(wfId);return wf?wf.nodes.find(n=>n.id===id):null;}
function metaOf(n){return (META[curWF().id]||{})[n.id]||{out:1,ol:['utama'],errOut:false,errIdx:-1,maxRetries:0,onError:'stopWorkflow'};}

function nodeDur(n){
  if(n.t==='wait'||n.t==='approval'){
    const ms=n.p.ms||(n.t==='approval'?3600000:60000);
    return clamp(620+Math.log10(Math.max(ms,1000)/1000)*880,620,3200);
  }
  const p=perf(n.t);
  return rf(p.d0,p.d1);
}

function resetRun(){
  const wf=curWF();
  wf.edges.forEach(e=>{e.resolved=false;e.active=true;});
  wf.nodes.forEach(n=>{n.runs=0;n.lastRun=null;});
  state.exec=null; state.running=false; state.paused=false;
  GEN_STEP=0;
  document.querySelectorAll('.doc').forEach(d=>d.remove());
  syncRunUI(); syncCanvas(); renderPanel();
}

function startRun(){
  if(state.running) return;
  const wf=curWF();
  resetRun();
  state.exSeq++;
  const ex = {
    id:'EX-'+state.exSeq, wf:wf.id, wfNama:wf.nama,
    status:'running', t0:performance.now(), wall0:Date.now(), endT:null,
    nodes:{}, order:[], spans:[], queue:[], running:0, pulses:[],
    logs:[], totals:{items:0,tokens:0,cost:0,nodes:0},
    err:null, retrying:0,
  };
  wf.nodes.forEach(n => {
    ex.nodes[n.id] = { id:n.id, status:'waiting', items:[], inItems:0, t0:null, t1:null,
      ms:0, tokensIn:0, tokensOut:0, cost:0, retries:0, branch:null, runs:0, logs:[], lastIn:[] };
  });
  state.exec=ex; state.running=true; state.paused=false;
  log(ex,'info',null,'Pelaksanaan '+ex.id+' bermula — '+wf.nama+' ('+wf.nodes.length+' nod)');

  const targets = new Set(wf.edges.map(e=>e.to));
  const entries = wf.nodes.filter(n=>!targets.has(n.id));
  if(!entries.length){log(ex,'err',null,'Tiada nod pencetus');finishRun('error');return;}
  entries.forEach(n=>enqueue(n.id,false));
  syncRunUI(); pump();
}

function enqueue(id, viaLoop){
  const ex=state.exec; if(!ex) return;
  const n=nodeById(ex.wf,id); if(!n) return;
  const st=ex.nodes[id];
  if(st.status==='queued') return;
  st.status='queued'; st.note = viaLoop?'gelung':'';
  ex.queue.push(id);
  log(ex,'info',id,(viaLoop?'Gelung semula → ':'Dalam baris gilir → ')+n.name);
  syncCanvas();
}

function readyFor(n, ex){
  const wf=wfById(ex.wf);
  const ins=wf.edges.filter(e=>e.to===n.id);
  if(!ins.length) return true;
  return ins.every(e=>e.resolved);
}

function pump(){
  const ex=state.exec; if(!ex||ex.status!=='running') return;
  if(state.paused) return;
  while(ex.running<state.maxConc && ex.queue.length){
    const id=ex.queue.shift();
    runNode(id);
  }
  if(ex.running===0 && ex.retrying===0 && ex.queue.length===0 && !ex.pulses.length){
    finishRun(ex.err?'error':'success');
  }
  syncRunUI();
}

function runNode(id){
  const ex=state.exec; if(!ex) return;
  const n=nodeById(ex.wf,id), st=ex.nodes[id], M=metaOf(n);
  ex.running++; st.runs++; n.runs++;
  st.status='running'; st.t0=performance.now()-ex.t0; st.branch=null;
  ex.totals.nodes++;
  log(ex,'info',id,'Mula: '+n.name);

  const dur=nodeDur(n)/state.speed;
  setTimeout(()=>{
    if(!state.exec||state.exec!==ex) return;
    completeNode(id,n,st,M,dur);
  }, Math.max(30,dur));
  syncCanvas();
}

function completeNode(id,n,st,M,dur){
  const ex=state.exec;
  const p=perf(n.t);
  const inCount = st.inItems||1;

  let failed=false;
  if(p.err>0 && srand()<p.err){
    if(st.retries<M.maxRetries){
      st.retries++;
      st.status='retrying';
      const back=Math.round(240*Math.pow(2,st.retries-1)/state.speed);
      log(ex,'warn',id,'Cuba semula '+st.retries+'/'+M.maxRetries+' (backoff '+back+'ms)');
      ex.running--; ex.retrying++;
      setTimeout(()=>{
        if(!state.exec||state.exec!==ex) return;
        ex.retrying--; ex.running++;
        st.status='running';
        setTimeout(()=>completeNode(id,n,st,M,dur), Math.max(30,dur/state.speed));
        syncCanvas();
      }, Math.max(60,back));
      syncRunUI(); syncCanvas();
      return;
    }
    failed=true;
  }

  const items = failed?[]:makeItems(n,ex.wf,inCount);
  st.t1=performance.now()-ex.t0;
  st.ms=Math.round(st.t1-st.t0);
  st.items=items;

  let tok=0,cost=0;
  items.forEach(it=>{
    const j=it.json||{};
    if(j.promptToken) tok+=j.promptToken+(j.outputToken||0);
    if(typeof j.kos==='number') cost+=j.kos;
  });
  st.tokensIn=items.reduce((a,it)=>a+((it.json&&it.json.promptToken)||0),0);
  st.tokensOut=items.reduce((a,it)=>a+((it.json&&it.json.outputToken)||0),0);
  st.cost=cost;
  ex.totals.items+=items.length;
  ex.totals.tokens+=tok;
  ex.totals.cost+=cost;
  ex.spans.push({id,t0:st.t0,t1:st.t1,status:failed?'err':'ok'});

  st.activePorts = failed?null:decideBranch(n,items,M,st);

  if(failed){
    st.status='error';
    const msg=errMessage(n);
    log(ex,'err',id,'RALAT: '+msg);
    if(M.onError==='continueErrorOutput'){
      st.branch=M.errIdx; st.activePorts=[M.errIdx];
      log(ex,'warn',id,'Dihantar ke keluaran ralat');
      st.status='success';
      st.items=[{json:{_ralat:true,nod:n.id,mesaj:msg,pad:isoLocal(new Date())}}];
      ex.totals.items+=1;
    } else {
      ex.err={node:id,msg};
      ex.running--;
      stopAllFrom(id);
      syncRunUI(); syncCanvas(); renderPanel();
      finishRun('error');
      return;
    }
  } else {
    st.status='success';
    log(ex,'ok',id,'Selesai — '+items.length+' item · '+st.ms+'ms'+(cost>0?' · '+fmtMoney(cost):''));
  }
  n.lastRun=st.status;
  ex.running--; ex.order.push(id);
  propagate(id,n,st,M);
  syncRunUI(); syncCanvas(); renderPanel();
  pump();
}

function decideBranch(n,items,M,st){
  if(n.t==='ifNode'||n.t==='filter'){
    const rate=typeof n.p.passRate==='number'?n.p.passRate:0.72;
    const pass=srand()<rate;
    if(items[0]) items[0].json.hasil=pass;
    st.branch=pass?0:1;
    /* kedua-dua port dihantar supaya aliran tidak tersekat */
    return [0, 1];
  }
  if(n.t==='switchNode'){
    const r=srand();
    const idx=r<0.4?0:(r<0.78?1:2);
    st.branch=idx;
    /* ketiga-tiga port dihantar */
    return [0,1,2];
  }
  if(n.t==='approval'){
    const ok=items[0]&&items[0].json.keputusan==='lulus';
    st.branch=ok?0:1;
    /* kedua-dua port dihantar */
    return [0,1];
  }
  if(n.t==='loop'){
    /* gelung: output 0 = gelung semula, output 1 = selesai */
    const batch=Math.max(1,n.p.batchSize||1);
    const total = st.inItems||ri(6,40);
    const iter=clamp(Math.ceil(total/batch),1,4);
    return [0,1]; /* kedua-dua port */
  }
  return null;
}

function errMessage(n){
  const e = {
    http:'HTTP 502 dari '+ (n.p.url||'API'), stripe:'Kad ditolak', shopify:'SKU tidak sah',
    youtube:'Kuota YouTube habis', sap:'SAP IDOC gagal', twilio:'Nombor tidak sah',
    sendgrid:'Domain tidak disahkan', smtp:'SMTP TLS gagal',
    postgres:'Sambungan DB terputus', s3:'Bucket tidak ditemui', mqtt:'Topik tidak wujud',
    jira:'Projek dikunci', gmail:'OAuth tamat', hubspot:'PIPELINE diperlukan',
    notion:'Halaman dikongsi ditolak', sheets:'Kuota Sheets habis', slack:'Saluran diarkib',
  }[n.t];
  return e || 'Ralat tidak diketahui pada nod ' + n.id;
}

function stopAllFrom(id){
  const ex=state.exec; if(!ex) return;
  const wf=wfById(ex.wf);
  const blocked=new Set([id]);
  let added=true;
  while(added){
    added=false;
    wf.edges.forEach(e=>{
      if(blocked.has(e.from) && !blocked.has(e.to)){
        blocked.add(e.to); added=true;
      }
    });
  }
  blocked.forEach(bid=>{
    const s=ex.nodes[bid]; if(!s) return;
    if(s.status==='waiting'||s.status==='queued'){
      s.status='skipped'; s.note='disekat';
      log(ex,'warn',bid,'Disekat — aliran dihenti');
    }
  });
}

function propagate(id,n,st,M){
  const ex=state.exec; if(!ex) return;
  const wf=wfById(ex.wf);
  const out = wf.edges.filter(e=>e.from===id);
  if(!out.length) return;

  let active = st.activePorts;
  out.forEach(e=>{
    let on=false;
    if(active && active.length) on = active.indexOf(e.out)>=0;
    else if(M.errOut && e.out===M.errIdx && st.status==='success' && st.items[0]&&st.items[0].json._ralat) on=true;
    else on = e.out===0 && st.status==='success';

    if(st.status==='error' || st.status==='skipped') on=false;
    if(on) spawnPulse(id, e, 1, wf);
  });

  /* gelung: ulangi dengan stagger */
  if(n.t==='loop' && !n.disabled && st.status==='success'){
    const batch=Math.max(1,n.p.batchSize||1);
    const total=st.inItems||ri(6,40);
    const iter=clamp(Math.ceil(total/batch),1,4);
    const stagger=Math.max(120,240/state.speed);
    for(let k=1;k<iter;k++){
      setTimeout(()=>{
        if(!state.exec||state.exec!==ex) return;
        const lo=wf.edges.filter(x=>x.from===id && x.out===0);
        lo.forEach(e=>spawnPulse(id,e,1,wf));
      }, k*stagger);
    }
  }
}

function spawnPulse(fromId, edge, count, wf){
  const ex=state.exec; if(!ex) return;
  const fromNode=nodeById(ex.wf,fromId);
  const toNode=nodeById(ex.wf,edge.to);
  if(!fromNode||!toNode) return;
  ex.pulses.push({from:fromId,to:edge.to,edge,count,t0:performance.now()});
  /* animasi sampul surat terbang */
  flyDoc(fromNode, toNode, ex, ()=>{
    /* buang nadi dari senarai */
    ex.pulses = ex.pulses.filter(p => !(p.from === fromId && p.to === edge.to && p.edge === edge));
    edge.resolved=true;
    const st=ex.nodes[edge.to];
    if(st) st.inItems=(st.inItems||0)+count;
    handleArrival(edge.to);
  });
}

function handleArrival(toId){
  const ex=state.exec; if(!ex) return;
  const n=nodeById(ex.wf,toId); if(!n) return;
  const wf=wfById(ex.wf);
  const ins=wf.edges.filter(e=>e.to===toId);
  const allResolved = ins.every(e=>e.resolved);
  if(!allResolved) return;
  if(ex.nodes[toId].status==='queued' || ex.nodes[toId].status==='waiting'){
    enqueue(toId, n.t==='loop');
    pump(); /* penting: picu giliran selepas sampul tiba */
  }
}

function log(ex, level, nodeId, msg){
  ex.logs.push({t:performance.now()-ex.t0, level, nodeId, msg, ts:ts()});
  pushNodeLog(ex, level, nodeId, msg);
}

function pushNodeLog(ex, level, nodeId, msg){
  if(nodeId && ex.nodes[nodeId]) ex.nodes[nodeId].logs.push({level, msg, ts:ts()});
}

function finishRun(status){
  const ex=state.exec; if(!ex) return;
  ex.status=status; ex.endT=performance.now()-ex.t0;
  state.running=false; state.paused=false;
  log(ex,status==='success'?'ok':'err',null,
      status==='success'?
        'Pelaksanaan selesai — '+ex.totals.nodes+' nod · '+fmtDur(ex.endT)+' · '+fmtMoney(ex.totals.cost):
        'Pelaksanaan dihenti — '+(ex.err&&ex.err.msg||'ralat'));
  syncRunUI(); syncCanvas(); renderPanel();
}

/* ---------- penukar nod → bilik (berdasarkan kategori) ---------- */
function roomOfNode(node){
  const d=tdef(node.t);
  for(const rid in ROOMS){
    if(ROOMS[rid].cats.includes(d.cat)) return rid;
  }
  return 'logic';
}

/* ---------- peletakkan automatik nod dalam bilik (mengikut ruangan c) ---------- */
const ROOM_W=300, ROOM_H=240, ROOM_PAD=24;
const ROOM_LAYOUT = [
  {id:'lobby',    x:40,   y:80},
  {id:'data',     x:380,  y:80},
  {id:'lab',      x:720,  y:80},
  {id:'logic',    x:40,   y:380},
  {id:'platform', x:380,  y:380},
];

/* ---------- ruang legar (lobi / masa lapang) untuk pintu masuk + ikhtisar ---------- */
function nodeXY(n){
  const r = roomOfNode(n);
  const layout = ROOM_LAYOUT.find(l=>l.id===r);
  const wf = curWF();
  /* susun nod dalam bilik: kira baris/ruangan maks dalam bilik */
  const sameRoom = wf.nodes.filter(x=>roomOfNode(x)===r);
  const idx = sameRoom.findIndex(x=>x.id===n.id);
  const cols = 3;
  const col = idx % cols;
  const row = Math.floor(idx / cols);
  return {
    x: layout.x + ROOM_PAD + col * 88,
    y: layout.y + 50 + row * 86,
  };
}

/* ---------- terbang surat antara watak ---------- */
function flyDoc(fromN, toN, ex, cb){
  const stage = document.getElementById('stage');
  const a = nodeXY(fromN);
  const b = nodeXY(toN);
  const ax = a.x + 60 - state.view.ox;
  const ay = a.y + 40 - state.view.oy;
  const bx = b.x + 60 - state.view.ox;
  const by = b.y + 40 - state.view.oy;
  /* buang sebarang dokumen lama */
  const doc = document.createElement('div');
  doc.className = 'doc doc-ok';
  doc.style.left = ax + 'px';
  doc.style.top = ay + 'px';
  stage.appendChild(doc);
  const dur = Math.max(180, 380 / state.speed);
  const dx = bx - ax, dy = by - ay;
  const midX = ax + dx * 0.5;
  const midY = ay + dy * 0.5 - 40;
  const STEPS = 14;
  let i = 0;
  function step(){
    i++;
    const e = i / STEPS;
    const ease = e < 0.5 ? 2*e*e : -1+(4-2*e)*e;
    const x = (1-e)*(1-e)*ax + 2*(1-e)*e*midX + e*e*bx;
    const y = (1-e)*(1-e)*ay + 2*(1-e)*e*midY + e*e*by;
    doc.style.left = x + 'px';
    doc.style.top = y + 'px';
    if(i < STEPS){
      setTimeout(step, dur / STEPS);
    } else {
      doc.remove();
      if(cb) cb();
    }
  }
  setTimeout(step, dur / STEPS);
}

/* ---------- bina pejabat (bilik) ---------- */
function buildOffice(){
  const world = document.getElementById('world');
  world.innerHTML = '';
  const wf = curWF();

  /* setiap bilik */
  ROOM_LAYOUT.forEach(layout => {
    const r = ROOMS[layout.id];
    const roomNodes = wf.nodes.filter(n => roomOfNode(n) === layout.id);
    if(!roomNodes.length) return;
    const cols = 3;
    const rows = Math.ceil(roomNodes.length / cols);
    const w = ROOM_PAD * 2 + cols * 88 + 8;
    const h = 50 + rows * 86 + ROOM_PAD;

    const div = document.createElement('div');
    div.className = 'room';
    div.style.left = layout.x + 'px';
    div.style.top = layout.y + 'px';
    div.style.width = w + 'px';
    div.style.height = h + 'px';
    div.style.background = r.hex;
    div.style.borderColor = r.trim;
    div.setAttribute('data-label', r.nama);
    div.setAttribute('data-sub', r.cats[0].toUpperCase());
    div.title = r.desc;
    /* tingkap */
    const win = document.createElement('div');
    win.className = 'window-row';
    for(let i=0;i<5;i++){
      const wn = document.createElement('div');
      wn.className = 'window';
      win.appendChild(wn);
    }
    div.appendChild(win);
    /* deco lantai */
    const deco = document.createElement('div');
    deco.className = 'deco';
    div.appendChild(deco);
    world.appendChild(div);
  });

  /* setiap nod (watak + meja) */
  wf.nodes.forEach(n => {
    const p = nodeXY(n);
    const st = state.exec ? state.exec.nodes[n.id] : null;
    const status = st ? st.status : 'idle';
    const div = document.createElement('div');
    div.className = 'char-desk s-' + status;
    div.setAttribute('data-id', n.id);
    div.style.left = p.x + 'px';
    div.style.top = p.y + 'px';
    div.title = n.name + ' (' + tdef(n.t).label + ')';

    /* status badge */
    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.textContent = tdef(n.t).ico;
    div.appendChild(badge);

    /* char */
    const charDiv = document.createElement('div');
    charDiv.className = 'char-svg';
    charDiv.innerHTML = charSVG(n, status);
    div.appendChild(charDiv);

    /* desk */
    const deskDiv = document.createElement('div');
    deskDiv.className = 'desk-svg';
    deskDiv.innerHTML = deskSVG(n);
    div.appendChild(deskDiv);

    /* label nama */
    const lbl = document.createElement('div');
    lbl.className = 'label';
    lbl.textContent = n.name;
    div.appendChild(lbl);

    /* port in/out */
    const pi = document.createElement('div');
    pi.className = 'port in';
    div.appendChild(pi);
    const po = document.createElement('div');
    po.className = 'port out';
    div.appendChild(po);

    /* klik → NDV */
    div.addEventListener('click', e => {
      e.stopPropagation();
      openNDV(n.id);
    });

    world.appendChild(div);
  });

  /* sambungan antara nod (laluan pejabat) */
  wf.edges.forEach(e => {
    const fromN = wf.nodes.find(x=>x.id===e.from);
    const toN = wf.nodes.find(x=>x.id===e.to);
    if(!fromN || !toN) return;
    if(roomOfNode(fromN) === roomOfNode(toN)) return; /* intra-bilik: tidak lukis走廊 */
    const a = nodeXY(fromN);
    const b = nodeXY(toN);
    const ax = a.x + 100, ay = a.y + 60;
    const bx = b.x + 20, by = b.y + 60;
    const len = Math.sqrt((bx-ax)*(bx-ax)+(by-ay)*(by-ay));
    const angle = Math.atan2(by-ay, bx-ax) * 180 / Math.PI;
    const corridor = document.createElement('div');
    corridor.className = 'corridor';
    corridor.style.left = ax + 'px';
    corridor.style.top = ay + 'px';
    corridor.style.width = len + 'px';
    corridor.style.height = '8px';
    corridor.style.background = 'repeating-linear-gradient(90deg,#94a3b8 0 6px,transparent 6px 12px)';
    corridor.style.transformOrigin = '0 50%';
    corridor.style.transform = `rotate(${angle}deg)`;
    corridor.style.opacity = '0.55';
    world.appendChild(corridor);
  });

  /* stickies */
  (wf.stickies||[]).forEach((s,i) => {
    const stick = document.createElement('div');
    stick.className = 'sticky ' + (s.color||'gold');
    stick.style.left = (40 + i * 700) + 'px';
    stick.style.top = '30px';
    stick.style.maxWidth = '200px';
    stick.textContent = s.text.replace(/\n/g,'\n');
    world.appendChild(stick);
  });
}

/* ---------- kemas kini status nod (dipanggil selepas enjin) ---------- */
function syncCanvas(){
  const wf = curWF();
  if(!wf) return;
  /* update status char */
  wf.nodes.forEach(n => {
    const el = document.querySelector('.char-desk[data-id="' + n.id + '"]');
    if(!el) return;
    el.className = 'char-desk';
    const st = state.exec ? state.exec.nodes[n.id] : null;
    const status = st ? st.status : 'idle';
    el.classList.add('s-' + status);
    /* tukar status visual pada SVG */
    const svg = el.querySelector('.char-svg');
    if(svg && status !== 'idle') {
      const node = wf.nodes.find(x=>x.id===n.id);
      svg.innerHTML = charSVG(node, status);
    }
  });
  /* update counts */
  if(state.exec){
    document.getElementById('stNodes').textContent = state.exec.totals.nodes;
    document.getElementById('stItems').textContent = state.exec.totals.items;
    document.getElementById('stTokens').textContent = fmtNum(state.exec.totals.tokens);
    document.getElementById('stCost').textContent = fmtMoney(state.exec.totals.cost);
    const ms = state.exec.endT ? state.exec.endT : (performance.now() - state.exec.t0);
    document.getElementById('stTime').textContent = fmtDur(ms);
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    if(state.running){
      dot.className='dot run'; txt.textContent='Berjalan...';
    } else if(state.exec.status==='success'){
      dot.className='dot ok'; txt.textContent='Selesai';
    } else if(state.exec.status==='error'){
      dot.className='dot err'; txt.textContent='Ralat';
    } else {
      dot.className='dot'; txt.textContent='Sedia';
    }
  } else {
    document.getElementById('stNodes').textContent = '0';
    document.getElementById('stItems').textContent = '0';
    document.getElementById('stTokens').textContent = '0';
    document.getElementById('stCost').textContent = '$0.0000';
    document.getElementById('stTime').textContent = '0ms';
  }
}

      it.innerHTML = '<span class="ic">'+def[1]+'</span>'+esc(def[2]);
      it.title = def[3];
      it.style.borderLeftColor = meta.hex;
      it.style.borderLeftWidth = '3px';
      rail.appendChild(it);
    });
  }
}

/* ---------- panel kanan ---------- */
function renderPanel(){
  const body = document.getElementById('rrBody');
  if(state.tab === 'nod'){
    const wf = curWF();
    if(!wf){ body.innerHTML=''; return; }
    let h = '<h4>'+esc(wf.nama)+' · '+wf.nodes.length+' watak · '+wf.edges.length+' sambungan</h4>';
    h += '<div class="card"><div class="k">Tag</div><div class="v">'+esc(wf.tag)+'</div></div>';
    h += '<div class="card"><div class="k">Penerangan</div><div class="v" style="font-weight:400">'+esc(wf.desc)+'</div></div>';
    const counts = {};
    wf.nodes.forEach(n => { const c = tdef(n.t).cat; counts[c] = (counts[c]||0)+1; });
    h += '<h4>Agihan Mengikut Kategori</h4>';
    for(const c in counts){
      const meta = CAT[c];
      h += '<div class="card" style="border-left:3px solid '+meta.hex+'"><div class="k">'+meta.ico+' '+meta.n+'</div><div class="v">'+counts[c]+' nod</div></div>';
    }
    body.innerHTML = h;
  } else if(state.tab === 'pelaksanaan'){
    if(!state.exec){ body.innerHTML='<div style="color:var(--ink-mute);padding:20px;text-align:center">Tiada pelaksanaan. Klik ▶ Jalankan.</div>'; return; }
    const ex = state.exec;
    let h = '<h4>Pelaksanaan '+ex.id+' · '+esc(ex.wfNama)+'</h4>';
    h += '<div class="card"><div class="k">Status</div><div class="v">'+(ex.status==='running'?'⏳ Berjalan':(ex.status==='success'?'✓ Selesai':'✗ Ralat'))+'</div></div>';
    h += '<div class="card"><div class="k">Nod Selesai</div><div class="v">'+ex.totals.nodes+' / '+curWF().nodes.length+'</div></div>';
    h += '<div class="card"><div class="k">Item Diproses</div><div class="v">'+fmtNum(ex.totals.items)+'</div></div>';
    h += '<div class="card"><div class="k">Token</div><div class="v">'+fmtNum(ex.totals.tokens)+'</div></div>';
    h += '<div class="card"><div class="k">Kos</div><div class="v">'+fmtMoney(ex.totals.cost)+'</div></div>';
    h += '<div class="card"><div class="k">Masa</div><div class="v">'+fmtDur(ex.endT||(performance.now()-ex.t0))+'</div></div>';
    if(ex.err){ h += '<div class="card" style="border-left:3px solid var(--err)"><div class="k">Ralat</div><div class="v" style="color:var(--err)">'+esc(ex.err.msg)+'</div></div>'; }
    h += '<h4>Log Aktiviti</h4>';
    ex.logs.slice(-30).reverse().forEach(l => {
      const c = l.level==='err'?'var(--err)':(l.level==='warn'?'var(--warn)':(l.level==='ok'?'var(--ok)':'var(--ink-soft)'));
      h += '<div class="card" style="padding:4px 8px;border-left:2px solid '+c+'"><span style="font-family:monospace;font-size:10px;color:var(--ink-mute)">'+esc(l.ts)+'</span> '+(l.nodeId?'['+esc(l.nodeId)+'] ':'')+esc(l.msg)+'</div>';
    });
    body.innerHTML = h;
  } else if(state.tab === 'garismasa'){
    const wf = curWF();
    const ex = state.exec;
    const max = ex ? Math.max(1, ex.endT||(performance.now()-ex.t0)) : 1;
    let h = '<h4>Garis Masa Pelaksanaan</h4>';
    h += '<div style="position:relative;height:'+(wf.nodes.length*16+20)+'px;background:#f8fafc;border-radius:8px;padding:6px;margin-bottom:10px;border:1px solid #e2e8f0">';
    if(ex){
      ex.spans.forEach(sp => {
        const idx = wf.nodes.findIndex(n=>n.id===sp.id);
        const left = (sp.t0/max)*100;
        const w = Math.max(0.5, ((sp.t1-sp.t0)/max)*100);
        const c = sp.status==='err'?'var(--err)':'var(--ok)';
        h += '<div title="'+esc(wf.nodes[idx].name)+' '+fmtDur(sp.t1-sp.t0)+'" style="position:absolute;left:'+left+'%;top:'+(idx*16+4)+'px;width:'+w+'%;height:14px;background:'+c+';border-radius:2px;font-size:9px;color:#fff;overflow:hidden;padding:0 3px;line-height:14px">'+esc(wf.nodes[idx].name.slice(0,12))+'</div>';
      });
    }
    h += '</div>';
    h += '<div style="font-size:11px;color:var(--ink-mute)">'+wf.nodes.length+' nod · '+(ex?ex.spans.length:0)+' selesai</div>';
    body.innerHTML = h;
  } else if(state.tab === 'stat'){
    const wf = curWF();
    let h = '<h4>Statistik Aliran</h4>';
    h += '<div class="card"><div class="k">Jumlah Nod</div><div class="v">'+wf.nodes.length+'</div></div>';
    h += '<div class="card"><div class="k">Jumlah Sambungan</div><div class="v">'+wf.edges.length+'</div></div>';
    const loops = wf.edges.filter(e=>e.loop).length;
    h += '<div class="card"><div class="k">Gelung</div><div class="v">'+loops+'</div></div>';
    const branches = wf.nodes.filter(n=>tdef(n.t).out>1).length;
    h += '<div class="card"><div class="k">Nod Bercabang</div><div class="v">'+branches+'</div></div>';
    const ex = state.exec;
    if(ex){
      h += '<div class="card"><div class="k">Status</div><div class="v">'+ex.status+'</div></div>';
      h += '<div class="card"><div class="k">Kejayaan</div><div class="v">'+Math.round(100*ex.spans.filter(s=>s.status==='ok').length/Math.max(1,ex.spans.length))+'%</div></div>';
    }
    body.innerHTML = h;
  }
}

function syncRunUI(){
  const btn = document.getElementById('runBtn');
  if(state.running){ btn.textContent='⏳ Berjalan'; btn.className='btn warn'; btn.disabled=true; }
  else { btn.textContent='▶ Jalankan'; btn.className='btn ok'; btn.disabled=false; }
}

/* ---------- NDV (butiran nod) ---------- */
function openNDV(id){
  const wf = curWF();
  const n = wf.nodes.find(x=>x.id===id);
  if(!n) return;
  const d = tdef(n.t);
  state.ndv = id;
  state.ndvTab = 'parameter';
  document.getElementById('ndvCh').textContent = d.ico;
  document.getElementById('ndvTi').textContent = n.name;
  document.getElementById('ndvSub').textContent = d.label + ' · ' + CAT[d.cat].n;
  document.getElementById('ndvId').textContent = wf.id + ' / ' + n.id;
  document.getElementById('ndv').classList.add('open');
  document.querySelectorAll('#ndv .nav .t').forEach(t => t.classList.toggle('act', t.dataset.ntab==='parameter'));
  renderNDV();
}

function renderNDV(){
  if(!state.ndv) return;
  const wf = curWF();
  const n = wf.nodes.find(x=>x.id===state.ndv);
  if(!n) return;
  const ex = state.exec;
  const st = ex ? ex.nodes[n.id] : null;
  const bd = document.getElementById('ndvBd');
  if(state.ndvTab === 'parameter'){
    const d = tdef(n.t);
    let h = '<div class="kv"><div class="k">Jenis</div><div class="v">'+d.ico+' '+esc(d.label)+'</div></div>';
    h += '<div class="kv"><div class="k">Kategori</div><div class="v" style="color:'+d.color+'">'+CAT[d.cat].ico+' '+CAT[d.cat].n+'</div></div>';
    h += '<div class="kv"><div class="k">Penerangan</div><div class="v">'+esc(d.desc)+'</div></div>';
    h += '<div class="kv"><div class="k">Output</div><div class="v">'+d.out+' port ('+d.ol.join(', ')+')</div></div>';
    h += '<div class="kv"><div class="k">Bilik</div><div class="v">'+esc(ROOMS[roomOfNode(n)].nama)+'</div></div>';
    h += '<div class="kv"><div class="k">Ruangan</div><div class="v">C'+n.c+' · R'+n.r+'</div></div>';
    h += '<h4 style="margin-top:10px">Parameter</h4>';
    const ps = n.p || {};
    for(const k in ps){
      h += '<div class="kv"><div class="k">'+esc(k)+'</div><div class="v" style="font-family:monospace;font-size:12px">'+esc(JSON.stringify(ps[k]))+'</div></div>';
    }
    if(!Object.keys(ps).length) h += '<div style="color:var(--ink-mute);font-size:12px">Tiada parameter ditetapkan.</div>';
    bd.innerHTML = h;
  } else if(state.ndvTab === 'input'){
    bd.innerHTML = '<div class="jsonh">'+jsonHtml(st?(st.lastIn||[]):[])+'</div>';
  } else if(state.ndvTab === 'output'){
    bd.innerHTML = '<div class="jsonh">'+jsonHtml(st?(st.items||[]):[])+'</div>';
  } else if(state.ndvTab === 'log'){
    if(!st || !st.logs.length){ bd.innerHTML = '<div style="color:var(--ink-mute);padding:20px;text-align:center">Belum ada log.</div>'; return; }
    let h = '';
    st.logs.slice().reverse().forEach(l => {
      const c = l.level==='err'?'var(--err)':(l.level==='warn'?'var(--warn)':'var(--ok)');
      h += '<div class="kv"><div class="k" style="color:'+c+'">'+esc(l.ts)+'</div><div class="v">'+esc(l.msg)+'</div></div>';
    });
    bd.innerHTML = h;
  }
}

function closeNDV(){ state.ndv=null; document.getElementById('ndv').classList.remove('open'); }

/* ---------- toast ---------- */
function toast(msg, kind){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (kind||'');
  clearTimeout(toast._tm);
  toast._tm = setTimeout(() => { t.className = ''; }, 2400);
}

/* ---------- panel tab + NDV tab ---------- */
function bindUI(){
  /* tab kanan */
  document.querySelectorAll('#rrTabs .t').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('#rrTabs .t').forEach(x=>x.classList.remove('act'));
      t.classList.add('act');
      state.tab = t.dataset.tab;
      renderPanel();
    });
  });
  /* NDV tabs */
  document.querySelectorAll('#ndv .nav .t').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('#ndv .nav .t').forEach(x=>x.classList.remove('act'));
      t.classList.add('act');
      state.ndvTab = t.dataset.ntab;
      renderNDV();
    });
  });
  document.getElementById('ndvX').onclick = closeNDV;
  document.getElementById('ndvClose2').onclick = closeNDV;
  /* speed selector */
  document.getElementById('speedSel').onchange = e => { state.speed = parseInt(e.target.value); };
  /* run button */
  document.getElementById('runBtn').onclick = () => { if(!state.running) startRun(); };
  document.getElementById('resetBtn').onclick = () => { resetRun(); toast('Reset','ok'); };

  /* panorama stage — drag untuk panoramik */
  const stage = document.getElementById('stage');
  stage.addEventListener('mousedown', e => {
    if(e.target.closest('.char-desk')) return;
    state.pan = { sx:e.clientX, sy:e.clientY, ox:state.view.ox, oy:state.view.oy };
    stage.classList.add('pan');
  });
  window.addEventListener('mousemove', e => {
    if(!state.pan) return;
    state.view.ox = state.pan.ox - (e.clientX - state.pan.sx);
    state.view.oy = state.pan.oy - (e.clientY - state.pan.sy);
    document.getElementById('world').style.transform = 'translate(' + state.view.ox + 'px,' + state.view.oy + 'px)';
  });
  window.addEventListener('mouseup', () => { state.pan=null; stage.classList.remove('pan'); });

  /* ESC tutup NDV */
  window.addEventListener('keydown', e => { if(e.key==='Escape') closeNDV(); });
}

/* ---------- awan di langit ---------- */
function buildClouds(){
  const c = document.getElementById('clouds');
  c.innerHTML='';
  for(let i=0;i<8;i++){
    const cl = document.createElement('div');
    cl.className='cloud';
    cl.style.left = (i*120 + Math.random()*40) + 'px';
    cl.style.top = (Math.random()*14) + 'px';
    cl.style.opacity = (0.6 + Math.random()*0.35);
    c.appendChild(cl);
  }
}

/* =====================================================================
   PART H — Boot
   ===================================================================== */
function boot(){
  buildClouds();
  buildPalette();
  buildRoomSelector();
  bindUI();
  buildOffice();
  renderPanel();
  syncCanvas();
  toast('Selamat datang ke NEXUS Office — '+WORKFLOWS.length+' aliran · '+
    WORKFLOWS.reduce((a,w)=>a+w.nodes.length,0)+' nod miniworld','ok');
}

window.NEXUS = {
  run: () => { if(!state.running) startRun(); },
  reset: () => resetRun(),
  setWF: id => {
    if(WORKFLOWS.find(w=>w.id===id)){
      state.cur = id; state.exec=null; state.running=false;
      GEN_STEP=0; document.querySelectorAll('.doc').forEach(d=>d.remove());
      document.getElementById('crumbWF').textContent = WORKFLOWS.find(w=>w.id===id).nama;
      buildRoomSelector(); buildOffice(); renderPanel(); syncCanvas();
    }
  },
  fastMode: () => { state.speed = 3; state.maxConc = 8; document.getElementById('speedSel').value='3'; },
  state: () => state,
  workflows: () => WORKFLOWS,
  meta: () => { return { workflows: WORKFLOWS.length, nodes: WORKFLOWS.reduce((a,w)=>a+w.nodes.length,0), edges: WORKFLOWS.reduce((a,w)=>a+w.edges.length,0), rooms: Object.keys(ROOMS).length }; },
};

document.addEventListener('DOMContentLoaded', boot);
</script>
