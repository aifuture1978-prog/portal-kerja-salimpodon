/**
 * ModelRouter — browser port of apps/api/app/models/router.py.
 *
 * Same algorithm, same semantics:
 *   buildCandidates -> capability filter -> free-first sort -> cooldown drop
 *   -> budget check -> cache -> execute with fallback -> circuit break on 429/402
 *
 * Because this runs in the browser it is also the thing you can *watch*: every
 * rung it tries is surfaced in the UI, including the ones it skipped and why.
 */
        
                                                  
                      

       class BudgetExceeded extends Error {}
       class NoCandidate extends Error {}

/** Mirrors the FastAPI settings defaults. */
       const ROUTER_CONFIG = {
  preferFree: true,
  maxFallbacks: 3,
  circuitBreakerTtl: 60,      // seconds a rate-limited model sits out
  requestTimeout: 120,
  defaultTokenBudget: 32000,
  contextSummaryThreshold: 24000,
};

       class ModelRouter {
  /**
   * @param {{chat:(spec:object, req:object)=>Promise<object>}} transport
   * @param {{get:Function,set:Function}|null} cache
   */
  constructor(transport, cache = null, config = {}) {
    this.transport = transport;
    this.cache = cache;
    this.cfg = { ...ROUTER_CONFIG, ...config };
    /** @type {Map<string, number>} slug -> unix ms until which we skip it */
    this.cooldowns = new Map();
    /** Full trace of the most recent run, for the UI. */
    this.lastTrace = null;
  }

  // ------------------------------------------------------------ cooldowns
  markRateLimited(slug, ttlSeconds) {
    const ttl = ttlSeconds ?? this.cfg.circuitBreakerTtl;
    this.cooldowns.set(slug, Date.now() + ttl * 1000);
    return ttl;
  }

  clearCooldown(slug) {
    if (slug) this.cooldowns.delete(slug);
    else this.cooldowns.clear();
  }

  cooldownRemaining(slug) {
    const until = this.cooldowns.get(slug);
    if (!until) return 0;
    const left = Math.ceil((until - Date.now()) / 1000);
    if (left <= 0) { this.cooldowns.delete(slug); return 0; }
    return left;
  }

  // ------------------------------------------------------------ selection
  /** @returns {string[]} the ordered ladder the router will walk */
  buildCandidates(req = {}) {
    const {
      task = 'chat', requireTools = false, requireVision = false,
      minContext = 0, allowPremium = true, overrideModels = null,
      preferFree = null,
    } = req;

    const slugs = overrideModels?.length
      ? [...overrideModels]
      : [...(TASK_POLICY[task] ?? TASK_POLICY.chat)];

    let specs = slugs.map((s) => CATALOG[s]).filter(Boolean);

    // capability filter
    specs = specs.filter((m) => {
      if (requireTools && !m.supports_tools) return false;
      if (requireVision && !m.supports_vision) return false;
      if (minContext && m.context_window < minContext) return false;
      if (!allowPremium && m.tier === Tier.PREMIUM) return false;
      return true;
    });

    // stable sort: free first, then by blended cost
    const freeFirst = preferFree === null ? this.cfg.preferFree : preferFree;
    specs.sort((a, b) =>
      freeFirst
        ? (isFree(a) ? 0 : 1) - (isFree(b) ? 0 : 1) || blendedCost(a) - blendedCost(b)
        : blendedCost(a) - blendedCost(b),
    );

    // drop cooling-down models, but keep them as a tail so we never return empty
    const live = specs.filter((m) => this.cooldownRemaining(m.slug) === 0);
    const cooled = specs.filter((m) => this.cooldownRemaining(m.slug) > 0);

    return [...live, ...cooled].slice(0, 1 + this.cfg.maxFallbacks).map((m) => m.slug);
  }

  /** Decide without executing — what `POST /models/route-preview` returns. */
  decide(req = {}) {
    const candidates = this.buildCandidates(req);
    if (!candidates.length) throw new NoCandidate(`no model satisfies task=${req.task ?? 'chat'}`);
    const spec = CATALOG[candidates[0]];
    return {
      model: spec,
      tier: spec.tier,
      candidates,
      reason: `task=${req.task ?? 'chat'} prefer_free=${req.preferFree ?? this.cfg.preferFree} ladder=${candidates.join(' > ')}`,
    };
  }

  // ------------------------------------------------------------ budget
  estimatePromptTokens(messages = []) {
    // ~4 chars/token for mixed CN/EN, deliberately conservative
    return messages.reduce((n, m) => n + Math.floor((m.content?.length ?? 0) / 4) + 4, 0);
  }

  checkBudget(req, spec) {
    const budget = req.tokenBudget ?? this.cfg.defaultTokenBudget;
    const estimated = this.estimatePromptTokens(req.messages ?? []) + (req.maxTokens ?? 4096);
    if (estimated > budget) {
      throw new BudgetExceeded(`estimated ${estimated} tokens exceeds budget ${budget}`);
    }
    if (spec.context_window && estimated > spec.context_window) {
      throw new BudgetExceeded(`prompt does not fit ${spec.slug} context window`);
    }
    return estimated;
  }

  // ------------------------------------------------------------ cache key
  cacheKey(req, slug) {
    const parts = [slug, String(req.temperature ?? 0.3), String(req.maxTokens ?? 4096)];
    for (const m of req.messages ?? []) parts.push(`${m.role}:${m.content}`);
    // djb2 — good enough for a client-side demo cache
    let h = 5381;
    const s = parts.join('\u0000');
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return `aos:llm:${h.toString(16)}`;
  }

  // ------------------------------------------------------------ execute
  /**
   * Walk the ladder until something succeeds.
   * @returns {Promise<object>} completion + the full attempt trace
   */
  async run(req = {}) {
    const started = performance.now();
    const decision = this.decide(req);
    const attempts = [];
    let lastError = null;

    for (const slug of decision.candidates) {
      const spec = CATALOG[slug];
      const attempt = {
        model: slug,
        vendor: spec.vendor,
        tier: spec.tier,
        status: 'pending',
        note: '',
        latencyMs: 0,
      };
      attempts.push(attempt);

      try {
        this.checkBudget(req, spec);
      } catch (err) {
        attempt.status = 'skipped';
        attempt.note = err.message;
        continue;
      }

      const key = this.cacheKey(req, slug);
      if (this.cache) {
        const hit = this.cache.get(key);
        if (hit) {
          attempt.status = 'cache_hit';
          attempt.note = 'served from Redis-equivalent cache';
          const completion = {
            ...hit, modelSlug: slug, tier: spec.tier, cacheHit: true,
            attempts: [...attempts], totalMs: Math.round(performance.now() - started),
          };
          this.lastTrace = { decision, attempts, completion };
          return completion;
        }
      }

      const t0 = performance.now();
      try {
        const payload = await this.transport.chat(spec, req);
        const latencyMs = Math.round(performance.now() - t0);
        attempt.status = 'ok';
        attempt.latencyMs = latencyMs;

        const usage = payload.usage ?? {};
        const promptTokens = usage.prompt_tokens ?? this.estimatePromptTokens(req.messages);
        const completionTokens = usage.completion_tokens ?? 0;
        const cost = promptTokens / 1e6 * spec.input_price + completionTokens / 1e6 * spec.output_price;

        const completion = {
          text: payload.text ?? '',
          modelSlug: slug,
          modelName: spec.display_name,
          tier: spec.tier,
          promptTokens,
          completionTokens,
          costUsd: cost,
          latencyMs,
          cacheHit: false,
          finishReason: payload.finishReason ?? 'stop',
          simulated: !!payload.simulated,
          attempts: [...attempts],
          totalMs: Math.round(performance.now() - started),
        };

        if (this.cache && completionTokens > 0) {
          this.cache.set(key, { ...completion, attempts: undefined, totalMs: undefined }, 600);
        }
        this.lastTrace = { decision, attempts, completion };
        return completion;
      } catch (err) {
        attempt.status = 'failed';
        attempt.latencyMs = Math.round(performance.now() - t0);
        attempt.note = `${err.name}: ${err.message}`;
        lastError = err;
        if (err.rateLimited) {
          const ttl = this.markRateLimited(slug);
          attempt.note += ` → cooling down ${ttl}s`;
        }
      }
    }

    this.lastTrace = { decision, attempts, completion: null };
    throw new NoCandidate(`all ${attempts.length} candidates failed: ${lastError?.message ?? 'unknown'}`);
  }

  /** Snapshot for the ops panel. */
  health() {
    return {
      preferFree: this.cfg.preferFree,
      maxFallbacks: this.cfg.maxFallbacks,
      catalogSize: Object.keys(CATALOG).length,
      cooldowns: Object.fromEntries(
        [...this.cooldowns.keys()]
          .map((s) => [s, this.cooldownRemaining(s)])
          .filter(([, v]) => v > 0),
      ),
    };
  }
}

/** Tiny in-memory cache with TTL, standing in for Redis. */
       class MemoryCache {
  constructor() { this.map = new Map(); this.hits = 0; this.misses = 0; }
  get(k) {
    const e = this.map.get(k);
    if (!e) { this.misses++; return null; }
    if (e.exp < Date.now()) { this.map.delete(k); this.misses++; return null; }
    this.hits++;
    return e.v;
  }
  set(k, v, ttlSeconds = 600) {
    this.map.set(k, { v, exp: Date.now() + ttlSeconds * 1000 });
  }
  get size() { return this.map.size; }
  clear() { this.map.clear(); this.hits = 0; this.misses = 0; }
}

/** Read `Label: value` out of a multi-line prompt. */
       function fieldOf(prompt, label, fallback = '') {
  const re = new RegExp(`^\\s*${label}\\s*:\\s*(.+)$`, 'im');
  const m = re.exec(prompt ?? '');
  return (m?.[1] ?? fallback).trim();
}

const lines = (s) => String(s ?? '').split('\n').map((x) => x.trim()).filter(Boolean);

/** Split "SP 5.1.1 — Mengenal pasti…" into {kod, pernyataan}. */
function splitStandard(raw, fallbackPrefix, i) {
  const t = String(raw ?? '').trim();
  const m = /^([A-Za-z]*\s*\d+(?:\.\d+)*)\s*[—:–-]\s*(.+)$/.exec(t);
  if (m) return { kod: m[1].replace(/\s+/g, ' ').trim(), pernyataan: m[2].trim() };
  return { kod: `${fallbackPrefix} ${i + 1}`, pernyataan: t };
}

/* ===== transport.js ============================================== */
/**
 * Transport layer.
 *
 * Two modes behind one interface:
 *   REAL      — genuine OpenRouter chat completions, using the key you paste in.
 *   SIMULATE  — deterministic-ish content generator with realistic free-tier
 *               rate limiting (429), so the fallback ladder is actually visible.
 *
 * The simulator is not a stub that returns "lorem ipsum": it produces the same
 * JSON contracts the FastAPI agents enforce, so every renderer in the UI
 * (quiz player, game frame, workflow canvas, code editor) gets real input.
 */

                                              

const OPENROUTER_URL = 'https://openrouter.ai/api/v1/chat/completions';

       class RateLimited extends Error {
  constructor(msg) { super(msg); this.name = 'RateLimited'; this.rateLimited = true; }
}
       class ProviderError extends Error {
  constructor(msg) { super(msg); this.name = 'ProviderError'; }
}

/* ========================================================================== */
/*  REAL MODE                                                                 */
/* ========================================================================== */

       function createRealTransport(apiKey, { siteUrl = location.origin, title = 'AgenticOS Malaysia' } = {}) {
  return {
    mode: 'real',
    async chat(spec, req) {
      const body = {
        model: spec.slug,
        messages: (req.messages ?? []).map((m) => ({ role: m.role, content: m.content })),
        temperature: req.temperature ?? 0.3,
        max_tokens: Math.min(req.maxTokens ?? 4096, 8192),
        stream: false,
      };

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 120000);
      let res;
      try {
        res = await fetch(OPENROUTER_URL, {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${apiKey}`,
            'Content-Type': 'application/json',
            'HTTP-Referer': siteUrl,
            'X-Title': title,
          },
          body: JSON.stringify(body),
          signal: controller.signal,
        });
      } catch (err) {
        clearTimeout(timer);
        throw new ProviderError(err.name === 'AbortError' ? 'request timed out after 120s' : String(err.message));
      } finally {
        clearTimeout(timer);
      }

      if (res.status === 429) throw new RateLimited('429 too many requests — free endpoint rate limit');
      if (res.status === 402) throw new RateLimited('402 insufficient credits on this key');
      if (!res.ok) {
        let detail = '';
        try { detail = (await res.json())?.error?.message ?? ''; } catch { detail = await res.text(); }
        throw new ProviderError(`HTTP ${res.status}: ${String(detail).slice(0, 300)}`);
      }

      const data = await res.json();
      const choice = data.choices?.[0] ?? {};
      const content = choice.message?.content;
      const text = Array.isArray(content)
        ? content.map((p) => p.text ?? '').join('')
        : (content ?? '');

      return {
        text,
        usage: data.usage ?? {},
        finishReason: choice.finish_reason,
        simulated: false,
      };
    },
  };
}

/* ========================================================================== */
/*  SIMULATE MODE                                                             */
/* ========================================================================== */

/** Free endpoints really do rate-limit — this is the behaviour worth showing. */
const FREE_FAIL_RATE = 0.34;

/** Rough latency by tier, so the UI does not feel uniform. */
function latencyFor(spec) {
  const base = spec.tier === 'premium' ? 900 : spec.tier === 'free' ? 420 : 650;
  const jitter = 0.6 + Math.random() * 0.9;
  const contextPenalty = Math.min(600, spec.context_window / 2000);
  return Math.round(base * jitter + contextPenalty * 0.25);
}

       function createSimulatedTransport() {
  return {
    mode: 'simulated',
    async chat(spec, req) {
      await sleep(latencyFor(spec));

      if (spec.tier === 'free' && Math.random() < FREE_FAIL_RATE) {
        throw new RateLimited('429 rate limit exceeded on free endpoint');
      }

      const lastUser = [...(req.messages ?? [])].reverse().find((m) => m.role === 'user');
      const prompt = lastUser?.content ?? '';
      const system = (req.messages ?? []).find((m) => m.role === 'system')?.content ?? '';
      const text = generate(spec, prompt, system, req);

      // Token counts roughly proportional to real lengths
      const promptTokens = (req.messages ?? []).reduce((n, m) => n + Math.ceil((m.content?.length ?? 0) / 4) + 4, 0);
      const completionTokens = Math.ceil(text.length / 4);

      return {
        text,
        usage: { prompt_tokens: promptTokens, completion_tokens: completionTokens },
        finishReason: 'stop',
        simulated: true,
      };
    },
  };
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/** Pull a human topic out of "Topic: X\nLevel: Y" style prompts. */
function topicOf(prompt, fallback = 'the requested topic') {
  const m = /(?:topic|subject|question|goal|brief|concept|screen|root topic)\s*:\s*(.+)/i.exec(prompt);
  const raw = (m?.[1] ?? prompt).split('\n')[0].trim();
  return raw.replace(/^["'`]|["'`]$/g, '').slice(0, 90) || fallback;
}

function titleCase(s) {
  return s.replace(/\w\S*/g, (t) => t[0].toUpperCase() + t.slice(1).toLowerCase());

import time
from typing import Protocol


class Store(Protocol):
    async def incr(self, key: str, ttl: int) -> int: ...


class RateLimiter:
    """Per-identity fixed-window limiter.

    A fixed window is deliberate: it costs one Redis round-trip instead of

import (
	"context"
	"sync"
	"time"
)

// Limiter is a fixed-window rate limiter safe for concurrent use.
type Limiter struct {
	mu     sync.Mutex
	counts map[string]int
	limit  int
	window time.Duration
}

func New(limit int, window time.Duration) *Limiter {
	return &Limiter{counts: make(map[string]int), limit: limit, window: window}
}

// Allow reports whether identity may proceed in the current window.
func (l *Limiter) Allow(ctx context.Context, identity string) (bool, int) {
	if err := ctx.Err(); err != nil {
		return false, 0
	}
	key := identity + ":" + time.Now().Truncate(l.window).Format(time.RFC3339)

	l.mu.Lock()
	defer l.mu.Unlock()
	l.counts[key]++
	n := l.counts[key]

	if n == 1 {
		// Reap exactly once per bucket rather than sweeping on every call.
		go func() {
			time.Sleep(l.window + time.Second)
			l.mu.Lock()
			delete(l.counts, key)
			l.mu.Unlock()
		}()
	}
	return n <= l.limit, max(0, l.limit-n)
}

func max(a, b int) int {
	if a > b {
		return a
	}
	return b
}

 * Fixed-window rate limiter.
 * One round-trip per check — see the note in the PR for why not sliding-window.
 */
export interface LimiterStore {
  incr(key: string, ttlSeconds: number): Promise<number>;
}

export interface RateLimitResult {
  allowed: boolean;
  remaining: number;
  retryAfter: number;
}

export class RateLimiter {
  constructor(
    private readonly store: LimiterStore,
    private readonly limit = 120,
    private readonly windowSeconds = 60,
  ) {}

  async check(identity: string): Promise<RateLimitResult> {
    const bucket = \`rl:\${identity}:\${Math.floor(Date.now() / 1000 / this.windowSeconds)}\`;
    const count = await this.store.incr(bucket, this.windowSeconds + 1);
    const allowed = count <= this.limit;
    return {
      allowed,
      remaining: Math.max(0, this.limit - count),
      retryAfter: allowed ? 0 : this.windowSeconds,
    };
  }
}

  return `<!doctype html>

    box-shadow:0 6px 20px -8px rgba(214,178,116,.6)}
  button:hover{filter:brightness(1.06)}
  .score{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0 2px}
</style></head>
<body>
<div id="hud">
  <span class="pill">${safeTopic}</span>
  <span id="q">…</span>
  <span>Score <b id="score">0</b></span>
  <span>Lives <b id="lives">3</b></span>
  <span>Streak <b id="streak">0</b></span>
</div>
<canvas id="c"></canvas>
<div id="over"><div class="panel">
  <h1 id="overTitle">Ready?</h1>
  <p id="overText">Catch the tile that answers the question. Arrow keys, A/D, or drag.</p>
  <div class="score" id="finalScore" style="display:none"></div>
  <button id="btn">Start</button>
</div></div>
<script>
(function(){
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
  function resize(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);}
  window.addEventListener('resize',resize);resize();

  var TOPIC=${JSON.stringify(safeTopic)};
  var QUESTIONS=[
    {q:'Which is equivalent to 1/2?',a:'2/4',w:['1/3','2/3','3/5']},
    {q:'Which is larger?',a:'3/4',w:['2/3','1/2','3/8']},
    {q:'1/3 + 1/6 = ?',a:'1/2',w:['2/9','1/9','2/6']},
    {q:'Which equals 0.75?',a:'3/4',w:['2/3','4/5','7/10']},
    {q:'Which is smallest?',a:'1/8',w:['1/4','1/3','1/5']},
    {q:'2/5 of 20 = ?',a:'8',w:['6','10','4']},
    {q:'Which is equivalent to 2/3?',a:'4/6',w:['3/4','2/6','5/6']},
    {q:'5/10 simplified = ?',a:'1/2',w:['1/5','2/5','5/1']},
    {q:'3/4 - 1/4 = ?',a:'1/2',w:['1/4','2/4','3/8']},
    {q:'Which is larger?',a:'5/6',w:['3/4','2/3','4/5']}
  ];

  var state='idle', paddleX=0, targetX=0, keys={}, tiles=[], score=0, lives=3, streak=0;
  var qi=0, answer='', spawnTimer=0, spawnEvery=1180, speed=0.055, last=0;

  function nextQuestion(){
    qi=(qi+Math.floor(Math.random()*QUESTIONS.length))%QUESTIONS.length;
    var item=QUESTIONS[qi];
    answer=item.a;
    document.getElementById('q').textContent=item.q;
    var opts=[item.a].concat(item.w).sort(function(){return Math.random()-0.5;});
    var n=Math.min(3,opts.length);
    tiles=[]; spawnTimer=0;
    for(var i=0;i<n;i++){
      tiles.push({x:60+Math.random()*(W-160),y:-80-i*150,vy:1+Math.random()*0.35,
                  label:opts[i],ok:opts[i]===answer,caught:false,dead:false});
    }
  }

  function reset(){score=0;lives=3;streak=0;paddleX=W/2;updateHud();nextQuestion();}

  function updateHud(){
    document.getElementById('score').textContent=score;
    document.getElementById('lives').textContent=lives;
    document.getElementById('streak').textContent=streak;
  }

  function paddleW(){return Math.max(84,Math.min(160,W*0.22));}

  function step(dt){
    if(state!=='play')return;
    var spd=(keys.left?-1:0)+(keys.right?1:0);
    paddleX+=spd*0.62*dt;
    var pw=paddleW();
    paddleX=Math.max(pw/2,Math.min(W-pw/2,paddleX));

    speed=0.055+score*0.0016;
    spawnEvery=Math.max(560,1180-score*14);
    spawnTimer+=dt;
    if(spawnTimer>spawnEvery){
      spawnTimer=0;
      var opts=[];for(var i=0;i<tiles.length;i++)opts.push(tiles[i].label);
      if(tiles.length<4)nextQuestion();
    }

    for(var i=0;i<tiles.length;i++){
      var t=tiles[i];
      if(t.dead)continue;
      t.y+=t.vy*speed*dt;
      if(t.y>H-64 && t.y<H-20 && Math.abs(t.x-paddleX)<pw/2+22){
        t.dead=true;
        if(t.ok){score+=10;streak++;if(streak%3===0)score+=5;updateHud();
          document.getElementById('q').style.color='#5ee29a';
          setTimeout(function(){document.getElementById('q').style.color='';},420);
          nextQuestion();
        } else {
          lives--;streak=0;updateHud();
          document.getElementById('q').style.color='#ff6b6b';
          setTimeout(function(){document.getElementById('q').style.color='';},420);
          if(lives<=0)gameOver();
        }
      }
      if(t.y>H+60){t.dead=true;}
    }
    tiles=tiles.filter(function(t){return !t.dead;});
    if(tiles.length===0 && state==='play')nextQuestion();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#17140f');g.addColorStop(1,'#0d0b08');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    ctx.strokeStyle='rgba(214,178,116,.10)';ctx.lineWidth=1;
    for(var x=0;x<W;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(var y=0;y<H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

    for(var i=0;i<tiles.length;i++){
      var t=tiles[i];
      var w=104,h=46;
      ctx.save();ctx.translate(t.x,t.y);
      ctx.fillStyle=t.ok?'rgba(31,138,95,.22)':'rgba(214,178,116,.16)';
      ctx.strokeStyle=t.ok?'rgba(94,226,154,.55)':'rgba(214,178,116,.45)';
      ctx.lineWidth=1.4;
      roundRect(-w/2,-h/2,w,h,10);ctx.fill();ctx.stroke();
      ctx.fillStyle='#f2ece1';ctx.font='600 19px -apple-system,Segoe UI,Inter,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.label,0,1);
      ctx.restore();
    }

    var pw=paddleW();
    ctx.save();ctx.translate(paddleX,H-40);
    var pg=ctx.createLinearGradient(-pw/2,0,pw/2,0);
    pg.addColorStop(0,'#e6cfa8');pg.addColorStop(1,'#b8905a');
    ctx.fillStyle=pg;roundRect(-pw/2,-9,pw,18,9);ctx.fill();
    ctx.restore();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  }

  function loop(ts){
    var dt=Math.min(48,ts-last||16);last=ts;
    step(dt);draw();requestAnimationFrame(loop);
  }

  function start(){
    document.getElementById('over').classList.remove('on');
    state='play';reset();last=performance.now();
  }
  function gameOver(){
    state='over';
    document.getElementById('overTitle').textContent='Run over';
    document.getElementById('overText').textContent='Score '+score+' — streak bonus applied every 3 correct in a row.';
    document.getElementById('finalScore').textContent=score;
    document.getElementById('finalScore').style.display='block';
    document.getElementById('btn').textContent='Play again';
    document.getElementById('over').classList.add('on');
  }

  document.getElementById('btn').addEventListener('click',start);
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;
  });
  document.addEventListener('keyup',function(e){
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false;
  });
  function pointer(e){
    var r=cv.getBoundingClientRect();
    var cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    paddleX=cx;
  }
  cv.addEventListener('pointerdown',pointer);
  cv.addEventListener('pointermove',function(e){if(e.buttons||e.pointerType==='touch')pointer(e);});
  cv.addEventListener('touchmove',function(e){e.preventDefault();pointer(e);},{passive:false});

  reset();
  requestAnimationFrame(loop);
})();
<\/script>
</body></html>`;
}

/** Tiny DOM + formatting helpers. No framework, no build step. */

/**
 * Create an element.
 * h('div', { class:'x', onclick:fn }, child1, child2)
 */
       function h(tag, attrs = null, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

/** Escape for use inside an SVG/HTML string. */
       const esc = (s) => String(s ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

/* ------------------------------------------------------------------ format */

       function formatTokens(n) {
  n = Number(n) || 0;
  if (n >= 1e9) return `${(n / 1e9).toFixed(1)}B`;
  if (n >= 1e6) return `${(n / 1e6).toFixed(2)}M`;
  if (n >= 1e3) return `${(n / 1e3).toFixed(1)}k`;
  return String(Math.round(n));
}

       function formatUSD(n) {
  n = Number(n) || 0;
  if (n === 0) return '$0.00';
  if (n < 0.0001) return `$${n.toExponential(1)}`;
  return `$${n.toFixed(n < 0.01 ? 4 : 2)}`;
}

       function formatMYR(n) {
  if (n < 0) return 'Custom';
  return new Intl.NumberFormat('ms-MY', { style: 'currency', currency: 'MYR', minimumFractionDigits: 0 }).format(n);
}

       function relativeTime(ts) {
  const diff = Date.now() - ts;
  const m = Math.round(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const hr = Math.round(m / 60);
  if (hr < 24) return `${hr}h ago`;
  const d = Math.round(hr / 24);
  if (d < 30) return `${d}d ago`;
  return new Date(ts).toLocaleDateString();
}

/** Render a markdown subset: headings, bold, code, lists, blockquote, fenced blocks. */
       function markdown(md) {
  const lines = String(md ?? '').split('\n');
  const out = [];
  let inFence = false, fenceBuf = [], listType = null;

  const closeList = () => { if (listType) { out.push(`</${listType}>`); listType = null; } };

  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    if (line.startsWith('```')) {
      if (inFence) { out.push(`<pre class="md-pre">${esc(fenceBuf.join('\n'))}</pre>`); fenceBuf = []; inFence = false; }
      else { closeList(); inFence = true; }
      continue;
    }
    if (inFence) { fenceBuf.push(line); continue; }

    const ul = /^\s*[-*]\s+(.*)$/.exec(line);
    const ol = /^\s*(\d+)\.\s+(.*)$/.exec(line);
    if (ul) { if (listType !== 'ul') { closeList(); out.push('<ul class="md-ul">'); listType = 'ul'; } out.push(`<li>${inline(ul[1])}</li>`); continue; }
    if (ol) { if (listType !== 'ol') { closeList(); out.push('<ol class="md-ol">'); listType = 'ol'; } out.push(`<li>${inline(ol[2])}</li>`); continue; }
    closeList();

    if (!line.trim()) { out.push(''); continue; }
    const hd = /^(#{1,4})\s+(.*)$/.exec(line);
    if (hd) { out.push(`<h${hd[1].length + 2} class="md-h">${inline(hd[2])}</h${hd[1].length + 2}>`); continue; }
    if (line.startsWith('> ')) { out.push(`<blockquote class="md-quote">${inline(line.slice(2))}</blockquote>`); continue; }
    if (/^---+$/.test(line.trim())) { out.push('<hr class="md-hr">'); continue; }
    out.push(`<p class="md-p">${inline(line)}</p>`);
  }
  closeList();
  if (inFence && fenceBuf.length) out.push(`<pre class="md-pre">${esc(fenceBuf.join('\n'))}</pre>`);
  return out.join('\n');
}

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|\s)\*([^*]+)\*/g, '$1<em>$2</em>');
}

/** Extract a JSON object from a model response that may be fenced or wrapped. */
       function extractJson(raw) {
  if (!raw) return null;
  let text = String(raw).trim();
  if (text.startsWith('```')) {
    const parts = text.split('```');
    text = parts[1] ?? text;
    if (text.trimStart().toLowerCase().startsWith('json')) text = text.trimStart().slice(4);
  }
  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  if (start === -1 || end === -1) return null;
  try { return JSON.parse(text.slice(start, end + 1)); } catch { return null; }
}

/* ------------------------------------------------------------------ UI bits */

       function toast(message, kind = 'info', ms = 3800) {
  let host = document.getElementById('toasts');
  if (!host) {
    host = h('div', { id: 'toasts', class: 'toasts' });
    document.body.append(host);
  }
  const el = h('div', { class: `toast toast-${kind}` }, message);
  host.append(el);
  requestAnimationFrame(() => el.classList.add('in'));
  setTimeout(() => {
    el.classList.remove('in');
    setTimeout(() => el.remove(), 240);
  }, ms);
}

       function copy(text, label = 'Copied') {
  navigator.clipboard?.writeText(text)
    .then(() => toast(label, 'ok'))
    .catch(() => toast('Clipboard unavailable', 'warn'));
}

/** Minimal inline-SVG area chart (free vs paid tokens). */
       function areaChart(data, { width = 640, height = 220, pad = 28 } = {}) {
  const max = Math.max(1, ...data.flatMap((d) => [d.free, d.paid]));
  const stepX = (width - pad * 2) / Math.max(1, data.length - 1);
  const y = (v) => height - pad - (v / max) * (height - pad * 2);

  const path = (key) => data.map((d, i) => `${i ? 'L' : 'M'}${pad + i * stepX},${y(d[key])}`).join(' ');
  const area = (key) => `${path(key)} L${pad + (data.length - 1) * stepX},${height - pad} L${pad},${height - pad} Z`;

  const gridY = [0, 0.25, 0.5, 0.75, 1].map((f) => {
    const yy = pad + f * (height - pad * 2);
    // NOTE: var() does not resolve inside SVG presentation attributes, so every
    // themed colour below goes through inline `style` instead.
    return `<line x1="${pad}" y1="${yy}" x2="${width - pad}" y2="${yy}" style="stroke:hsl(var(--border))" stroke-dasharray="3 3"/>
            <text x="${pad - 6}" y="${yy + 3}" text-anchor="end" font-size="9" style="fill:hsl(var(--muted-foreground))">${formatTokens(max * (1 - f))}</text>`;
  }).join('');

  const labels = data.map((d, i) =>
    `<text x="${pad + i * stepX}" y="${height - pad + 16}" text-anchor="middle" font-size="10" style="fill:hsl(var(--muted-foreground))">${esc(d.label)}</text>`,
  ).join('');

  const dots = (key, color) => data.map((d, i) =>
    `<circle cx="${pad + i * stepX}" cy="${y(d[key])}" r="2.6" fill="${color}"><title>${esc(d.label)} · ${key}: ${formatTokens(d[key])}</title></circle>`,
  ).join('');

  return `<svg viewBox="0 0 ${width} ${height}" class="chart" role="img" aria-label="Tokens by day, free versus paid">
    <defs>
      <linearGradient id="gFree" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="hsl(152 60% 40%)" stop-opacity="0.30"/>
        <stop offset="100%" stop-color="hsl(152 60% 40%)" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gPaid" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="hsl(205 45% 55%)" stop-opacity="0.30"/>
        <stop offset="100%" stop-color="hsl(205 45% 55%)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${gridY}
    <path d="${area('paid')}" fill="url(#gPaid)"/>
    <path d="${area('free')}" fill="url(#gFree)"/>
    <path d="${path('paid')}" fill="none" stroke="hsl(205 45% 55%)" stroke-width="2"/>
    <path d="${path('free')}" fill="none" stroke="hsl(152 60% 40%)" stroke-width="2"/>
    ${dots('paid', 'hsl(205 45% 55%)')}
    ${dots('free', 'hsl(152 60% 40%)')}
    ${labels}
  </svg>`;
}

/** Horizontal bar chart for calls by model. */
       function barChart(rows, { width = 520, rowH = 30, labelW = 150 } = {}) {
  const height = rows.length * rowH + 12;
  const max = Math.max(1, ...rows.map((r) => r.calls));
  const bars = rows.map((r, i) => {
    const y = i * rowH + 6;
    const w = Math.max(3, (r.calls / max) * (width - labelW - 54));
    const fill = r.tier === 'free' ? 'hsl(152 60% 40%)' : r.tier === 'premium' ? 'hsl(205 45% 55%)' : 'hsl(42 68% 62%)';
    return `<g><title>${esc(r.modelName ?? r.modelSlug)}: ${r.calls} calls</title>
      <text x="0" y="${y + 15}" font-size="10.5" style="fill:hsl(var(--foreground))">${esc((r.modelName ?? r.modelSlug).slice(0, 24))}</text>
      <rect x="${labelW}" y="${y + 4}" width="${w}" height="14" rx="4" fill="${fill}"/>
      <text x="${labelW + w + 7}" y="${y + 15}" font-size="10" style="fill:hsl(var(--muted-foreground))">${r.calls}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" class="chart" role="img" aria-label="Calls by model">${bars}</svg>`;
}

/** Donut for the free/paid/premium split. */
       function donut(parts, { size = 148, thickness = 18 } = {}) {
  const total = parts.reduce((n, p) => n + p.value, 0) || 1;
  const r = (size - thickness) / 2;
  const c = size / 2;
  let acc = -Math.PI / 2;
  const arcs = parts.map((p) => {
    const angle = (p.value / total) * Math.PI * 2;
    const x1 = c + r * Math.cos(acc), y1 = c + r * Math.sin(acc);
    acc += angle;
    const x2 = c + r * Math.cos(acc), y2 = c + r * Math.sin(acc);
    const large = angle > Math.PI ? 1 : 0;
    return `<path d="M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2}" fill="none"
      stroke="${p.color}" stroke-width="${thickness}" stroke-linecap="butt"><title>${esc(p.label)}: ${Math.round(p.value / total * 100)}%</title></path>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px" role="img" aria-label="Routing tier split">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:hsl(var(--muted))" stroke-width="${thickness}"/>
    ${arcs}
    <text x="${c}" y="${c - 2}" text-anchor="middle" font-size="20" font-weight="700" style="fill:hsl(var(--foreground))">${Math.round((parts[0]?.value ?? 0) / total * 100)}%</text>
    <text x="${c}" y="${c + 14}" text-anchor="middle" font-size="9.5" style="fill:hsl(var(--muted-foreground))">${esc(parts[0]?.label ?? '')}</text>
  </svg>`;
}

       function tierBadge(tier) {
  const map = {
    free: ['FREE', 'p-free'], cheap: ['CHEAP', 'p-cheap'],
    premium: ['PREMIUM', 'p-prem'], local: ['LOCAL', 'p-gl'],
  };
  const [label, cls] = map[tier] ?? map.cheap;
  return `<span class="pill ${cls}">${label}</span>`;
}

       const debounce = (fn, ms = 180) => {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
};

/* ------------------------------------------------------- automation / flow */
       function automationView(p) {
  const nodes = p.nodes ?? [];
  const edges = p.edges ?? [];

  // Layered layout: BFS depth from roots determines the column.
  const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
  const indeg = Object.fromEntries(nodes.map((n) => [n.id, 0]));
  for (const e of edges) if (indeg[e.target] !== undefined) indeg[e.target]++;
  const depth = {};
  const queue = nodes.filter((n) => !indeg[n.id]).map((n) => n.id);
  queue.forEach((id) => { depth[id] = 0; });
  for (let i = 0; i < queue.length; i++) {
    const id = queue[i];
    for (const e of edges.filter((x) => x.source === id)) {
      depth[e.target] = Math.max(depth[e.target] ?? 0, (depth[id] ?? 0) + 1);
      queue.push(e.target);
    }
  }
  for (const n of nodes) if (depth[n.id] === undefined) depth[n.id] = 0;

  const cols = new Map();
  for (const n of nodes) {
    const d = depth[n.id];
    if (!cols.has(d)) cols.set(d, []);
    cols.get(d).push(n);
  }

  const NW = 148, NH = 46, GX = 74, GY = 20;
  const maxRows = Math.max(...[...cols.values()].map((c) => c.length), 1);
  const width = (cols.size || 1) * (NW + GX) + 24;
  const height = maxRows * (NH + GY) + 44;

  const pos = {};
  for (const [d, list] of cols) {
    const total = list.length * NH + (list.length - 1) * GY;
    const y0 = (height - total) / 2;
    list.forEach((n, i) => { pos[n.id] = { x: 16 + d * (NW + GX), y: y0 + i * (NH + GY) }; });
  }

  const typeFill = {
    http: 'hsl(var(--primary))', transform: 'hsl(var(--muted-foreground))',
    agent: 'hsl(var(--accent))', condition: 'hsl(var(--warn))', trigger: 'hsl(var(--up))',
  };
  const esc2 = esc;

  const edgeSvg = edges.map((e) => {
    const a = pos[e.source], b = pos[e.target];
    if (!a || !b) return '';
    const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2;
    const mx = (x1 + x2) / 2;
    const stroke = e.condition === 'true' ? 'hsl(var(--up))' : e.condition === 'false' ? 'hsl(var(--down))' : 'hsl(var(--border-strong))';
    const dash = e.condition ? '5 4' : '';
    const label = e.condition
      ? `<rect x="${mx - 16}" y="${(y1 + y2) / 2 - 9}" width="32" height="16" rx="8" style="fill:hsl(var(--surface))" stroke="${stroke}"/>
         <text x="${mx}" y="${(y1 + y2) / 2 + 3.5}" text-anchor="middle" font-size="9.5" font-weight="700" style="fill:${stroke}">${esc2(e.condition)}</text>`
      : '';
    return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${stroke}" stroke-width="1.6" ${dash ? `stroke-dasharray="${dash}"` : ''}/>
            <path d="M${x2 - 6},${y2 - 4} L${x2},${y2} L${x2 - 6},${y2 + 4}" fill="none" stroke="${stroke}" stroke-width="1.6"/>${label}`;
  }).join('');

  const nodeSvg = nodes.map((n) => {
    const q = pos[n.id];
    const fill = typeFill[n.type] ?? 'hsl(var(--muted-foreground))';
    return `<g class="flow-node"><title>${esc2(n.id)} · ${esc2(n.type)} · ${esc2(n.connector)}</title>
      <rect x="${q.x}" y="${q.y}" width="${NW}" height="${NH}" rx="10" style="fill:hsl(var(--surface))" stroke="hsl(var(--border-strong))"/>
      <rect x="${q.x}" y="${q.y}" width="3.5" height="${NH}" rx="2" fill="${fill}"/>
      <text x="${q.x + 13}" y="${q.y + 19}" font-size="11.5" font-weight="650" style="fill:hsl(var(--foreground))">${esc2(String(n.type).toUpperCase())}</text>
      <text x="${q.x + 13}" y="${q.y + 34}" font-size="10" style="fill:hsl(var(--muted-foreground))">${esc2(String(n.connector).slice(0, 20))}</text>
      <text x="${q.x + NW - 9}" y="${q.y + 19}" text-anchor="end" font-size="9" font-weight="700" style="fill:${fill}">${esc2(n.id)}</text>
    </g>`;
  }).join('');

  return h('div', null,
    h('div', { class: 'row-wrap mb-3' },
      h('span', { class: 'mono', style: { fontWeight: 650, fontSize: '13px' } }, p.name),
      h('span', { class: 'pill p-cheap' }, `TRIGGER: ${String(p.trigger?.type ?? 'manual').toUpperCase()}`),
      h('span', { class: 'tiny muted' }, `${nodes.length} nodes · ${edges.length} edges`),
    ),
    h('div', { class: 'card', style: { padding: '12px', overflowX: 'auto' } },
      h('div', { html: `<svg viewBox="0 0 ${width} ${height}" class="flow-canvas" style="min-width:${Math.min(width, 760)}px" role="img" aria-label="Workflow graph">${edgeSvg}${nodeSvg}</svg>` }),
    ),
    h('div', { class: 'grid g-2 mt-3' },
      h('div', null, section('Trigger config', h('div', { class: 'code' }, JSON.stringify(p.trigger?.config ?? {}, null, 2)))),
      h('div', null, section('Error handling',
        h('dl', { class: 'kv' },
          h('dt', null, 'Retries'), h('dd', { class: 'nums' }, String(p.error_handling?.retries ?? 0)),
          h('dt', null, 'Backoff'), h('dd', null, p.error_handling?.backoff ?? '—'),
          h('dt', null, 'On failure'), h('dd', null, p.error_handling?.on_failure ?? '—'),
        ))),
    ),
  );
}

       function infographicView(p) {
  const chart = p.chart;
  const chartNode = chart
    ? (() => {
      const w = 560, hgt = 168, pad = 26;
      const max = Math.max(1, ...chart.series.flatMap((s) => s.data));
      const groups = chart.labels.length;
      const gw = (w - pad * 2) / groups;
      const bw = Math.min(15, (gw - 6) / chart.series.length);
      const colors = ['hsl(var(--up))', 'hsl(var(--primary))', 'hsl(var(--accent))'];
      const bars = chart.labels.map((lab, i) => {
        const inner = chart.series.map((s, si) => {
          const v = s.data[i] ?? 0;
          const bh = (v / max) * (hgt - pad * 2);
          const x = pad + i * gw + gw / 2 - (chart.series.length * bw) / 2 + si * bw;
          return `<rect x="${x}" y="${hgt - pad - bh}" width="${bw - 2}" height="${Math.max(1, bh)}" rx="3" fill="${colors[si % colors.length]}"><title>${esc(s.name)} ${esc(lab)}: ${formatTokens(v)}</title></rect>`;
        }).join('');
        return `${inner}<text x="${pad + i * gw + gw / 2}" y="${hgt - pad + 14}" text-anchor="middle" font-size="10" style="fill:hsl(var(--muted-foreground))">${esc(lab)}</text>`;
      }).join('');
      const grid = [0, .5, 1].map((f) => {
        const y = pad + f * (hgt - pad * 2);
        return `<line x1="${pad}" y1="${y}" x2="${w - pad}" y2="${y}" style="stroke:hsl(var(--border))" stroke-dasharray="3 3"/>`;
      }).join('');
      const legend = chart.series.map((s, i) => `<rect x="${pad + i * 96}" y="4" width="9" height="9" rx="3" fill="${colors[i % colors.length]}"/><text x="${pad + i * 96 + 14}" y="12" font-size="10" style="fill:hsl(var(--muted-foreground))">${esc(s.name)}</text>`).join('');
      return `<svg viewBox="0 0 ${w} ${hgt}" class="chart" role="img" aria-label="Infographic chart">${legend}${grid}${bars}</svg>`;
    })()
    : null;

  return h('div', null,
    h('div', { class: 'mb-3' },
      h('div', { style: { fontSize: '17px', fontWeight: 750, letterSpacing: '-.02em' } }, p.title),
      h('div', { class: 'tiny muted' }, p.subtitle),
    ),
    chartNode ? h('div', { class: 'card', style: { padding: '12px', marginBottom: '14px' } }, h('div', { html: chartNode })) : null,
    h('div', { class: 'grid g-2' }, ...(p.sections ?? []).map((s, i) => h('div', { class: 'card card-pad' },
      h('div', { class: 'row', style: { alignItems: 'flex-start', gap: '10px' } },
        h('div', { style: { fontSize: '21px', fontWeight: 750, letterSpacing: '-.03em', color: (p.palette ?? [])[i % 4] ?? 'hsl(var(--primary))', lineHeight: 1.1, minWidth: '52px' } }, s.stat),
        h('div', { class: 'grow' },
          h('div', { style: { fontWeight: 650, fontSize: '12.8px' } }, s.heading),
          h('div', { class: 'tiny muted mt-1' }, s.body),
        ),
      ),
    ))),
    p.takeaway ? h('div', { class: 'banner banner-ok mt-3' }, ico('spark'), h('div', null, h('strong', null, 'Takeaway: '), p.takeaway)) : null,
  );
}

/* ---------------------------------------------------------------- mindmap */
       function mindmapView(p) {
  const nodes = p.nodes ?? [];
  const childrenOf = new Map();
  for (const n of nodes) {
    const k = n.parent ?? '__root__';
    if (!childrenOf.has(k)) childrenOf.set(k, []);
    childrenOf.get(k).push(n);
  }
  const root = nodes.find((n) => !n.parent) ?? nodes[0];
  const W = 720, H = 440;
  const cx = W / 2, cy = H / 2;

  const placed = new Map();
  placed.set(root.id, { x: cx, y: cy });
  const palette = ['hsl(var(--primary))', 'hsl(var(--accent))', 'hsl(var(--up))', 'hsl(var(--info))', 'hsl(var(--warn))'];

  const l1 = childrenOf.get(root.id) ?? [];
  const R1 = 138, R2 = 262;
  l1.forEach((n, i) => {
    const a = -Math.PI / 2 + (i / l1.length) * Math.PI * 2;
    placed.set(n.id, { x: cx + R1 * Math.cos(a), y: cy + R1 * Math.sin(a), color: palette[i % palette.length] });
  });
  l1.forEach((n, i) => {
    const kids = childrenOf.get(n.id) ?? [];
    const base = -Math.PI / 2 + (i / l1.length) * Math.PI * 2;
    const span = (Math.PI * 2) / l1.length;
    kids.forEach((c, j) => {
      const a = base - span / 2.6 + (j / Math.max(1, kids.length - 1)) * (span / 1.3);
      placed.set(c.id, { x: cx + R2 * Math.cos(a), y: cy + R2 * Math.sin(a), color: palette[i % palette.length] });
    });
  });
  // anything unplaced (deeper levels) — ring them outward
  let ring = R2 + 92;
  for (const n of nodes) {
    if (!placed.has(n.id)) {
      const a = Math.random() * Math.PI * 2;
      placed.set(n.id, { x: cx + ring * Math.cos(a), y: cy + ring * Math.sin(a), color: 'hsl(var(--muted-foreground))' });
    }
  }

  const edges = nodes.filter((n) => n.parent).map((n) => {
    const a = placed.get(n.parent), b = placed.get(n.id);
    if (!a || !b) return '';
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    return `<path d="M${a.x},${a.y} Q${mx},${a.y} ${b.x},${b.y}" fill="none" style="stroke:${b.color ?? 'hsl(var(--border-strong))'}" stroke-width="1.4" opacity=".55"/>`;
  }).join('');

  const nodeSvg = nodes.map((n) => {
    const q = placed.get(n.id);
    if (!q) return '';
    const isRoot = !n.parent;
    const label = String(n.label ?? '');
    const w = Math.max(isRoot ? 118 : 84, Math.min(190, label.length * 6.2 + 20));
    const color = q.color ?? 'hsl(var(--primary))';
    return `<g class="flow-node"><title>${esc(label)}</title>
      <rect x="${q.x - w / 2}" y="${q.y - (isRoot ? 19 : 13)}" width="${w}" height="${isRoot ? 38 : 26}" rx="${isRoot ? 12 : 9}"
        style="fill:${isRoot ? 'hsl(var(--surface))' : 'hsl(var(--surface-raised))'}" stroke="${color}" stroke-width="${isRoot ? 2 : 1.3}"/>
      <text x="${q.x}" y="${q.y + (isRoot ? 5 : 4)}" text-anchor="middle" font-size="${isRoot ? 13 : 10.5}" font-weight="${isRoot ? 700 : 550}" style="fill:hsl(var(--foreground))">${esc(label.slice(0, 26))}</text>
    </g>`;
  }).join('');

  return h('div', null,
    h('div', { class: 'card', style: { padding: '8px', overflow: 'hidden' } },
      h('div', { html: `<svg viewBox="0 0 ${W} ${H}" class="flow-canvas" role="img" aria-label="Mind map">${edges}${nodeSvg}</svg>` }),
    ),
    h('div', { class: 'row-wrap mt-3' }, ...l1.map((n, i) =>
      h('span', { class: 'chip' },
        h('span', { style: { width: '8px', height: '8px', borderRadius: '99px', background: palette[i % palette.length] } }),
        n.label,
        h('span', { class: 'tiny muted nums' }, String((childrenOf.get(n.id) ?? []).length)),
      ))),
  );
}

       function quizView(p) {
  const qs = p.questions ?? [];
  const state = { i: 0, chosen: null, answers: [], done: false };

  const host = h('div');
  const head = h('div', { class: 'row-wrap mb-3' });
  const prog = h('div', { class: 'quiz-progress mb-3' }, h('i', { style: { width: '0%' } }));
  const body = h('div');

  const paint = () => {
    if (state.done) {
      const score = state.answers.reduce((n, a) => n + (a.correct ? a.points : 0), 0);
      const max = qs.reduce((n, q) => n + (q.points ?? 1), 0);
      const pct = Math.round((score / Math.max(1, max)) * 100);
      head.replaceChildren(
        h('span', { style: { fontWeight: 700, fontSize: '14px' } }, p.title),
        h('span', { class: 'pill p-gl' }, String(p.level ?? '').toUpperCase()),
      );
      prog.firstChild.style.width = '100%';
      body.replaceChildren(h('div', { class: 'center', style: { padding: '22px 0' } },
        h('div', { style: { fontSize: '40px', fontWeight: 750, letterSpacing: '-.04em', color: pct >= 70 ? 'hsl(var(--up))' : pct >= 40 ? 'hsl(var(--warn))' : 'hsl(var(--down))' } }, `${pct}%`),
        h('div', { style: { fontWeight: 650, fontSize: '13.5px' } }, `${score} of ${max} points`),
        h('div', { class: 'tiny muted mt-1' }, `${state.answers.filter((a) => a.correct).length} of ${qs.length} correct`),
        h('div', { class: 'mt-4' }, h('button', {
          class: 'btn btn-primary',
          onclick: () => { state.i = 0; state.chosen = null; state.answers = []; state.done = false; paint(); },
        }, ico('refresh', 'ic'), 'Try again')),
        h('div', { class: 'mt-4', style: { maxWidth: '520px', margin: '16px auto 0', textAlign: 'left' } },
          ...state.answers.map((a, i) => h('div', { class: 'row', style: { gap: '8px', padding: '5px 0', fontSize: '12.5px', borderBottom: '1px solid hsl(var(--border))' } },
            h('span', { class: a.correct ? 'opt-correct-mark' : 'opt-wrong-mark' }, a.correct ? '✓' : '✗'),
            h('span', { class: 'grow' }, `Q${i + 1}. ${qs[i].question.slice(0, 74)}${qs[i].question.length > 74 ? '…' : ''}`),
            h('span', { class: 'tiny muted nums' }, `${a.correct ? a.points : 0}/${qs[i].points ?? 1}`),
          )),
        ),
      ));
      return;
    }

    const q = qs[state.i];
    head.replaceChildren(
      h('span', { style: { fontWeight: 700, fontSize: '14px' } }, p.title),
      h('span', { class: 'pill p-gl' }, String(p.level ?? '').toUpperCase()),
      h('span', { class: `pill ${q.difficulty === 'hard' ? 'p-prem' : q.difficulty === 'medium' ? 'p-cheap' : 'p-free'}` }, String(q.difficulty ?? 'easy').toUpperCase()),
      h('div', { class: 'grow' }),
      h('span', { class: 'tiny muted nums' }, `Question ${state.i + 1} of ${qs.length}`),
    );
    prog.firstChild.style.width = `${(state.i / qs.length) * 100}%`;

    const locked = state.chosen !== null;
    const opts = (q.options ?? []).map((o, oi) => {
      let cls = 'quiz-opt';
      if (locked) {
        if (oi === q.answer_index) cls += ' correct';
        else if (oi === state.chosen) cls += ' wrong';
      }
      return h('button', {
        class: cls, disabled: locked,
        onclick: () => {
          state.chosen = oi;
          state.answers.push({ correct: oi === q.answer_index, points: q.points ?? 1 });
          paint();
        },
      },
        h('span', { class: 'key' }, String.fromCharCode(65 + oi)),
        h('span', { class: 'grow' }, o),
        locked && oi === q.answer_index ? h('span', { html: icon('check'), style: { display: 'inline-flex', color: 'hsl(var(--up))' } }) : null,
        locked && oi === state.chosen && oi !== q.answer_index ? h('span', { html: icon('x'), style: { display: 'inline-flex', color: 'hsl(var(--down))' } }) : null,
      );
    });

    body.replaceChildren(
      h('div', { class: 'row mb-3', style: { gap: '9px', alignItems: 'flex-start' } },
        h('span', { class: 'avatar' }, ico('book', 'ic')),
        h('div', { class: 'grow' },
          h('div', { class: 'quiz-q' }, q.question),
          q.image_prompt ? h('div', { class: 'tiny muted mt-1', style: { fontStyle: 'italic' } }, `Illustration: ${q.image_prompt}`) : null,
        ),
      ),
      h('div', { class: 'quiz-opts' }, ...opts),
      locked ? h('div', { class: 'mt-3' },
        h('div', { class: 'quiz-explain' }, h('strong', null, 'Why: '), q.explanation),
        h('div', { class: 'row mt-3' },
          h('span', { class: 'tiny muted' }, `${q.points ?? 1} point${(q.points ?? 1) === 1 ? '' : 's'}`),
          h('div', { class: 'grow' }),
          h('button', {
            class: 'btn btn-primary btn-sm',
            onclick: () => { state.i++; state.chosen = null; if (state.i >= qs.length) state.done = true; paint(); },
          }, state.i === qs.length - 1 ? 'See results' : 'Next question', ico('arrow', 'ic')),
        ),
      ) : null,
    );
  };

  paint();
  host.append(head, prog, body);
  return host;
}

const DISPATCH = {
  orchestrator: planView, coder: codeView, designer: designView, researcher: researchView,
  writer: writerView, qa: qaView, automation: automationView, creative: imageView,
  tutor: quizView, deploy: deployView,
};

/**
 * Register domain-specific renderers without creating an import cycle.
 * The KSSR edition calls this at boot to map its education agents
 * (rph, dskp, pbd, bbm, panitia, bahasa, admin) onto their own views.
 * @param {Record<string, (parsed:object)=>Node>} map
 */
       function registerViews(map) {
  Object.assign(DISPATCH, map);
}

/**
 * Render an agent result.
 * @param {string} agentKey
 * @param {{parsed:object|null, text:string, subtype?:string}} result
 */
       function renderOutput(agentKey, result) {
  if (!result.parsed) return proseView(result.text ?? '');

  // Creative sub-types share the `creative` agent key.
  if (agentKey === 'creative' && result.subtype) {
    const map = { video: videoView, infographic: infographicView, mindmap: mindmapView, image: imageView };
    const fn = map[result.subtype];
    if (fn) return fn(result.parsed);
  }
  if (agentKey === 'tutor' && result.subtype === 'game') return gameView(result.parsed);

  const fn = DISPATCH[agentKey];
  if (!fn) return proseView(result.text ?? '');
  try { return fn(result.parsed); } catch (err) {
    return h('div', null,
      h('div', { class: 'banner banner-warn mb-3' }, ico('warn'), h('div', null, `Renderer failed (${err.message}) — showing raw output.`)),
      proseView(result.text ?? ''),
    );
  }
}

/**

 */

        ),

/** The result block shown after an agent run: meta strip + rendered output. */
       function resultBlock(completion, agentKey, subtype) {
  const parsed = completion.parsed;
  return h('div', { class: 'stack' },
    h('div', { class: 'row-wrap', style: { gap: '7px' } },
      h('span', { class: 'pill p-cheap' }, completion.modelName ?? completion.modelSlug),
      h('span', { html: tierBadge(completion.tier), style: { display: 'inline-flex' } }),
      completion.cacheHit ? h('span', { class: 'pill p-gl' }, 'CACHE HIT') : null,
      completion.simulated ? h('span', { class: 'pill p-gl' }, 'SIMULATED') : h('span', { class: 'pill p-free' }, 'LIVE'),
      h('span', { class: 'tiny muted nums' }, `${formatTokens(completion.promptTokens)} in · ${formatTokens(completion.completionTokens)} out`),
      h('span', { class: 'tiny muted nums' }, `${completion.latencyMs} ms`),
      h('span', { class: 'tiny muted nums', style: { color: completion.costUsd > 0 ? 'hsl(var(--foreground))' : 'hsl(var(--up))' } }, completion.costUsd > 0 ? formatUSD(completion.costUsd) : 'FREE'),
      h('div', { class: 'grow' }),
      h('button', { class: 'btn btn-sm btn-ghost', onclick: () => copy(completion.text, 'Raw JSON copied') }, ico('copy', 'ic'), 'Raw'),
    ),
    renderOutput(agentKey, { parsed, text: completion.text, subtype }),
    traceLadder(completion.attempts),
  );
}

/** A run button that swaps in a spinner, executes, and renders into `target`. */
       function runButton(label, runFn, target, { cls = 'btn btn-primary', iconName = 'play' } = {}) {
  const btn = h('button', { class: cls }, ico(iconName, 'ic'), label);
  btn.addEventListener('click', async () => {
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.replaceChildren(h('span', { class: 'spinner' }), document.createTextNode('Working…'));
    target.replaceChildren(h('div', { class: 'row', style: { padding: '18px 0', gap: '10px' } },
      h('span', { class: 'spinner' }), h('span', { class: 'tiny muted' }, 'Walking the routing ladder — watch for 429s on the free rung.'),
    ));
    try {
      await runFn();
    } catch (err) {
      target.replaceChildren(h('div', { class: 'banner banner-warn' }, ico('warn'),
        h('div', null, h('strong', null, 'Run failed. '), String(err.message ?? err))));
    } finally {
      btn.disabled = false;
      btn.innerHTML = original;
    }
  });
  return btn;
}

       function routerPage(ctx) {
  const cfg = {
    task: 'coding', requireTools: false, requireVision: false,
    minContext: 0, allowPremium: true, preferFree: true, tokenBudget: 32000,
  };

  const previewHost = h('div');
  const cooldownHost = h('div');
  // Seeded with its placeholder and always mounted, so a completed run has
  // somewhere live to render into.
  const runHost = h('div', { class: 'tiny muted' },
    'Not run yet. The simulator fails free-tier calls roughly a third of the time, which is what a real free endpoint feels like under load.');

  const paintPreview = () => {
    let decision;
    try {
      decision = ctx.router.decide({
        task: cfg.task, requireTools: cfg.requireTools, requireVision: cfg.requireVision,
        minContext: cfg.minContext, allowPremium: cfg.allowPremium, preferFree: cfg.preferFree,
      });
    } catch (err) {
      previewHost.replaceChildren(h('div', { class: 'banner banner-warn' }, ico('warn'),
        h('div', null, h('strong', null, 'No candidate model. '), err.message,
          h('div', { class: 'tiny mt-1' }, 'Loosen a capability requirement or allow premium models.'))));
      return;
    }

    const ladder = decision.candidates.map((slug, i) => {
      const spec = CATALOG[slug];
      const cd = ctx.router.cooldownRemaining(slug);
      const isFirst = i === 0;
      return h('div', { class: `rung ${isFirst ? 'rung-live' : ''}${cd ? ' rung-skip' : ''}` },
        h('div', { class: 'rung-ic' }, String(i + 1)),
        h('div', { class: 'grow' },
          h('div', { class: 'rung-name' },
            spec.display_name,
            h('span', { html: tierBadge(spec.tier), style: { display: 'inline-flex' } }),
            spec.origin === 'china' ? h('span', { class: 'pill p-gl' }, spec.vendor) : null,
            cd ? h('span', { class: 'pill p-prem' }, `COOLDOWN ${cd}s`) : null,
          ),
          h('div', { class: 'rung-note' },
            `${spec.vendor} · ${formatTokens(spec.context_window)} ctx · ${isFree(spec) ? 'no cost' : `$${blendedCost(spec).toFixed(2)} blended /1M`}`,
            spec.supports_tools ? ' · tools' : '', spec.supports_vision ? ' · vision' : '',
          ),
        ),
        isFirst ? h('span', { class: 'pill p-free' }, 'SELECTED') : h('span', { class: 'tiny muted' }, `fallback ${i}`),
      );
    });

    previewHost.replaceChildren(
      h('div', { class: 'banner banner-ok mb-3' }, ico('check'),
        h('div', { class: 'grow' },
          h('div', null, h('strong', null, 'Selected: '), decision.model.display_name,
            ' ', h('span', { class: 'mono tiny muted' }, decision.model.slug)),
          h('div', { class: 'tiny muted mt-1' }, decision.reason),
        )),
      h('div', { class: 'ladder' }, ...ladder),
    );
  };

  const paintCooldowns = () => {
    const health = ctx.router.health();
    const entries = Object.entries(health.cooldowns);
    cooldownHost.replaceChildren(
      entries.length
        ? h('div', { class: 'ladder' }, ...entries.map(([slug, secs]) => h('div', { class: 'rung rung-fail' },
          h('div', { class: 'rung-ic' }, h('span', { html: icon('clock'), style: { display: 'inline-flex' } })),
          h('div', { class: 'grow' },
            h('div', { class: 'rung-name' }, CATALOG[slug]?.display_name ?? slug),
            h('div', { class: 'rung-note' }, 'circuit open — skipped by buildCandidates()'),
          ),
          h('button', { class: 'btn btn-sm btn-ghost', onclick: () => { ctx.router.clearCooldown(slug); paintCooldowns(); paintPreview(); toast('Cooldown cleared', 'ok'); } }, `clear ${secs}s`),
        )))
        : h('div', { class: 'banner banner-ok' }, ico('check'),
          h('div', { class: 'tiny' }, 'No open circuits. Run the stress test to force free-tier 429s and watch the breaker trip.')),
    );
  };

  const stress = runButton('Stress test — 8 calls on the free rung', async () => {
    const lines = [];
    for (let i = 0; i < 8; i++) {
      try {
        const c = await ctx.callAgent({
          agentKey: 'coder', task: 'coding',
          prompt: `Write a small utility function. Variation ${i + 1}.`,
          record: true, silent: true,
        });
        lines.push(h('div', { class: 'row', style: { gap: '8px', fontSize: '12px', padding: '4px 0', borderBottom: '1px solid hsl(var(--border))' } },
          h('span', { style: { color: 'hsl(var(--up))' } }, '✓'),
          h('span', { class: 'grow' }, `${CATALOG[c.modelSlug]?.display_name ?? c.modelSlug}`),
          h('span', { class: 'tiny muted' }, `${c.attempts.length} rung${c.attempts.length === 1 ? '' : 's'}`),
          h('span', { class: 'tiny muted nums' }, `${c.latencyMs} ms`),
        ));
      } catch (err) {

      runHost.replaceChildren(h('div', { class: 'stack' },
        h('div', { class: 'row' }, h('span', { class: 'spinner' }), h('span', { class: 'tiny muted' }, `call ${i + 1} of 8…`)),
        ...lines,

    }
    paintCooldowns(); paintPreview();
    runHost.replaceChildren(h('div', { class: 'stack' },
      h('div', { class: 'banner banner-ok' }, ico('check'), h('div', { class: 'tiny' }, 'Stress test complete. Check the circuit-breaker board — the free rung should be cooling down.')),

  const control = (label, node) => h('div', { class: 'field' }, h('label', null, label), node);

      { label: 'Tier', render: (m) => h('span', { html: tierBadge(m.tier), style: { display: 'inline-flex' } }) },
      { label: 'Context', num: true, render: (m) => formatTokens(m.context_window) },

       function studioPage(ctx) {
  const transcriptHost = h('div', { class: 'chat' });
  let agentKey = 'coder';
  let stack = 'nextjs';

  const STACKS = [
    ['nextjs', 'Next.js 15 + TypeScript'], ['fastapi', 'FastAPI + Python'],
    ['go', 'Go service'], ['laravel', 'Laravel + PHP'],
  ];
  const AGENT_CHOICES = ['coder', 'designer', 'researcher', 'writer', 'qa', 'automation', 'deploy'];

  const paint = () => {
    transcriptHost.replaceChildren(...studio.transcript.map((m) => m.role === 'user'
      ? h('div', { class: 'msg msg-user' },
        h('div', { class: 'msg-avatar' }, 'YOU'),
        h('div', { class: 'msg-body' }, h('div', { style: { fontSize: '13px' } }, m.text)))
      : h('div', { class: 'msg' },
        h('div', { class: 'msg-avatar' }, (m.agentKey ?? 'AI').slice(0, 2).toUpperCase()),
        h('div', { class: 'msg-body' },
          h('div', { class: 'msg-meta' },
            h('strong', null, AGENTS.find((a) => a.key === m.agentKey)?.name ?? m.agentKey),
            h('span', { html: tierBadge(m.completion.tier) }),
            h('span', null, m.completion.modelName),
            m.completion.cacheHit ? h('span', { class: 'pill p-gl' }, 'CACHE') : null,
            h('span', { class: 'nums' }, `${formatTokens((m.completion.promptTokens ?? 0) + (m.completion.completionTokens ?? 0))} tok`),
            h('span', { class: 'nums' }, m.completion.costUsd > 0 ? formatUSD(m.completion.costUsd) : 'FREE'),
          ),
          renderOutput(m.agentKey, { parsed: m.completion.parsed, text: m.completion.text, subtype: m.subtype }),
          traceLadder(m.completion.attempts),
        ))));
    if (!studio.transcript.length) {
      transcriptHost.replaceChildren(emptyState('code', 'Nothing generated yet',
        'Describe what you want built. The Coder agent returns files, tests and run commands as structured JSON — not prose.'));
    }
    transcriptHost.scrollTop = transcriptHost.scrollHeight;
  };

  const promptBox = h('textarea', {
    class: 'textarea', rows: 3,
    placeholder: 'Build a fixed-window rate limiter for the public API, backed by Redis with an in-memory fallback, plus tests.',
  });

  const agentSel = h('select', { class: 'select', onchange: (e) => { agentKey = e.target.value; } },
    ...AGENT_CHOICES.map((k) => h('option', { value: k, selected: k === agentKey },
      `${AGENTS.find((a) => a.key === k)?.name} — ${AGENTS.find((a) => a.key === k)?.task}`)));

  const stackSel = h('select', { class: 'select', onchange: (e) => { stack = e.target.value; } },
    ...STACKS.map(([v, l]) => h('option', { value: v, selected: v === stack }, l)));

  const send = async () => {
    const text = promptBox.value.trim();
    if (!text) { toast('Describe what you want built first', 'warn'); return; }
    const agent = AGENTS.find((a) => a.key === agentKey);
    const prompt = `Stack: ${stack}\nTask: ${text}`;
    studio.transcript.push({ role: 'user', text: `${text}\n\n— ${agent.name} · ${stack}` });
    promptBox.value = '';
    paint();

    const pending = h('div', { class: 'msg' },
      h('div', { class: 'msg-avatar' }, agent.name.slice(0, 2).toUpperCase()),
      h('div', { class: 'msg-body' },
        h('div', { class: 'row', style: { gap: '9px' } },
          h('span', { class: 'spinner' }),
          h('span', { class: 'tiny muted' }, `${agent.name} is working — the free rung may 429 before it lands.`))));
    transcriptHost.append(pending);
    transcriptHost.scrollTop = transcriptHost.scrollHeight;

    try {
      const completion = await ctx.callAgent({
        agentKey, prompt, task: agent.task, systemPrompt: SYSTEM_PROMPTS[agentKey], record: true,
      });
      pending.remove();
      studio.transcript.push({ role: 'assistant', agentKey, completion });
    } catch (err) {
      pending.remove();
      transcriptHost.append(h('div', { class: 'banner banner-warn' }, ico('warn'),
        h('div', null, h('strong', null, 'Every rung failed. '), String(err.message))));
    }
    paint();
  };

  const sendBtn = h('button', { class: 'btn btn-primary', onclick: send }, ico('spark', 'ic'), 'Generate');
  promptBox.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
  });

  paint();

  return h('div', { class: 'stack' },
    pageHead('Vibe Coding Studio',
      'Describe the change; the agent returns typed files, tests and run commands. Every response reports which model answered, what it cost, and which rungs it fell through to get there.',
      h('button', {
        class: 'btn', onclick: () => { studio.transcript = []; paint(); toast('Transcript cleared'); },
      }, ico('trash', 'ic'), 'Clear')),

    h('div', { class: 'grid g-side' },
      card('Conversation', `${studio.transcript.length} message${studio.transcript.length === 1 ? '' : 's'} in this session`,
        h('div', { class: 'card-body' },
          h('div', { class: 'scroll-y-420', style: { marginBottom: '14px' } }, transcriptHost))),

      h('div', { class: 'stack' },
        card('Compose', 'Cmd/Ctrl + Enter to send',
          h('div', { class: 'card-body stack' },
            h('div', { class: 'field' }, h('label', null, 'Instruction'), promptBox),
            h('div', { class: 'grid g-2' },
              h('div', { class: 'field' }, h('label', null, 'Agent'), agentSel),
              h('div', { class: 'field' }, h('label', null, 'Stack'), stackSel),
            ),
            h('div', { class: 'row' },
              sendBtn,
              h('button', {
                class: 'btn',
                onclick: () => { promptBox.value = 'Build a fixed-window rate limiter for the public API, backed by Redis with an in-memory fallback, plus tests.'; },
              }, 'Use example'),
            ),
          )),
        card('Why structured output', 'The reason agents return JSON, not prose',
          h('div', { class: 'card-body' },
            h('div', { class: 'tiny muted' },
              'A prose answer can only be read by a human. This contract — ',
              h('code', null, 'files[]'), ', ', h('code', null, 'tests[]'), ', ', h('code', null, 'run_commands[]'),
              ' — is simultaneously renderable here, writable to disk by the worker, and checkable by the QA agent. ',
              'One contract, three consumers.')),
        ),
      ),
    ),

    card('Sandbox note', 'Generated code never touches your machine directly',
      h('div', { class: 'card-body' },
        h('div', { class: 'grid g-2' },
          h('div', null, section('Server-side sandbox',
            bullets(['Docker with --network none', 'Read-only root filesystem', 'All capabilities dropped', '128 PID limit, 512 MB memory cap', '18 banned tokens rejected before execution'], { mark: 'shield' }))),
          h('div', null, section('Browser-side sandbox',
            bullets(['Generated games run in an iframe', 'sandbox="allow-scripts" only', 'No allow-same-origin, so no storage or cookie access', 'Your OpenRouter key is unreachable from generated code'], { mark: 'shield' }))),
        )),
    ),
  );
}

       function billingPage(ctx) {
  const s = ctx.store;
  const usage = s.usageByModel();
  const counterfactual = s.premiumCounterfactual;
  const saved = Math.max(0, counterfactual - s.costUsd);
  const plan = PLANS.find((p) => p.id === s.state.settings.plan) ?? PLANS[1];
  const granted = s.state.settings.tokensGranted;
  const used = s.tokensUsed;
  const pct = granted === Infinity ? 0 : Math.min(1, used / granted);

  const MYR_PER_USD = 4.45;

  return h('div', { class: 'stack' },
    pageHead('Billing',
      'Metered per token, priced in ringgit. Every completion is attributed to a model, a tier and a tenant — which is what makes the invoice defensible.'),

    h('div', { class: 'grid g-4' },
      statCard('Current plan', plan.name, plan.price < 0 ? 'custom pricing' : formatMYR(plan.price) + ' / month', { ic: 'tag', accent: true }),
      statCard('Tokens this cycle', formatTokens(used), granted === Infinity ? 'unlimited on this plan' : `of ${formatTokens(granted)} granted`, { ic: 'bolt' }),
      statCard('Amount due', formatMYR(Math.round(s.costUsd * MYR_PER_USD * 100) / 100), `at RM ${MYR_PER_USD} / USD`, { ic: 'chart' }),
      statCard('Avoided', formatMYR(Math.round(saved * MYR_PER_USD * 100) / 100), 'vs premium-only routing', { ic: 'spark' }),
    ),

    card('Quota', granted === Infinity ? 'Unlimited on this plan' : `${Math.round(pct * 100)}% of the monthly grant consumed`,
      h('div', { class: 'card-body' },
        granted === Infinity
          ? h('div', { class: 'banner banner-ok' }, ico('check'), h('div', { class: 'tiny' }, 'No token ceiling on this plan. Spend is still capped per request by the router token budget.'))
          : h('div', null,
            h('div', { class: 'meter' }, h('i', { style: { width: `${Math.max(1, pct * 100)}%`, background: pct > .85 ? 'hsl(var(--down))' : undefined } })),
            h('div', { class: 'row mt-2', style: { justifyContent: 'space-between' } },
              h('span', { class: 'tiny muted nums' }, `${formatTokens(used)} used`),
              h('span', { class: 'tiny muted nums' }, `${formatTokens(granted - used)} remaining`)),
            pct > .85 ? h('div', { class: 'banner banner-warn mt-3' }, ico('warn'), h('div', { class: 'tiny' }, 'Above 85% of quota. Free-tier routing will keep absorbing most of the volume, but consider upgrading before the ceiling bites.')) : null,
          ),
      )),

    card('Plans', 'Change plan at any time — prorated to the day',
      h('div', { class: 'card-body' },
        h('div', { class: 'grid g-3' }, ...PLANS.map((p) => {
          const on = p.id === s.state.settings.plan;
          return h('div', { class: `plan${on ? ' plan-on' : ''}` },
            p.tag ? h('span', { class: 'plan-badge' }, p.tag) : null,
            h('div', { class: 'row', style: { justifyContent: 'space-between' } },
              h('span', { class: 'p-name' }, p.name),
              on ? h('span', { class: 'pill p-free' }, 'CURRENT') : null),
            h('div', { class: 'p-price' }, p.price < 0 ? 'Custom' : p.price === 0 ? 'Free' : `RM ${p.price}`,
              p.price > 0 ? h('small', null, ' /mo') : null),
            h('div', { class: 'tiny muted' }, p.tokens === Infinity ? 'Unlimited tokens' : `${formatTokens(p.tokens)} tokens / month`),
            h('ul', null, ...p.feats.map((f) => h('li', null,
              h('span', { html: icon('check'), style: { display: 'inline-flex' } }), h('span', null, f)))),
            on
              ? h('button', { class: 'btn btn-sm', disabled: true }, 'Active plan')
              : h('button', {
                class: 'btn btn-sm btn-primary',
                onclick: () => {
                  ctx.store.update((st) => {
                    st.settings.plan = p.id;
                    st.settings.tokensGranted = p.tokens === Infinity ? Number.MAX_SAFE_INTEGER : p.tokens;
                  });
                  ctx.refresh(); toast(`Switched to ${p.name}`, 'ok');
                },
              }, p.price < 0 ? 'Contact sales' : 'Switch'),
          );
        })),
      )),

    card('Usage by model', 'This billing cycle',
      h('div', { class: 'card-body', style: { padding: '0' } },
        table([
          { label: 'Model', render: (u) => h('div', null,
            h('div', { style: { fontWeight: 600, fontSize: '12.5px' } }, u.modelName),
            h('div', { class: 'mono tiny muted' }, u.modelSlug)) },
          { label: 'Tier', render: (u) => h('span', { html: tierBadge(u.tier), style: { display: 'inline-flex' } }) },
          { label: 'Calls', num: true, render: (u) => String(u.calls) },
          { label: 'Tokens', num: true, render: (u) => formatTokens(u.tokens) },
          { label: 'Avg latency', num: true, render: (u) => `${u.avgLatency} ms` },
          { label: 'Cost USD', num: true, render: (u) => u.costUsd > 0 ? formatUSD(u.costUsd) : h('span', { style: { color: 'hsl(var(--up))' } }, '$0.00') },
          { label: 'Cost MYR', num: true, render: (u) => formatMYR(Math.round(u.costUsd * MYR_PER_USD * 100) / 100) },
        ], usage, { tight: true, empty: 'No metered usage yet.' })),
    ),

    h('div', { class: 'grid g-side' },
      card('Savings breakdown', 'Same tokens, two policies',
        h('div', { class: 'card-body' }, kv([
          ['Actual spend', formatUSD(s.costUsd)],
          ['Premium-only equivalent', formatUSD(counterfactual)],
          ['Avoided', h('strong', { style: { color: 'hsl(var(--up))' } }, formatUSD(saved))],
          ['Reduction', `${counterfactual > 0 ? Math.round((saved / counterfactual) * 100) : 0}%`],
          ['Free-tier completions', `${Math.round(s.freeShare * 100)}%`],
          ['Cache hits', `${Math.round(s.cacheHitRate * 100)}%`],
        ]))),
      card('How metering works', 'Per completion, not per seat',
        h('div', { class: 'card-body' },
          bullets([
            'Every completion reports prompt and completion tokens plus the resolved model.',
            'Cost is computed at the model\u2019s published rate — free rungs cost exactly zero.',
            'Free-tier savings are tracked as a counterfactual, so the invoice shows what routing policy bought you.',
            'A hard token budget per request is checked before spending; over-budget requests are rejected, not truncated.',
          ], { mark: 'chart' }))),
    ),
  );
}

       function keysPage(ctx) {
  const s = ctx.state;
  const host = h('div');
  let label = '';
  const labelBox = h('input', { class: 'input', placeholder: 'e.g. Production server', oninput: (e) => { label = e.target.value; } });

  const mask = (k) => `${k.slice(0, 11)}${'•'.repeat(14)}${k.slice(-4)}`;

  const paint = () => {
    host.replaceChildren(
      table([
        { label: 'Label', render: (k) => h('div', null,
          h('div', { style: { fontWeight: 600, fontSize: '12.5px' } }, k.label),
          h('div', { class: 'mono tiny muted' }, mask(k.key))) },
        { label: 'Scopes', render: (k) => h('div', { class: 'row-wrap' }, ...k.scopes.map((sc) => h('span', { class: 'chip mono', style: { fontSize: '10.5px' } }, sc))) },
        { label: 'Created', num: true, render: (k) => h('span', { class: 'tiny muted' }, relativeTime(k.created)) },
        { label: 'Last used', num: true, render: (k) => h('span', { class: 'tiny muted' }, k.lastUsed ? relativeTime(k.lastUsed) : 'never') },
        { label: '', render: (k) => h('div', { class: 'row', style: { justifyContent: 'flex-end', gap: '5px' } },
          h('button', { class: 'btn btn-sm', onclick: () => copy(k.key, 'Key copied') }, ico('copy', 'ic'), 'Reveal'),
          h('button', {
            class: 'btn btn-sm btn-danger',
            onclick: () => { ctx.store.update((st) => { st.apiKeys = st.apiKeys.filter((x) => x.id !== k.id); }); paint(); toast('Key revoked', 'ok'); },
          }, ico('trash', 'ic')),
        ) },
      ], s.apiKeys, { empty: 'No API keys issued yet.' }),
    );
  };

  paint();

  return h('div', { class: 'stack' },
    pageHead('API keys',
      'Tenant-scoped keys for the public API. Stored as AES-256-GCM envelopes — the ciphertext is what lands in the database, never the key itself.'),

    card('Issued keys', `${s.apiKeys.length} active`,
      h('div', { class: 'card-body', style: { padding: '0' } }, host)),

    card('Issue a key', 'Scopes are enforced server-side per request',
      h('div', { class: 'card-body stack' },
        h('div', { class: 'grid g-2' },
          h('div', { class: 'field' }, h('label', null, 'Label'), labelBox),
          h('div', { class: 'field' }, h('label', null, 'Scopes'),
            h('div', { class: 'row-wrap' },
              ...['models:read', 'agents:run', 'assets:write', 'billing:read'].map((sc) => h('span', { class: 'chip mono' }, sc)))),
        ),
        h('button', {
          class: 'btn btn-primary',
          onclick: () => {
            if (!label.trim()) { toast('Label the key so you can revoke it later', 'warn'); return; }
            const bytes = new Uint8Array(24);
            crypto.getRandomValues(bytes);
            const key = `aos_live_${[...bytes].map((b) => b.toString(16).padStart(2, '0')).join('')}`;
            ctx.store.update((st) => {
              st.apiKeys.unshift({
                id: `k${Date.now()}`, label: label.trim(), key, created: Date.now(), lastUsed: null,
                scopes: ['models:read', 'agents:run'],
              });
            });
            labelBox.value = ''; label = '';
            paint(); toast('Key issued — copy it now, it will be masked', 'ok');
          },
        }, ico('key', 'ic'), 'Issue key'),
      )),

    h('div', { class: 'grid g-side' },
      card('Encryption at rest', 'AES-256-GCM envelope',
        h('div', { class: 'card-body' },
          bullets([
            'Each tenant credential is sealed with a per-record data key.',
            'The data key is itself wrapped by the master key from the environment.',
            'Rotating the master key re-wraps data keys without re-encrypting payloads.',
            'Decryption happens only in the gateway process, never in the worker or the browser.',
          ], { mark: 'shield' }))),
      card('Bring your own OpenRouter key', 'Per-tenant override',
        h('div', { class: 'card-body' },
          h('div', { class: 'tiny muted' },
            'A tenant can supply its own ', h('code', null, 'OPENROUTER_API_KEY'),
            ' and the gateway will prefer it over the platform key, so inference is billed directly to them and the platform never sees the spend. ',
            'Set yours on the Settings page to switch this demo from the simulator to live calls.'))),
    ),
  );
}

       function settingsPage(ctx) {

  const host = h('div');

        h('div', { class: 'card-body stack' },

            )),

              ], { mark: 'info' }))),
          )),
        ),

  return h('div', null,
    pageHead('Settings', 'Routing policy, tenant identity and the one credential the platform needs.'),
